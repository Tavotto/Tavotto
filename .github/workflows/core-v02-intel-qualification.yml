name: Core v0.2 Intel qualification

on:
  push:
    branches: [codex/tavotto-core-v02-intel-ci]
    paths: [.github/workflows/core-v02-intel-qualification.yml]

permissions:
  contents: read

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_NO_UPDATE_CHECK: "1"
  TAVOTTO_REQUIRE_RUNTIME: "1"
  TAVOTTO_REQUIRE_PRIVATE_PYTHON: "1"

jobs:
  intel-app:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 8c35fb77b2d7fd0cfd7c7e9dcd0d64a776d996a9
          persist-credentials: false
      - name: Verify candidate and host
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8c35fb77b2d7fd0cfd7c7e9dcd0d64a776d996a9"
          test "$(uname -m)" = x86_64
          git log -1 --format='%H %s'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: x64
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.27.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          architecture: x64
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - name: Build native Intel application
        run: |
          set -euo pipefail
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python scripts/build_desktop.py --bundles app
      - name: Verify copied application and bundled runtime
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/我的 应用 目录"
          mkdir -p "$dest"
          app="$dest/Tavotto.app"
          ditto src-tauri/target/release/bundle/macos/Tavotto.app "$app"
          min_os=$(python -c 'import json; print(json.load(open("src-tauri/tauri.intel.conf.json"))["bundle"]["macOS"]["minimumSystemVersion"])')
          python scripts/codesign_macos.py scan --app "$app" --quiet --expect-arch x86_64 --expect-min-os "$min_os"
          python scripts/codesign_macos.py verify --app "$app" --expect-arch x86_64
          sidecar="$app/Contents/Resources/sidecar/Tavotto/Tavotto"
          python scripts/smoke_desktop.py --sidecar "$sidecar"
          python scripts/smoke_app.py --exe "$sidecar" --figures examples/runtime_check \
            --expect-source bundled --expect-runtime --expect-control-plane workerd \
            --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib --tutorial
          printf 'TAVOTTO_EXE=%s\n' "$sidecar" >> "$GITHUB_ENV"
      - name: Verify chart binding, save, cold reopen and export
        working-directory: web
        run: |
          set -euo pipefail
          pnpm exec playwright install webkit
          pnpm e2e --project=webkit chart-document.spec.ts
