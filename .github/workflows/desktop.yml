name: Desktop apps

# 打独立应用：macOS .dmg（签名 + 公证）与 Windows .exe（未签名）。
#
# **Windows 包自带 Magplot 私有的渲染环境**（`runtime/`：CPython 3.13 embeddable
# + 锁定版本的 numpy/matplotlib/pandas/scipy/seaborn/Pillow）：用户不需要先装
# Python，首次渲染也不联网。构建、校验与 import 冒烟都在 scripts/build_worker_runtime.py
# 里，MAGPLOT_REQUIRE_RUNTIME=1 保证「忘了构建」会当场失败而不是发出一个
# 装完不能渲染的包。
#
# **主程序进程里始终不含 matplotlib**：科学栈只存在于 worker 那一侧。
#
# macOS 包不带内置 runtime（那边用户装 Python 的门槛低得多，而 .dmg 还要过
# 公证——多几万个二进制文件会让签名与公证时间失控）。macOS 上渲染仍走
# 用户自己的环境或 Magplot 自建的 venv，行为与从前完全一致。
# 见 packaging/magplot.spec 的文件头。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "基于哪个 tag 构建（如 v0.1.1）"
        required: true
      attach:
        description: "构建完挂到该 tag 的 Release 上"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   artifact: dmg }
          - { os: windows-latest, artifact: exe }
    runs-on: ${{ matrix.os }}
    # secrets 提到 job 级：步骤自身 env 块里的变量能否用于该步骤的 if 有歧义，
    # 而 job 级 env 在 step if 里是明确可用的。没配 secret 时这些就是空串，
    # 签名/公证步骤整段跳过，产出未签名的包而不是让整个流水线红。
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 确认该 tag 含打包配置
        shell: bash
        run: |
          test -f packaging/magplot.spec || {
            echo "::error::${{ inputs.tag }} 这个 tag 里没有 packaging/——"\
                 "打包配置是后来才加的，请选一个更新的 tag"
            exit 1
          }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端进包
        run: python scripts/build_frontend.py

      - name: 缓存 CPython embeddable 下载
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: build/runtime-cache
          key: cpython-embed-${{ hashFiles('packaging/runtime-lock.json') }}

      - name: 构建内置渲染 runtime（仅 Windows）
        # 脚本自己做 SHA-256 校验、按 .dist-info 核对版本，并逐个 import +
        # 画一张真图。任何一步不过就失败在这里——发出去之后再发现就晚了。
        if: runner.os == 'Windows'
        run: python scripts/build_worker_runtime.py --clean

      - name: 装打包依赖
        # 只装 Flask 父进程那点依赖：科学栈刻意不装，免得 PyInstaller 顺手打进去
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install "flask>=3.1,<4" "pymupdf>=1.24,<2"

      - name: PyInstaller
        env:
          # Windows 的发行包必须自带 runtime；macOS 不带，spec 自动跳过
          MAGPLOT_REQUIRE_RUNTIME: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: pyinstaller packaging/magplot.spec --noconfirm

      - name: 发布前冒烟：内置 runtime 真能渲染（仅 Windows）
        # 发行工作流也要过这一关。CI 里已经有同样的门禁，但发行走的是另一个
        # tag / 另一台机器，产物不一样就得各自验各自的。
        if: runner.os == 'Windows'
        run: |
          $env:MM_WORKER_PYTHON = $null
          python scripts/smoke_app.py --exe dist/Magplot/Magplot.exe `
            --figures examples/runtime_check --expect-source bundled `
            --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib

      # ---------------- macOS：签名 + 公证 ----------------
      - name: 导入签名证书
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          # 关键：必须把钥匙串加进**搜索列表**。codesign 只在搜索列表里找身份，
          # default-keychain 单独设不够，--keychain 参数在新版 macOS 上也不可靠——
          # 症状是 "no identity found"，而 PyInstaller 留下的 adhoc 签名会让随后的
          # codesign --verify 照样通过，非常容易误判成签名成功（本机实测过）。
          EXISTING=$(security list-keychains -d user | sed 's/^ *"//;s/"$//')
          # 下面一行有意不加引号：要按空白拆成多个钥匙串路径
          # shellcheck disable=SC2086
          security list-keychains -d user -s /tmp/build.keychain $EXISTING
          security unlock-keychain -p ci /tmp/build.keychain
          security set-keychain-settings -lut 21600 /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci /tmp/build.keychain >/dev/null
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning /tmp/build.keychain

      - name: 签名 .app
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          # --deep 已废弃且对 PyInstaller 的嵌套二进制不可靠：自底向上逐个签，
          # 最后签 .app 本身。hardened runtime 是公证的硬性要求。
          #
          # 必须按 `file` 的判断签**所有** Mach-O 文件，不能只挑 *.dylib / *.so：
          # PyInstaller 的包里还有 Python.framework 的可执行体和一堆无后缀的
          # 二进制，漏签任何一个，公证就会回 Invalid（只签 dylib/so 时实测如此）。
          find dist/Magplot.app -type f | while read -r f; do
            case "$(file -b "$f")" in
              *Mach-O*) codesign --force --timestamp --options runtime \
                          --sign "$MACOS_SIGN_IDENTITY" "$f" ;;
            esac
          done
          codesign --force --timestamp --options runtime \
            --entitlements packaging/entitlements.plist \
            --sign "$MACOS_SIGN_IDENTITY" dist/Magplot.app
          codesign --verify --deep --strict --verbose=2 dist/Magplot.app
          # --verify 对 adhoc 签名同样返回成功，必须显式断言签的是 Developer ID，
          # 否则「签名失败但流水线绿」会一路带到用户手里
          codesign -dvvv dist/Magplot.app 2>&1 | grep -q "Authority=Developer ID Application" || {
            echo "::error::签名没生效（仍是 adhoc）"; codesign -dvvv dist/Magplot.app; exit 1; }

      - name: 打 .dmg
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p out
          VER="${{ inputs.tag }}"; VER="${VER#v}"   # 与 wheel / 安装程序命名一致
          scripts/make_dmg.sh dist "out/Magplot-$VER-macOS.dmg"

      - name: 公证 .dmg
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        run: |
          set -euo pipefail
          VER="${{ inputs.tag }}"; VER="${VER#v}"
          DMG="out/Magplot-$VER-macOS.dmg"
          # dmg 本身也签一道：公证服务要求提交物已签名
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$DMG"

          CREDS="--apple-id $APPLE_ID --password $APPLE_APP_PASSWORD --team-id $APPLE_TEAM_ID"
          # shellcheck disable=SC2086
          ID=$(xcrun notarytool submit "$DMG" $CREDS --output-format json |
               python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "提交 ID: $ID"
          # shellcheck disable=SC2086
          xcrun notarytool wait "$ID" $CREDS || true
          # shellcheck disable=SC2086
          STATUS=$(xcrun notarytool info "$ID" $CREDS --output-format json |
                   python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "公证结果: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            # 没有这份日志，Invalid 就是个哑谜——它会逐个列出哪个二进制没签好
            echo "::group::公证详细日志"
            # shellcheck disable=SC2086
            xcrun notarytool log "$ID" $CREDS || true
            echo "::endgroup::"
            exit 1
          fi
          # 装订：装订过的 dmg 在离线机器上也能通过 Gatekeeper
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      # ---------------- Windows ----------------
      - name: 做安装程序
        if: runner.os == 'Windows'
        # 必须用 pwsh 而不是 bash：Git Bash 的 MSYS 会把 `/DVersion=x` 当成路径
        # 改写成 `C:/Program Files/Git/DVersion=x`，ISCC 于是报
        # 「You may not specify more than one script filename」。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          choco install innosetup --no-progress -y | Out-Null
          $ver = "${{ inputs.tag }}" -replace '^v', ''
          # ISCC 脚本自己会检查 dist 里有没有内置 runtime，漏了直接编译失败
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$ver" packaging\magplot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败" }
          # 另附一份免安装 zip：有些机构禁止运行未签名安装程序，解压即用能绕开。
          # zip 走的是同一个 dist\Magplot 目录，内置 runtime 自然也在里面。
          & 7z a -tzip "out\Magplot-$ver-Windows-portable.zip" "dist\Magplot" | Out-Null
          # 两份产物都必须含 runtime——免安装 zip 漏了它，用户解压后一样不能渲染
          $zipHasRuntime = (& 7z l "out\Magplot-$ver-Windows-portable.zip") -match "runtime-manifest.json"
          if (-not $zipHasRuntime) { throw "免安装 zip 里没有内置 runtime" }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

      - name: 挂到 Release
        if: inputs.attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: out/*
