name: Release

# **这是发布的唯一编排入口。** 桌面构建经 `workflow_call` 在这里被调用，
# 不再由 tag 自己触发、也不再轮询等 Release 出现（那段 190 分钟的
# `seq 1 380 … sleep 30` 已经删掉）。
#
#   trust → build ─┬─► lab_release_gate ─┐
#                  ├─► desktop（workflow_call）─┤
#                  └────────────────────────────┴─► validate_artifacts
#                                                        │
#                                                   publish（只在 publish=true）
#                                                        ├─ github_release
#                                                        └─ pypi
#
# **publish=false 是默认。** 一次 workflow_dispatch 演练会在指定的精确 SHA 上
# 走完整条链——wheel/sdist、Windows 与 macOS 最终产物（含签名公证）、
# 发行资格验证、SBOM、checksum、provenance、updater 清单、产物清单校验
# ——**唯独不建 Release、不发 PyPI、不打 tag**。
#
# 为什么非要有这一档：v0.9.0 与 v0.9.1 两个正式 tag 都是在发布链上第一次
# 被执行时炸掉的，而 tag ruleset 是 immutable——它们至今改不动也删不掉，
# 仓库里躺着两个没有 Release 的 tag。**正式 tag 不该承担「第一次测试这条链」
# 的职责。** 推荐流程：
#
#   main 上定好版本
#     → workflow_dispatch(ref=<精确 SHA>, publish=false)   ← 完整演练
#     → 演练全绿之后，在**同一个 SHA** 上打正式 tag
#     → tag 触发同一套编排并 publish
#
# 打 tag 即发布：v0.1.0 → 构建一次 → 建 GitHub Release → 发 PyPI。
#
# 三个 job 共用 build 产出的**同一份**产物：GitHub Release 上的 wheel 与 PyPI 上的
# 必须字节一致，否则「检查更新」装到的和 pip 装到的会是两个东西。
#
# 为什么 PyPI 发布在这个文件里而不是单独一个工作流：Release 是本工作流用
# GITHUB_TOKEN 建的，而 GitHub 明确规定 GITHUB_TOKEN 触发的事件不会再触发新的
# 工作流运行（防递归）——`on: release: published` 那条链根本不会响。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "在哪个 commit 上跑（精确 SHA，或一个 tag / 分支名）"
        required: true
        default: main
      publish:
        description: >-
          建 Release / 发 PyPI。**默认关**——不打勾就是一次完整演练：
          该造的产物一个不少、该跑的门禁一条不落，就是什么都不发布。
        required: false
        default: false
        type: boolean
      pypi:
        description: "publish 打勾时发到哪里"
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]
      ack_open_blockers:
        description: >-
          对 open 的 release:blocker issue 的显式签字（逗号分隔编号，如
          "35,83"）。必须与当前 open 清单逐条对得上；留空 = 声明当前没有
          open blocker。有 blocker 而不签字，发布链在 trust 就停下。
        required: false
        default: ""

# 默认只读。真正要写的两个 job（github_release 建 Release、pypi 走 OIDC）
# 已各自在 job 级声明了自己那份权限——build 只是造产物，不该继承仓库默认的
# contents: write。
permissions:
  contents: read

# CI 里跑起来的每一个 Tavotto 进程都**硬关**匿名用量统计。
# 单靠「配置目录是新的、同意态是 unset」不够：那是默认值，而默认值会变、
# 会被某个用例改掉、会被缓存的用户目录带进来。CI 绝不能产生真实的产品事件——
# 一台每天跑几十次的机器足以让「有多少人在用」这个数字彻底失真。
# 与 TAVOTTO_NO_UPDATE_CHECK 是两个独立开关，别指望其中一个代管另一个。
env:
  TAVOTTO_NO_TELEMETRY: "1"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 信任链第一环（GitHub 托管机）：把 tag 解析成精确 SHA，并验证它
  # **可达于受保护的 origin/main**。tag 是可移动的引用，而本工作流后面
  # 站着 PyPI OIDC 与 Release 写权限——一个指向未经评审 commit 的 tag
  # 绝不能进入任何 secret-bearing 路径（1.0 审计 P1-04）。
  # 其余所有 job 只认这里输出的 SHA，不再各自 checkout tag 名。
  # ────────────────────────────────────────────────────────────────
  trust:
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    # 顶层是 contents: read；这里加 issues: read 是给 release-blocker 门禁
    # 查 label 用的。job 级 permissions 会整个替换默认，contents 要重申。
    permissions:
      contents: read
      issues: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ── Release-blocker 门禁：未执行的 release-blocker 验证不许无声跨版本 ──
      # issue #35 把「真实 N-1 更新」列为退出条件后，带着这个已知未验证的洞
      # 又发了多个 0.x 版本——没有任何机制在发版时把它摆到眼前。这与 #78
      # （「声明了却从未执行的 job」）同族，只是洞活在 issue 里不在 YAML 里。
      # 规则与判定全在 scripts/ci/release_blockers.py（可单测、可反证）：
      # 有 open 的 release:blocker 就必须在 dispatch 输入里**逐条**签字，
      # 不是禁止发（0.x 需要灵活），是把「明知有洞还发」变成显式决定。
      # 演练（publish=false）也过这道门：演练的意义就是提前撞上发布日会撞的墙。
      - name: Release-blocker 门禁（明知有洞不许无声发布）
        env:
          GH_TOKEN: ${{ github.token }}
          ACK: ${{ inputs.ack_open_blockers }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues?labels=release:blocker&state=open&per_page=100" \
            > "$RUNNER_TEMP/open-blockers.json"
          python3 scripts/ci/release_blockers.py \
            --issues-json "$RUNNER_TEMP/open-blockers.json" \
            --ack "${ACK:-}" --event "$EVENT"

      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REF_IN: ${{ inputs.ref }}
          PUBLISH_IN: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            # tag 触发：tag → 精确 SHA。**永远 publish**。
            if ! SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null)"; then
              echo "::error::$TAG 不是本仓库里的一个 tag——拒绝进入发布链"
              exit 1
            fi
            REL_TAG="$TAG"
            PUBLISH=true
          else
            # 手动触发：可以是精确 SHA、tag 名或分支名。
            if ! SHA="$(git rev-parse --verify "${REF_IN}^{commit}" 2>/dev/null)"; then
              echo "::error::解析不了 ref=$REF_IN"
              exit 1
            fi
            REL_TAG=""
            PUBLISH="${PUBLISH_IN:-false}"
          fi

          # **可达性对两条路都要验。** 这条门禁站在 PyPI OIDC 与 Release 写
          # 权限前面：一个指向未经评审 commit 的 ref 绝不能进入任何
          # secret-bearing 路径（审计 P1-04）。演练也不放行——演练用的 runner、
          # secret 与正式发布是同一批。
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA 不可达于 origin/main——发布链只接受已经合并进受保护 main 的提交"
            exit 1
          fi

          # **版本号从源码读，不从 tag 名推。** tag 名是人手打的，
          # 源码里那个才是 wheel 真正会带的版本；两者不一致必须当场发现，
          # 而不是等 PyPI 拒收（PyPI 上同名文件永远不能重传）。
          VER="$(git show "$SHA:src/tavotto/__init__.py" \
                 | sed -n 's/^__version__ = "\(.*\)"$/\1/p')"
          if [ -z "$VER" ]; then
            echo "::error::读不出 $SHA 上的 __version__"
            exit 1
          fi
          if [ -n "$REL_TAG" ] && [ "$REL_TAG" != "v$VER" ]; then
            echo "::error::tag $REL_TAG 与源码版本 $VER 对不上"
            exit 1
          fi
          [ -n "$REL_TAG" ] || REL_TAG="v$VER"

          # **tag 已经存在时，它必须指向同一个 commit。**
          # `action-gh-release` 的 `target_commitish` 只在 tag **不存在**时
          # 起作用；tag 已存在的话它直接复用现有那个，而现有 tag 完全可能
          # 指向别处 —— 那时 Release 挂的 tag 与产物来自两个 commit，
          # 而没有任何一步会报错。
          #
          # 这不是假想：仓库里此刻就躺着 v0.9.0 与 v0.9.1 两个指向旧 commit、
          # 且因为 immutable ruleset 改不动也删不掉的 tag。一次
          # 「补发 v0.9.1」的手工 dispatch 正好会踩中。
          # （Codex 在第二轮上指出。）
          if EXISTING="$(git rev-parse --verify "refs/tags/${REL_TAG}^{commit}" 2>/dev/null)"; then
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::tag $REL_TAG 已经存在，且指向 $EXISTING —— 而本次要发布的是 $SHA。"
              echo "::error::tag ruleset 是 immutable，它移不动。要发这个 SHA 请换一个版本号。"
              exit 1
            fi
            echo "· tag $REL_TAG 已存在且指向同一个 commit，复用它"
          fi

          {
            echo "sha=$SHA"
            echo "version=$VER"
            echo "tag=$REL_TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "✅ $SHA（可达 origin/main）· 版本 $VER · tag $REL_TAG · publish=$PUBLISH"
          {
            echo "### 发布编排"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发 | \`$EVENT\` |"
            echo "| SHA | \`$SHA\` |"
            echo "| 版本 | \`$VER\` |"
            echo "| tag | \`$REL_TAG\` |"
            echo "| **publish** | **$PUBLISH** |"
            if [ "$PUBLISH" != "true" ]; then
              echo ""
              echo "> **演练（publish=false）**：产物照造、门禁照跑，"
              echo "> 但**不建 Release、不发 PyPI**。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: trust
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端进包
        run: python scripts/build_frontend.py

      - name: 打 wheel 与 sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: 核对包版本与 trust 解析出的一致
        env:
          VER: ${{ needs.trust.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/tavotto-${VER}-py3-none-any.whl" || {
            echo "::error::造出来的 wheel 不是版本 $VER；dist/ 实际内容："
            ls dist/
            exit 1
          }

      - name: 元数据与 README 渲染自检
        # PyPI 项目页会渲染 README，渲染失败整段会变成纯文本；上传不可撤销，
        # 必须在传之前就发现。
        run: python -m twine check --strict dist/*

      - name: 装进干净环境冒烟
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "
          from pathlib import Path
          import tavotto
          assert (Path(tavotto.__file__).parent / 'web' / 'index.html').is_file()
          print('ok', tavotto.__version__)
          "

      # ── 完整 Codex 插件（ADR 0043）───────────────────────────────────────
      # **在这里造，只造这一次。** 这个 job 有 Node、有刚 checkout 的固定发行 SHA、
      # 有刚装了 wheel 的干净环境：画布从本次源码真构建，插件按 git 清单 + 显式构建物
      # 组装，随包清单记下 source_sha / 构建输入指纹 / 内容摘要，然后**用发出去的
      # 那份 wheel 里的引擎**真起 server 读一遍画布资源。下游（validate / Release /
      # 发行分支）只消费 dist/ 里这一份 zip，谁都不再从源码目录打包——从前
      # validate_artifacts 在一台没有 Node 的机器上直接 zip 源码目录，画布是不是
      # 本次源码构建的、在不在，那一步都答不了。
      - name: 构建 MCP 画布 + 组装并验证完整插件
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
          TAG: ${{ needs.trust.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/plugin/stage"
          python3 scripts/build_mcp_widget.py --out "$RUNNER_TEMP/plugin/canvas.html" --json
          python3 scripts/plugin_stage.py stage --widget "$RUNNER_TEMP/plugin/canvas.html" \
            --out "$STAGE" --source-sha "$SOURCE_SHA" \
            --audit "workflow=release" --audit "run_id=$RUN_ID" --audit "tag=$TAG"
          python3 scripts/plugin_stage.py verify "$STAGE" \
            --source-sha "$SOURCE_SHA" --version "$VER" --serve /tmp/smoke/bin/python
          # 清单 + 确定性 zip 都从这份 staging 出；zip 再解包验一次（dotfiles / 模式 / 摘要）
          python3 scripts/make_plugin_manifest.py --tag "$TAG" \
            --out dist/codex-plugin.json --zip "dist/codex-plugin-${VER}.zip" \
            --plugin-dir "$STAGE" --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/plugin_stage.py verify "dist/codex-plugin-${VER}.zip" \
            --source-sha "$SOURCE_SHA" --version "$VER" \
            --content-digest "$(python3 scripts/plugin_stage.py digest "$STAGE")" --json
          cp "$STAGE/plugin-build.json" dist/codex-plugin-build.json
          cat dist/codex-plugin.json

      - name: 这条腿的产物清单
        # **下游唯一的文件名出处。** 从前 SBOM、SHA256SUMS、provenance、
        # Release 附件、PyPI 校验、exact artifact 冒烟七处各自猜一次
        # ——#63 就是其中一处猜错了（把 `dist/*.whl` 喂给只认单个路径的 syft，
        # 而那句 glob 被原样当成文件名）。
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/artifact_manifest.py build \
            --version "$VER" --source-sha "$SOURCE_SHA" \
            --out dist/artifact-manifest-python.json \
            --add "wheel:dist/tavotto-${VER}-py3-none-any.whl:python" \
            --add "sdist:dist/tavotto-${VER}.tar.gz:python" \
            --add "codex-plugin:dist/codex-plugin-${VER}.zip:any" \
            --add "codex-plugin-manifest:dist/codex-plugin.json:any" \
            --add "codex-plugin-build:dist/codex-plugin-build.json:any"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-manifest-python
          path: dist/artifact-manifest-python.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 桌面产物（Windows + macOS）。**由这里调用，不再由 tag 自己触发。**
  #
  # 从前它是一条独立 workflow，由同一个 tag 并行启动，构建完轮询
  # `gh release view` 等 Release 出现（最长 190 分钟）。那个拓扑的毛病不是
  # 「等太久」：
  #   · 等待没有上界——lab gate 的**排队**时间本身没有上界；
  #   · 两条腿各自 checkout tag，而 tag 是可移动的引用，
  #     **「同一个 tag」证明不了「同一个 commit」**。
  # 现在它拿的是 trust 已经验过、已经解析好的精确 SHA，产物清单里
  # 带着同一个 source_sha，validate_artifacts 会逐条核对。
  # ────────────────────────────────────────────────────────────────
  desktop:
    needs: trust
    uses: ./.github/workflows/desktop-tauri.yml
    with:
      sha: ${{ needs.trust.outputs.sha }}
      version: ${{ needs.trust.outputs.version }}
      # **恒为 true，不跟着 publish 走。**
      # 从前这里传的是 `publish`，于是 `publish=false` 的演练把桌面侧的
      # 签名凭据门禁、provenance 与整个 `updater-manifest` job 一起关掉了
      # ——演练于是验不到发布链上**最容易悄悄坏掉的那两段**：签名/公证，
      # 和 latest.json（少了它，桌面用户永远查不到新版本，而且全绿）。
      #
      # 「是不是发行构建」与「挂不挂 Release」是两件事。本工作流根本不挂
      # Release（那归下面的 github_release job），所以它不需要知道 publish。
      # 演练的定义是**产物一个不少、门禁一条不落，只是不发布**。
      release_build: true
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write        # 桌面产物 provenance
      attestations: write

  # ────────────────────────────────────────────────────────────────
  # 发行资格验证（实验室 Linux runner）
  #
  # 插在 build 与「建 Release / 发 PyPI」之间。它验的是 **build 产出的那一份
  # wheel**，不是「同一个 commit 重新造一个差不多的东西」——本工作流开头那条
  # 「三个 job 共用 build 产出的同一份产物」的原则，在这里同样成立。
  #
  # tag → SHA 的解析与 main 可达性验证在最上面的 trust job（GitHub 托管机）：
  # 不能把 tag 名一路传给 self-hosted 再解析——tag 是可移动的引用，
  # 验证之后、执行之前它仍可能被指向别处。
  #
  # 安全：这个 job 不需要写权限。顶层已是 contents: read，此处不再上调；
  # 长期 runner 拿不到 id-token / contents: write，也就拿不到 PyPI 与 Release
  # 的任何签发能力。
  # ────────────────────────────────────────────────────────────────
  lab_release_gate:
    needs: [build, trust]
    # **步骤定义在 `_lab-qualification.yml`——与 lab-ci.yml 用的是同一份。**
    # `use_prebuilt_dist: true` 让它验 build job 产出的**那一份** wheel，
    # 不是「同一个 commit 重新造一个差不多的东西」。
    #
    # 这条门禁刻意**没有 fallback**：「runner 离线 → 跳过 gate → 照发」
    # 等于它在最需要的时候自动消失。runner 不可用时这个 job 会排队或失败，
    # 那正是期望行为。
    uses: ./.github/workflows/_lab-qualification.yml
    with:
      mode: release
      sha: ${{ needs.trust.outputs.sha }}
      use_prebuilt_dist: true
    secrets: inherit

  # ────────────────────────────────────────────────────────────────
  # 产物汇总与校验。**演练也跑这一整段** —— 这是 publish=false 有意义的
  # 关键：SBOM、checksum、provenance、updater 清单、插件清单全都真的产出、
  # 真的校验，只是最后不发布。从前这些步骤全在建 Release 那个 job 里，
  # 而那个 job 自 v0.8.0 起**一次都没成功执行过**，于是 #63 那个 bug
  # （SBOM 拿到一串 glob）在仓库里躺了好几周，没有任何信号。
  # ────────────────────────────────────────────────────────────────
  validate_artifacts:
    needs: [trust, build, desktop, lab_release_gate]
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    outputs:
      # has_notes = 有没有手写正文；release body（支持段 + 签名披露）两种情况都有
      has_notes: ${{ steps.notes.outputs.has_notes }}
    permissions:
      contents: read
      id-token: write          # provenance 签发
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: desktop
          pattern: desktop-tauri-*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: manifests
          pattern: artifact-manifest-*
      # **不再 continue-on-error。** 桌面链现在恒以 release_build=true 运行，
      # `updater-manifest` job 因此总会产出 latest.json（产不出来它自己就红了，
      # 那是 P1-07 有意的硬失败）。允许这一步失败，等于把一次 artifact 传输
      # 或改名故障变成「发了一个没有 latest.json 的 Release」——而那意味着
      # 桌面用户永远查不到新版本，且整条链全绿。v0.7.0 就是这么发出去的。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: updater-manifest, path: out }

      - name: 把桌面产物摊平到 dist/
        # 各条腿的清单记的路径相对各自的 out/；合并之后要能在同一个目录里
        # 逐个核对哈希，所以先摊平，再把清单里的路径也改成同一套。
        shell: bash
        run: |
          set -euo pipefail
          find desktop -mindepth 2 -type f -print0 | xargs -0 -I{} mv -n {} dist/
          ls -la dist/

      - name: 合并并校验产物清单
        # **这一步是「同一个 SHA」真正被证明的地方。**
        # 「同一个 tag」证明不了它——tag 是可移动的引用，两条腿各自 checkout
        # 时它可能已经指向别处，而没有任何一步会报错。
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/normalise_manifest_paths.py manifests --into dist
          python3 scripts/ci/artifact_manifest.py merge \
            manifests/*/artifact-manifest-*.json --out artifact-manifest.json
          python3 scripts/ci/artifact_manifest.py verify artifact-manifest.json \
            --require wheel,sdist,windows-installer,macos-installer,codex-plugin,codex-plugin-manifest,codex-plugin-build \
            --version "$VER" --source-sha "$SOURCE_SHA"

      - name: 完整插件：成对验证（zip 内容 + 版本清单 + 随包清单互相对得上）
        # 「缺 canvas 不准发」在 build job 里已经拦过一次（组装时点名 REQUIRED）；
        # 这里在**搬运之后**再验一次整份内容，并核对三份文件说的是同一个插件：
        # zip 里的 plugin-build.json 的 source_sha == trust 的 SHA、版本 == VER、
        # codex-plugin.json 的 latest_version / download_url 指向的正是这个 zip。
        # 只查文件名存在不算验证。
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          ZIP="$(python3 scripts/ci/artifact_manifest.py path artifact-manifest.json --role codex-plugin)"
          META="$(python3 scripts/ci/artifact_manifest.py path artifact-manifest.json --role codex-plugin-manifest)"
          BUILD="$(python3 scripts/ci/artifact_manifest.py path artifact-manifest.json --role codex-plugin-build)"
          DIGEST="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['content_digest'])" "$BUILD")"
          python3 scripts/plugin_stage.py verify "$ZIP" \
            --source-sha "$SOURCE_SHA" --version "$VER" --content-digest "$DIGEST" --json
          python3 - "$META" "$ZIP" "$VER" <<'PY'
          import json, os, sys
          meta, zip_path, ver = json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2], sys.argv[3]
          assert meta["latest_version"] == ver, (meta["latest_version"], ver)
          assert meta["download_url"].rsplit("/", 1)[-1] == os.path.basename(zip_path), (meta["download_url"], zip_path)
          print("插件版本清单与 zip 成对：", meta["latest_version"], os.path.basename(zip_path))
          PY

      - name: 从清单里取出具体路径（单值输入只能收这个）
        id: paths
        run: |
          set -euo pipefail
          # **`out/` 要在这里就建好。** 2026-08-22 实测（run 32578844828，
          # `github_release` 这个 job **有史以来第一次真正执行**）：#63 的修复
          # 生效了，syft 拿到具体路径并成功扫完——然后 sbom-action 写输出时
          # 报 `ENOENT: no such file or directory, open 'out/…'`，因为
          # `mkdir -p out` 在**下一步**（SHA-256 那步）才做。
          #
          # 这正是这条链的固有形状：每一步都是第一次执行，于是一步一步地
          # 依次失败。`publish=false` 演练就是为了让这种失败发生在演练里，
          # 而不是发生在一个改不动也删不掉的正式 tag 上。
          #
          # **不靠上面那个 download-artifact 顺带建出 out/**：它带着
          # `continue-on-error`（没配 minisign 私钥时那个 artifact 不存在），
          # 于是 out/ 存不存在取决于有没有配签名密钥——一个下游步骤的成败
          # 取决于一件与它完全无关的事，那种耦合迟早出事。
          mkdir -p out
          W="$(python3 scripts/ci/artifact_manifest.py path artifact-manifest.json --role wheel)"
          echo "wheel=$W" >> "$GITHUB_OUTPUT"
          echo "SBOM 输入: $W"

      - name: 构建产物 provenance
        # 用户可用 `gh attestation verify <文件> -R Tavotto/Tavotto` 验证
        # 「这份产物出自本仓库这次受信 SHA 的构建」（审计 P1-04 / Gate B）。
        # subject-path **明确支持多值 glob**，与只收单个路径的 syft 不同。
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/codex-plugin-*.zip

      - name: 生成 SBOM（SPDX）
        # syft 的 `file:` 收的是**一个具体路径**，不是 glob——`dist/*.whl`
        # 会被原样当成文件名，报 `no source providers were able to resolve
        # the input`（#63）。现在这个路径由产物清单解出来，**结构上不可能是
        # glob**：`artifact_manifest.build` 直接拒绝含通配符的条目。
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.paths.outputs.wheel }}
          format: spdx-json
          output-file: out/tavotto-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SHA-256 校验清单
        run: |
          set -euo pipefail
          mkdir -p out
          # 清单自己也进 checksum：它是下游七个消费者的输入，
          # 被换掉的话所有人一起读到错的东西。
          cp artifact-manifest.json dist/
          (cd dist && shasum -a 256 -- *) > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      # Codex 插件清单与安装包**不在这里生成**（ADR 0043）：它们由 build job 从固定发行
      # SHA 真构建、真验证后放进 dist/（这个 job 没有 Node，从源码目录打包答不了
      # 「画布是不是本次源码构建的」）。上面那步已经把 dist/ 里那份 zip 与两份清单
      # 成对验过。更新通道仍然是 Release 上的 codex-plugin.json——**文件名不能改**
      # （update_check.DEFAULT_URL），随 dist/* 一起挂上去。

      - name: 拼 release body（手写正文可缺，支持段与签名披露不可缺）
        id: notes
        env:
          TAG: ${{ needs.trust.outputs.tag }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          set -euo pipefail
          # 手写正文（docs/release-notes/<tag>.md）有就用、没有就让 GitHub 把
          # 自动生成的提交清单**接在 body 之后**（softprops 对 body +
          # generate_release_notes 的语义是把 body 前置）。但下面两段在
          # **两个分支里都必须出现**——只挂在手写分支上的话，没写 notes 的
          # 版本会顺便丢掉必须的披露（Codex 评审在 #107 上指出）：
          #  · 「下载与支持平台」段：从唯一权威 docs/support-matrix.json 生成
          #    （issue #34），每版手写的平台清单必然与矩阵漂移；
          #  · Code signing policy 段：SignPath Foundation 的条件要求这个词组
          #    出现在下载/发布页；措辞按 SIGNPATH_ENABLED 分岔——把未签名的
          #    包描述成已签名，正是 policy 里明令禁止的那件事。
          # 待发条目（docs/release-notes/UNRELEASED.md）必须先并进这一版的
          # 正文。行为变更与存量数据的迁移提示写在 PR 正文的「遗留」段里，
          # 发版那天没人会回头翻——issue #244 就是这么漏掉的：用户升级后
          # 一个字也看不到，而整条发布链全绿。这一步放在读手写正文**之前**，
          # 没并入就不给发。
          python scripts/check_pending_release_notes.py --tag "$TAG"
          F="docs/release-notes/${TAG}.md"
          B="out/release-body.md"
          mkdir -p out
          if [ -f "$F" ]; then
            cp "$F" "$B"
            printf '\n\n---\n\n' >> "$B"
            echo "has_notes=1" >> "$GITHUB_OUTPUT"
          else
            : > "$B"
            echo "::warning::没有 $F，正文用自动生成的提交清单"
            echo "has_notes=0" >> "$GITHUB_OUTPUT"
          fi
          python scripts/make_release_support_section.py >> "$B"
          {
            printf '\n### Code signing policy\n\n'
            if [ "$SIGNPATH_ENABLED" = "true" ]; then
              printf 'The Windows installer in this release is code signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).\n\n'
            else
              printf '**The Windows installer in this release is not code signed**, so Windows will show a SmartScreen warning on first run. Verify it against this workflow run if you want to check what you downloaded.\n\n'
            fi
            printf 'See the full [code signing policy](https://github.com/%s/blob/%s/docs/code-signing-policy.md) and [privacy policy](https://github.com/%s/blob/%s/docs/privacy.md).\n' \
                   "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_REPOSITORY" "$TAG"
          } >> "$B"

      - name: 汇总这次的产物
        if: always()
        env:
          PUBLISH: ${{ needs.trust.outputs.publish }}
          SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -f artifact-manifest.json ]; then
            python3 -c "
          import json
          m = json.load(open('artifact-manifest.json'))
          print(f\"### 本次产物 · {m['version']} · \`{m['source_sha'][:12]}\`\")
          print()
          print('| role | 文件 | 平台 | sha256 |')
          print('|---|---|---|---|')
          for a in m['artifacts']:
              print(f\"| \`{a['role']}\` | \`{a['path'].split('/')[-1]}\` | {a['platform']} | \`{a['sha256'][:16]}…\` |\")
          " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 本次产物" >> "$GITHUB_STEP_SUMMARY"
            echo "（产物清单没造出来——上游步骤失败了）" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PUBLISH" != "true" ]; then
            {
              echo ""
              echo "> **演练（publish=false）到此为止**：以上产物全部真实存在并已校验，"
              echo "> 但**不会**建 Release、不会发 PyPI。"
              echo "> 要发布：在同一个 SHA \`$SHA\` 上打 tag。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传全部发行资产
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*
            out/*
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 建 Release。**只在 publish=true 时执行**，而且**一次挂全部**——
  # 从前 wheel/SBOM 由这里挂、桌面产物由 desktop-tauri.yml 自己挂、
  # latest.json 由第三个 job 挂，三方各写一次同一个 Release，还要互相等。
  # ────────────────────────────────────────────────────────────────
  github_release:
    needs: [trust, validate_artifacts]
    if: needs.trust.outputs.publish == 'true'
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-assets, path: assets }

      - name: 校验要挂上去的就是验过的那一份
        # 下载再上传是一次真实的搬运，中间任何一环出错都可能改内容。
        # 校验一次几乎不要钱，而「Release 上挂的与发行资格验证过的不是同一个
        # 东西」是这条链上最不能接受的失败。
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/artifact_manifest.py verify \
            assets/dist/artifact-manifest.json \
            --base assets \
            --require wheel,sdist,windows-installer,macos-installer \
            --version "$VER" --source-sha "$SOURCE_SHA"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.trust.outputs.tag }}
          # **tag 不存在时，action 会替我们建一个 —— 必须钉在受信 SHA 上。**
          # 不给 target_commitish 的话它用 `GITHUB_SHA`，也就是 dispatch 时
          # 的 ref（例如 `main` 的当前 HEAD），而不是 trust 解析并验证过的
          # 那个 SHA。两者在「dispatch 之后、publish 之前 main 又前进了」时
          # 就是两个 commit —— 而这发生在整条链**最不可逆的那一步**：
          # tag ruleset 是 immutable，建错了改不动也删不掉。
          target_commitish: ${{ needs.trust.outputs.sha }}
          draft: false
          # body 永远存在（支持矩阵段 + 签名披露在两个分支都生成）；
          # 没有手写正文时让 GitHub 把自动提交清单接在 body 之后
          body_path: assets/out/release-body.md
          generate_release_notes: ${{ needs.validate_artifacts.outputs.has_notes != '1' }}
          # codex-plugin.json 的**文件名不能改**：插件拉的是
          # releases/latest/download/codex-plugin.json（见 update_check.DEFAULT_URL）
          # `files` 明确支持多行 glob——与只收单个路径的 syft 不同。
          # codex-plugin.json 与 codex-plugin-<版本>.zip 在 assets/dist/ 里（build job
          # 造的、validate 成对验过的那一份），随 `assets/dist/*` 一起挂上。
          files: |
            assets/dist/*
            assets/out/SHA256SUMS.txt
            assets/out/tavotto-sbom.spdx.json
            assets/out/latest.json

      # 官网的下载按钮直连安装包：版本、大小、校验和都在构建时从这次 Release 的
      # artifact-manifest.json 里读出来（Tavotto_website 的 scripts/sync-release.mjs）。
      # 所以 Release 发出去之后要让站点重建一次，否则按钮还指着上一版。
      #
      # 用 Deploy Hook 而不是 PAT 或 Vercel CLI：它只是一个 URL，含义是「用 main
      # 重建这个项目」，拿到它也做不了别的；不需要 token 轮换，也不需要在官网仓库
      # 里再放一个接收用的 workflow。另外两种方案还都得先在官网仓库里造出一个
      # commit，而一次产品发布并不会改官网的任何一行。
      #
      # 这一步永远不让发布失败。Release 已经在上一步发出去了，站点晚几分钟更新是
      # 可以补的（在 Vercel 上 Redeploy 一次），而在这里失败会把一次成功的发布标
      # 成红的——那是会教人忽略这条工作流状态的失败。
      - name: 通知官网重新构建
        if: success()
        continue-on-error: true
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::warning::没有配置 VERCEL_DEPLOY_HOOK，官网不会自动重建。"
            echo "配好之前，发完 Release 请手动在 Vercel 上 Redeploy 一次 tavotto-website。"
            exit 0
          fi
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' --max-time 30 "$HOOK" || echo 000)
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            echo "已通知官网重建（HTTP $code）"
          else
            echo "::warning::官网重建没触发成功（HTTP $code）。请手动 Redeploy tavotto-website。"
          fi

  # ────────────────────────────────────────────────────────────────
  # 真实 N-1 应用内更新验证（Windows）—— issue #35 的退出条件。
  #
  # 只能在**发布之后**测真链路：已发布应用的 endpoint 烤死指向
  # releases/latest，github_release 跑完的这一刻 latest.json 已指向本次
  # 版本——现在装一个 N-1 官方安装包，它查到的就是我们刚发的这一版。
  # 「发布前测不了 N-1 真链路」是结构性的，不是偷懒：发布前 latest 还指着
  # 上一版，任何「本地喂清单」的彩排测的都是 N→N 机制而非真实 N-1 二进制。
  #
  # 驱动方式：`TAVOTTO_E2E_RUN_UPDATE=1`（src-tauri/src/main.rs 的仅测试
  # 触发口，默认关死）让 N-1 的壳启动即执行 check → download → install，
  # 走的就是用户按按钮那条链路。**N-1 二进制没有这个触发口时**（0.10.0 及
  # 更早）自动化驱动不了 UI——那一轮按 docs/ci/release-qualification.md 的
  # 手动 checklist 执行并把证据记进 issue #35；有没有触发口按**装出来的
  # 二进制里有没有这个字面量**探测，不写死版本号（下一版号码此刻没人知道）。
  #
  # 失败不回滚 Release（发都发了、tag 也 immutable），但必须**红**：
  # 它意味着刚发出去的更新链对存量用户不工作，是下一步动作前的 P0 信号。
  # ────────────────────────────────────────────────────────────────
  n1_update_windows:
    needs: [trust, github_release]
    if: needs.trust.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NEW_VERSION: ${{ needs.trust.outputs.version }}
      NEW_TAG: ${{ needs.trust.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }

      - name: 找上一个正式版本（N-1）并下载官方安装包
        id: prev
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rels = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" | ConvertFrom-Json
          $prev = $rels |
            Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
            Where-Object { [version]($_.tag_name.TrimStart('v')) -lt [version]$env:NEW_VERSION } |
            Sort-Object { [version]($_.tag_name.TrimStart('v')) } -Descending |
            Select-Object -First 1
          if (-not $prev) { throw "找不到比 $env:NEW_VERSION 更早的正式 Release（首个版本没有 N-1，可手动跳过）" }
          $pv = $prev.tag_name.TrimStart('v')
          Write-Host "N-1 = $($prev.tag_name)"
          $asset = $prev.assets | Where-Object { $_.name -eq "Tavotto-$pv-Windows-Setup.exe" }
          if (-not $asset) { throw "N-1 Release 上没有 Tavotto-$pv-Windows-Setup.exe（资产：$($prev.assets.name -join ', ')）" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\n1-setup.exe"
          "prev_version=$pv" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: 静默安装 N-1 并探测 headless 触发口
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process -Wait "$env:RUNNER_TEMP\n1-setup.exe" -ArgumentList "/S"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tavotto"
          if (-not (Test-Path $key)) { throw "N-1 安装后没有卸载注册表项" }
          $inst = (Get-ItemProperty $key).InstallLocation -replace '^"|"$', ''
          $shell = Join-Path $inst "Tavotto.exe"
          if (-not (Test-Path $shell)) { throw "N-1 装完找不到壳: $shell" }
          $dv = (Get-ItemProperty $key).DisplayVersion
          Write-Host "已安装 N-1：$dv → $inst"
          "install_dir=$inst" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          # 能力探测：触发口是环境变量名的字面量，编进了壳二进制。
          # 按二进制内容判而不是版本号——「哪一版加的」在加它的那次发布之前
          # 没人知道号码，写死一个版本常量迟早说谎。
          $bytes = [System.IO.File]::ReadAllBytes($shell)
          $hay = [System.Text.Encoding]::ASCII.GetString($bytes)
          $supported = $hay.Contains("TAVOTTO_E2E_RUN_UPDATE")
          "supported=$($supported.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if (-not $supported) {
            Write-Host "N-1（$dv）没有 headless 触发口——本次转手动验证"
          }

      - name: N-1 无触发口：转手动验证（不算通过，也不红）
        if: steps.probe.outputs.supported == 'false'
        shell: pwsh
        # 不红的理由要写在明处：0.10.0 及更早的二进制没有任何测试钩子，
        # WebView2 的 UI 自动化不在首轮范围。这不是「验过了」——手动 checklist
        # 在 docs/ci/release-qualification.md，证据必须记进 issue #35，
        # 「已写进文档」不等于关闭（p2-needs-an-exit）。
        run: |
          Write-Host "::warning::N-1（${{ steps.prev.outputs.prev_version }}）无 headless 触发口，本次 N-1 更新验证需按 docs/ci/release-qualification.md 的手动 checklist 执行，证据记入 issue #35"
          @(
            '### ⚠️ N-1 应用内更新：本次需手动验证'
            ''
            'N-1（${{ steps.prev.outputs.prev_version }}）的二进制没有 TAVOTTO_E2E_RUN_UPDATE 触发口，自动化驱动不了它的更新 UI。'
            '按 docs/ci/release-qualification.md 的「真实 N-1 应用内更新」checklist 手动执行一遍，证据（版本断言 + 日志/录屏）记入 issue #35。'
            '从下一个版本起（N-1 已带触发口）本 job 全自动。'
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: 驱动真实应用内更新并断言换到了新版本
        if: steps.probe.outputs.supported == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inst  = "${{ steps.probe.outputs.install_dir }}"
          $shell = Join-Path $inst "Tavotto.exe"
          $key   = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tavotto"
          $env:TAVOTTO_E2E_RUN_UPDATE = "1"
          # 隔离数据/配置目录：别把 runner 的用户目录当垃圾场。
          # （job 级 env 用不了 runner 上下文，所以放在这里。）
          $env:TAVOTTO_DATA_DIR   = "$env:RUNNER_TEMP\n1-data"
          $env:TAVOTTO_CONFIG_DIR = "$env:RUNNER_TEMP\n1-config"
          # 壳是 windows 子系统进程，stderr 没句柄时诊断会整个消失（nightly
          # 的教训）——接到文件里
          $out = Join-Path $env:RUNNER_TEMP "n1-shell-out.log"
          $err = Join-Path $env:RUNNER_TEMP "n1-shell-err.log"
          $p = Start-Process -FilePath $shell -PassThru `
               -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "N-1 壳已启动（pid $($p.Id)），等待应用内更新……"

          # 判据一：注册表 DisplayVersion 变成新版本（NSIS /UPDATE 装完才写）。
          # 上限 20 分钟：下载 ~100MB + passive 安装。
          $updated = $false
          foreach ($i in 1..1200) {
            Start-Sleep 1
            $dv = (Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayVersion
            if ($dv -eq $env:NEW_VERSION) { $updated = $true; break }
          }
          if (-not $updated) {
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) { Write-Host "---- $f ----"; Get-Content $f -Tail 80 }
            }
            Get-Process Tavotto -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
            throw "20 分钟内 DisplayVersion 没变成 $env:NEW_VERSION（仍是 $dv）——应用内更新没走完"
          }
          Write-Host "✓ DisplayVersion → $env:NEW_VERSION"

          # 判据二：**等新进程出现，不等旧进程优雅退出**——更新装完 NSIS 以
          # /R 重启应用，旧进程 std::process::exit(0) 不走 RunEvent::Exit。
          #
          # 「新进程」的主语必须钉到**壳的映像路径**，不能钉到进程名。安装目录
          # 里有两个都叫 Tavotto.exe 的二进制——壳在安装根，sidecar 在
          # $inst\sidecar\Tavotto\Tavotto.exe（下一步的冒烟正是这么找它的）
          # ——而 `Get-Process Tavotto` 按**进程名**匹配，两个都收。sidecar 是
          # PyInstaller 产物，**根本没有版本资源**（对 0.12.0 安装包实测：壳
          # ProductVersion=0.12.0，sidecar 连 StringFileInfo 都没有），一旦选中
          # 它，ProductVersion 必然是空的，而且**等多久都不会变**——那不是时序
          # 问题，加再多重试也救不回来。v0.12.0 run 33027201414 的
          # 「✓ 新进程 pid 1284，ProductVersion=」就是这个形状：它在
          # DisplayVersion 确认后第一轮轮询（1 秒）就命中了。
          # 两侧路径**规范化后再比**，不比逐字。这三样任一对不上，首测就红在
          # 正式发布中途，代价最高：
          #  · `InstallLocation` 带不带尾部反斜杠，注册表里两种写法都有；
          #  · Windows 路径大小写不敏感，CIM 与注册表未必给同一种拼法；
          #  · 8.3 短名（`C:\Users\RUNNER~1\…`）与长名指向同一个文件。
          # 判据两个方向都要成立：同一个文件的畸形写法必须匹配上，**不同的
          # 文件必须匹配不上**——只钉一条边是这个仓库反复出现的形状。
          function Resolve-TavottoPath([string]$Path) {
            if ([string]::IsNullOrWhiteSpace($Path)) { return "" }
            $q = $Path.Trim().Trim('"')
            # GetFullPath 归并重复分隔符、解 `..`、统一分隔符
            try { $q = [System.IO.Path]::GetFullPath($q) } catch { }
            # 8.3 短名展开。**只有 Windows 有**，失败就退回上一步的结果——
            # 这一段本机（macOS）验不了，见 PR 正文的「仍未执行」一节。
            try {
              if (-not ([System.Management.Automation.PSTypeName]'TavottoLongPath').Type) {
                # 别用 @'…'@ here-string：它的定界符必须顶格，而顶格会终结
                # YAML 的块标量，整个 workflow 直接解析失败。
                $sig = '[DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]' +
                       ' public static extern uint GetLongPathName(string s,' +
                       ' System.Text.StringBuilder b, uint n);'
                Add-Type -Name TavottoLongPath -Namespace '' -MemberDefinition $sig
              }
              $sb = New-Object System.Text.StringBuilder 32767
              if ([TavottoLongPath]::GetLongPathName($q, $sb, 32767) -gt 0 -and $sb.Length -gt 0) {
                $q = $sb.ToString()
              }
            } catch { }
            return $q.TrimEnd([System.IO.Path]::DirectorySeparatorChar,
                              [System.IO.Path]::AltDirectorySeparatorChar)
          }
          $shellCanon = Resolve-TavottoPath $shell
          Write-Host "壳的规范化映像路径：$shellCanon"

          $fresh = $null
          $procPath = ""
          $seen = @{}
          foreach ($i in 1..120) {
            Start-Sleep 1
            foreach ($c in @(Get-Process Tavotto -ErrorAction SilentlyContinue)) {
              if ($c.Id -eq $p.Id) { continue }
              # 映像路径走 CIM（Win32_Process.ExecutablePath），不走 .NET 的
              # MainModule：新进程刚起时模块表可能还没填好，读回空串。
              $ci = Get-CimInstance Win32_Process -Filter "ProcessId=$($c.Id)" `
                    -ErrorAction SilentlyContinue
              $exe = if ($ci) { "$($ci.ExecutablePath)" } else { "" }
              if ([string]::IsNullOrWhiteSpace($exe)) { continue }
              $seen[$c.Id] = $exe
              if ([string]::Equals((Resolve-TavottoPath $exe), $shellCanon,
                                   [System.StringComparison]::OrdinalIgnoreCase)) {
                $fresh = $c; $procPath = $exe; break
              }
            }
            if ($fresh) { break }
          }
          if (-not $fresh) {
            $other = ($seen.GetEnumerator() |
                      ForEach-Object { "pid $($_.Key) → $($_.Value)" }) -join "; "
            if (-not $other) { $other = "（一个都没有）" }
            throw ("2 分钟内没有出现映像为 $shell 的新进程（/R 重启失败？）。" +
                   "期间看到的其它 Tavotto 进程：$other")
          }

          # 判据三：**跑起来的那个壳**是新版本。
          # 不变式的主语是「重启后新进程的 ProductVersion」
          # （docs/ci/release-qualification.md「n1_update_windows」一节）。只验
          # 安装目录里的文件不够：「装对了但 /R 起错了二进制」恰好从中间漏过去。
          # 「在安装目录下」也不够——sidecar 就在安装目录下，那条检查放它过去。
          # 判据二已经把主语钉到 $shell 的映像路径上，这里只剩版本资源。
          #
          # 版本资源从**那个映像路径**读，不从进程句柄读，并且轮询 15s：
          # 安装器此刻可能仍在替换 exe，磁盘上那份同样会读到中间态。诊断里
          # 写了轮询窗口，代码里就必须真有——错误信息本身也是断言。
          $vi = $null
          $procPv = ""
          foreach ($i in 1..15) {
            $vi = (Get-Item $procPath -ErrorAction SilentlyContinue).VersionInfo
            if ($vi) { $procPv = "$($vi.ProductVersion)".Trim() }
            if (-not [string]::IsNullOrWhiteSpace($procPv)) { break }
            Start-Sleep 1
          }
          # 句柄那份只当诊断：读不到不构成失败，但读到什么必须留在日志里
          # ——「ProductVersion 为何为空」要靠它定性（#147 关闭条件 3）。
          $handlePv = "<未读取>"
          try { $handlePv = "$($fresh.MainModule.FileVersionInfo.ProductVersion)" }
          catch { $handlePv = "<读取失败：$($_.Exception.GetType().Name)>" }

          Write-Host "✓ 新进程 pid $($fresh.Id)"
          Write-Host "  映像路径：$procPath"
          Write-Host "    ProductVersion='$procPv'  FileVersion='$(if ($vi) { $vi.FileVersion })'"
          Write-Host "  进程句柄 MainModule → ProductVersion='$handlePv'（仅诊断）"
          if ($seen.Count -gt 1) {
            Write-Host "  同名的其它 Tavotto 进程（按映像路径已排除）："
            $seen.GetEnumerator() | Where-Object { $_.Key -ne $fresh.Id } |
              ForEach-Object { Write-Host "    pid $($_.Key) → $($_.Value)" }
          }
          if ([string]::IsNullOrWhiteSpace($procPv)) {
            throw ("读不到新进程映像的 ProductVersion（$procPath，已轮询 15s）。" +
                   "pid $($fresh.Id)，句柄读值='$handlePv'——更新链可能是成功的，" +
                   "先看上面的诊断再判。")
          }
          if (-not $procPv.StartsWith($env:NEW_VERSION)) {
            throw "重启后跑的不是新版本：ProductVersion=$procPv，期望 $env:NEW_VERSION"
          }
          # 收掉窗口进程，下一步对 sidecar 冒烟
          Get-Process Tavotto -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3
          # 这一步的契约是「三条判据都过 = 成功」，别把它托付给 $LASTEXITCODE
          # 的隐式传播——那个值来自与结论无关的命令（issue #197：脚本跑到最后
          # 一行仍退 1，机制没查清，解法是把后置条件写显式）。所有失败路径都是
          # throw，走不到这里，所以不掩盖任何真失败。
          exit 0

      - name: 更新后的产物冒烟（复用 smoke_app 的既有断言）
        if: steps.probe.outputs.supported == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inst = "${{ steps.probe.outputs.install_dir }}"
          $shell = Join-Path $inst "Tavotto.exe"
          $side = Get-ChildItem $inst -Recurse -Filter Tavotto.exe |
                  Where-Object { $_.FullName -ne $shell } | Select-Object -First 1
          if (-not $side) { throw "更新后的安装目录里没有 sidecar" }
          $env:TAVOTTO_WORKER_PYTHON = $null
          python scripts\smoke_app.py --exe "$($side.FullName)" `
            --figures examples\runtime_check --expect-source bundled `
            --expect-runtime --expect-control-plane workerd
          if ($LASTEXITCODE -ne 0) { throw "更新后的 sidecar 冒烟失败（退出码 $LASTEXITCODE）" }
          @(
            "### ✅ 真实 N-1 应用内更新通过（Windows）"
            ""
            "${{ steps.prev.outputs.prev_version }} → $env:NEW_VERSION：官方安装包安装 → 应用内更新器下载/验签/解包/安装 → 重启为新版本 → 冒烟渲染通过。"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: 清理（卸载）
        if: always()
        shell: pwsh
        run: |
          Get-Process Tavotto -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tavotto"
          if (Test-Path $key) {
            $inst = (Get-ItemProperty $key).InstallLocation -replace '^"|"$', ''
            $un = Join-Path $inst "uninstall.exe"
            if (Test-Path $un) { Start-Process -Wait $un -ArgumentList "/S" }
          }

      - name: 失败时收集日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n1-update-windows-logs
          path: |
            ${{ runner.temp }}/n1-shell-*.log
            ${{ runner.temp }}/n1-data/**/app.log
          if-no-files-found: warn
          retention-days: 14

  pypi:
    # 同上：lab gate 不过就不发 PyPI。PyPI 上的同名文件永远不能重传，
    # 所以这里比 Release 更没有「先发了再说」的余地。
    needs: [trust, validate_artifacts]
    # **publish=false 时一律不发。** 这是演练与发布之间唯一的开关，
    # 而 PyPI 比 Release 更没有「先发了再说」的余地：同名文件永远不能重传。
    #
    # PyPI 侧的 trusted publisher 配好之前，tag 触发的自动发布只会红一次
    # 给人添堵——用仓库变量 PYPI_PUBLISH_ENABLED=true 开闸
    # （Settings → Variables）。手动触发时按 inputs.pypi 走，none 则跳过。
    if: >-
      needs.trust.outputs.publish == 'true' && (
        (github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.pypi != 'none')
      )
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    # PyPI 上的项目名一旦被占用就再也拿不回来，同名文件也永远不能重传。
    # environment 让正式发布可以卡一道人工确认（给它加 required reviewers 即可）。
    environment:
      name: ${{ inputs.pypi == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.pypi == 'testpypi' && 'https://test.pypi.org/p/tavotto' || 'https://pypi.org/p/tavotto' }}
    permissions:
      id-token: write     # OIDC 签发，Trusted Publishing 的必需权限
    steps:
      # 要跑 `artifact_manifest.py`，所以这个 job 也得有仓库
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-assets, path: assets }

      - name: 只把 wheel 与 sdist 交给 PyPI
        # `release-assets` 里还有安装包、SBOM、清单——PyPI 只收 wheel/sdist，
        # 多喂一个它会整批拒收，而那时**前面的文件可能已经传上去了**
        # （同名文件永远不能重传，等于这个版本号作废）。
        #
        # **路径从清单取，不 glob。** 上一版写的是
        # `cp assets/dist/*.whl assets/dist/*.tar.gz dist/`——而摊平之后
        # `dist/` 里的 `*.tar.gz` **同时匹配 Python sdist 与 macOS 的
        # `Tavotto.app.tar.gz`**（那是桌面更新包）。于是这一步会把一个
        # 桌面更新包交给 PyPI。
        #
        # 这正是「七个下游步骤各自猜文件名」（#63）的复发，而且发生在
        # **刚刚引入产物清单的这条 PR 里** —— 清单就是为了让这种猜测不可能。
        # （Codex 在第二轮上指出。）
        run: |
          set -euo pipefail
          mkdir -p dist
          M=assets/dist/artifact-manifest.json
          for role in wheel sdist; do
            src="assets/$(python3 scripts/ci/artifact_manifest.py path "$M" --role "$role")"
            echo "PyPI ← $role: $src"
            cp "$src" dist/
          done
          ls -la dist/
          # 二次确认：交给 PyPI 的必须**恰好两个**文件
          n=$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')
          [ "$n" = "2" ] || { echo "::error::dist/ 里有 $n 个文件，PyPI 只该收 2 个"; exit 1; }

      - name: 发布到 TestPyPI
        if: inputs.pypi == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true      # 演练可以重跑，同名文件跳过而不是整个失败

      - name: 发布到 PyPI
        if: inputs.pypi != 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true

  # ────────────────────────────────────────────────────────────────
  # 发行分支 `plugin-stable` 推进（ADR 0043）。
  #
  # marketplace 的安装入口读的是这条分支：用户装到的插件 = 这里投影的那份。
  # 它消费 validate_artifacts 验过的**同一份** zip（不重跑 vite、不重新 checkout 浮动
  # main 拼装、不借工作目录里的 dist）。
  #
  #   publish=true   Release 建好、PyPI 发完之后才推进（引擎必须先经用户正常渠道拿得到，
  #                  发布器自己还会对 GitHub Release / PyPI 各问一次）。GitHub Release、
  #                  PyPI、Git 分支不是一个原子事务：这一步失败时 Release 已经公开、
  #                  marketplace 通道**尚未推进**，旧稳定插件原样保留——用同一份产物
  #                  重跑本 job 或 plugin-stable.yml 即可幂等重试，绝不删公开版本伪装回滚。
  #   publish=false  演练：对一个临时 bare 仓库真实跑 bootstrap → 幂等 no-op → 同版本
  #                  不同内容拒绝 → 回退，再对真实远端只读 `plan`。真实 refs 一个不动。
  #
  # 权限：只有这个 job 有 contents: write（顶层是 read）；发布器不执行插件包里的任何
  # 代码，只搬字节。它也不靠 bot push 触发别的 workflow——没有 workflow 监听这条分支。
  # ────────────────────────────────────────────────────────────────
  plugin_stable:
    needs: [trust, validate_artifacts, github_release, pypi]
    # validate 必须绿；正式发布还要等 Release 与 PyPI 都出结论（pypi 允许 skipped：
    # 仓库变量未开闸时它不跑，发布器会自己核 PyPI 上有没有这个版本）。
    if: >-
      always() && needs.trust.result == 'success' && needs.validate_artifacts.result == 'success'
      && (
        needs.trust.outputs.publish != 'true'
        || (needs.github_release.result == 'success'
            && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped'))
      )
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-assets, path: assets }

      - name: 取出 validate 验过的那份插件并再验一次
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          M=assets/dist/artifact-manifest.json
          python3 scripts/ci/artifact_manifest.py verify "$M" --base assets \
            --require codex-plugin,codex-plugin-build --version "$VER" --source-sha "$SOURCE_SHA"
          ZIP="assets/$(python3 scripts/ci/artifact_manifest.py path "$M" --role codex-plugin)"
          BUILD="assets/$(python3 scripts/ci/artifact_manifest.py path "$M" --role codex-plugin-build)"
          DIGEST="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['content_digest'])" "$BUILD")"
          STAGE="$(python3 scripts/plugin_stage.py unpack "$ZIP" --out "$RUNNER_TEMP/stable")"
          python3 scripts/plugin_stage.py verify "$STAGE" \
            --source-sha "$SOURCE_SHA" --version "$VER" --content-digest "$DIGEST"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: 演练（publish=false）：临时 bare 仓库上真实跑完发布器的全部行为
        if: needs.trust.outputs.publish != 'true'
        env:
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
          VER: ${{ needs.trust.outputs.version }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/drill-remote.git"
          git init --quiet --bare "$R"
          git push --quiet "$R" "HEAD:refs/heads/main"
          P="python3 scripts/plugin_publish.py"
          # bootstrap：分支不存在 → 创建
          $P bootstrap --remote "$R" --staging "$STAGE" --source-sha "$SOURCE_SHA" \
            --engine-check none --reason "release dry-run" --audit "run_id=${{ github.run_id }}" --yes
          TIP="$(git ls-remote --refs "$R" refs/heads/plugin-stable | cut -f1)"
          # 幂等：同内容再来一次 = no-op，tip 不动
          $P promote --remote "$R" --staging "$STAGE" --source-sha "$SOURCE_SHA" \
            --expected-remote-sha "$TIP" --engine-check none --reason "release dry-run" --yes
          [ "$(git ls-remote --refs "$R" refs/heads/plugin-stable | cut -f1)" = "$TIP" ]
          # 防旧覆盖新：期望值错 → 拒绝（退出 3），tip 不动
          set +e; $P promote --remote "$R" --staging "$STAGE" --source-sha "$SOURCE_SHA" \
            --expected-remote-sha 0000000000000000000000000000000000000000 \
            --engine-check none --reason "release dry-run" --yes; rc=$?; set -e
          [ "$rc" -eq 3 ] || { echo "::error::期望值不符时应退 3，实际 $rc"; exit 1; }
          [ "$(git ls-remote --refs "$R" refs/heads/plugin-stable | cut -f1)" = "$TIP" ]
          # 回退：显式授权，快进一个新提交，树 == 旧快照
          $P rollback --remote "$R" --to "$TIP" --expected-remote-sha "$TIP" \
            --authorized-by "release dry-run" --reason "drill" --yes
          [ "$(git --git-dir="$R" rev-list --count plugin-stable)" = "2" ]
          echo "临时远端演练通过：bootstrap / no-op / 拒绝 / rollback"

      - name: 对真实发行分支只读 plan（publish=false）
        if: needs.trust.outputs.publish != 'true'
        env:
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          # 没有 --yes：一个写请求都不发。分支还不存在时 plan 显示 bootstrap，存在时显示
          # promote / no-op / 拒绝——正式发布日会撞的墙这里先撞一遍。
          python3 scripts/plugin_publish.py plan --staging "$STAGE" --source-sha "$SOURCE_SHA" \
            --engine-check none --reason "dry-run plan" --receipt-out "$RUNNER_TEMP/plan.json" || true
          if [ -f "$RUNNER_TEMP/plan.json" ]; then
            python3 - "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          print("### plugin-stable · plan（只读）\n")
          for k in ("action", "reason", "remote_tip", "remote_version", "new_version"):
              print(f"- {k}: `{p.get(k)}`")
          PY
          fi

      - name: 给发布器的 git 配本仓库的推送凭据（只在真推时）
        # 发布器在自己的临时仓库里 push，看不见 actions/checkout 写进 checkout 本地
        # config 的凭据——首次真跑（run 33979476158）就死在 `could not read Username`，
        # 读回正确报了 not_landed（退出码 4）。形态与 actions/checkout 一致：只对
        # github.com 生效的 extraheader，不进任何 URL、不进收据。演练不需要它。
        if: needs.trust.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $AUTH"

      - name: 推进 plugin-stable（publish=true）
        if: needs.trust.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
          TAG: ${{ needs.trust.outputs.tag }}
        run: |
          set -euo pipefail
          P="python3 scripts/plugin_publish.py"
          TIP="$(git ls-remote --refs origin refs/heads/plugin-stable | cut -f1 || true)"
          if [ -z "$TIP" ]; then
            echo "::error::plugin-stable 还不存在——先按 docs/ci/plugin-stable-channel.md 用已发布的版本 bootstrap（plugin-stable.yml），本 job 不替人做首次创建"
            exit 1
          fi
          $P promote --staging "$STAGE" --source-sha "$SOURCE_SHA" --release-tag "$TAG" \
            --expected-remote-sha "$TIP" --engine-check github-release,pypi \
            --audit "run_id=${{ github.run_id }}" --audit "workflow=release" \
            --receipt-out "$RUNNER_TEMP/receipt.json" --yes
          python3 - "$RUNNER_TEMP/receipt.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          print("### plugin-stable\n")
          print(f"- {p.get('action')}: {p.get('reason')}  → `{p.get('commit')}`")
          PY

      - name: 撤掉推送凭据
        if: always()
        run: git config --global --unset-all "http.https://github.com/.extraheader" || true

      - name: 留下收据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-stable-receipt
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/plan.json
          if-no-files-found: ignore
