name: Release

# 打 tag 即发布：v0.1.0 → 构建一次 → 建 GitHub Release → 发 PyPI。
#
# 三个 job 共用 build 产出的**同一份**产物：GitHub Release 上的 wheel 与 PyPI 上的
# 必须字节一致，否则「检查更新」装到的和 pip 装到的会是两个东西。
#
# 为什么 PyPI 发布在这个文件里而不是单独一个工作流：Release 是本工作流用
# GITHUB_TOKEN 建的，而 GitHub 明确规定 GITHUB_TOKEN 触发的事件不会再触发新的
# 工作流运行（防递归）——`on: release: published` 那条链根本不会响。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0）"
        required: true
      pypi:
        description: "发到哪里（演练选 testpypi）"
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]

# 默认只读。真正要写的两个 job（github_release 建 Release、pypi 走 OIDC）
# 已各自在 job 级声明了自己那份权限——build 只是造产物，不该继承仓库默认的
# contents: write。
permissions:
  contents: read

# CI 里跑起来的每一个 Tavotto 进程都**硬关**匿名用量统计。
# 单靠「配置目录是新的、同意态是 unset」不够：那是默认值，而默认值会变、
# 会被某个用例改掉、会被缓存的用户目录带进来。CI 绝不能产生真实的产品事件——
# 一台每天跑几十次的机器足以让「有多少人在用」这个数字彻底失真。
# 与 TAVOTTO_NO_UPDATE_CHECK 是两个独立开关，别指望其中一个代管另一个。
env:
  TAVOTTO_NO_TELEMETRY: "1"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 信任链第一环（GitHub 托管机）：把 tag 解析成精确 SHA，并验证它
  # **可达于受保护的 origin/main**。tag 是可移动的引用，而本工作流后面
  # 站着 PyPI OIDC 与 Release 写权限——一个指向未经评审 commit 的 tag
  # 绝不能进入任何 secret-bearing 路径（1.0 审计 P1-04）。
  # 其余所有 job 只认这里输出的 SHA，不再各自 checkout tag 名。
  # ────────────────────────────────────────────────────────────────
  trust:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null)"; then
            echo "::error::$TAG 不是本仓库里的一个 tag——拒绝进入发布链"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG → $SHA 不可达于 origin/main——发布只接受已经合并进受保护 main 的提交"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ $TAG → $SHA（可达 origin/main）"

  build:
    needs: trust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端进包
        run: python scripts/build_frontend.py

      - name: 打 wheel 与 sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: 核对 tag 与包版本一致
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          test -f "dist/tavotto-${VER}-py3-none-any.whl" || {
            echo "::error::tag $TAG 与 __init__.py 里的版本对不上；dist/ 实际内容："
            ls dist/
            exit 1
          }

      - name: 元数据与 README 渲染自检
        # PyPI 项目页会渲染 README，渲染失败整段会变成纯文本；上传不可撤销，
        # 必须在传之前就发现。
        run: python -m twine check --strict dist/*

      - name: 装进干净环境冒烟
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "
          from pathlib import Path
          import tavotto
          assert (Path(tavotto.__file__).parent / 'web' / 'index.html').is_file()
          print('ok', tavotto.__version__)
          "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 发行资格验证（实验室 Linux runner）
  #
  # 插在 build 与「建 Release / 发 PyPI」之间。它验的是 **build 产出的那一份
  # wheel**，不是「同一个 commit 重新造一个差不多的东西」——本工作流开头那条
  # 「三个 job 共用 build 产出的同一份产物」的原则，在这里同样成立。
  #
  # tag → SHA 的解析与 main 可达性验证在最上面的 trust job（GitHub 托管机）：
  # 不能把 tag 名一路传给 self-hosted 再解析——tag 是可移动的引用，
  # 验证之后、执行之前它仍可能被指向别处。
  #
  # 安全：这个 job 不需要写权限。顶层已是 contents: read，此处不再上调；
  # 长期 runner 拿不到 id-token / contents: write，也就拿不到 PyPI 与 Release
  # 的任何签发能力。
  # ────────────────────────────────────────────────────────────────
  lab_release_gate:
    needs: [build, trust]
    runs-on: [self-hosted, linux, x64, tavotto-lab]
    timeout-minutes: 180
    concurrency:
      # 与 lab-ci.yml 共用同一个槽：benchmark 与 soak 都要求独占机器。
      group: lab-qualification
      cancel-in-progress: false
    env:
      LAB_MODE: release
      TAVOTTO_CI_STATE_ROOT: ${{ vars.LAB_CI_STATE_ROOT || '/srv/tavotto-ci' }}
      LAB_PERF_GATE: ${{ vars.LAB_PERF_GATE || 'false' }}
      GITHUB_TOKEN: ${{ github.token }}
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
          clean: true

      # **同一份产物**：不重新 build。这是整条门禁的立足点。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }

      - name: 开跑前体检
        run: python3 scripts/ci/lab_preflight.py --mode release

      - name: 清理上一轮残留
        run: python3 scripts/ci/cleanup.py

      - name: 候选包验收（exact artifact）
        run: python3 scripts/ci/lab_acceptance.py --dist dist

      - name: 建验证环境
        id: venv
        run: |
          set -euo pipefail
          VENV="$TAVOTTO_CI_STATE_ROOT/tmp/venv-rel-${GITHUB_RUN_ID}"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --disable-pip-version-check --upgrade pip
          "$VENV/bin/pip" install -q -e ".[dev,ci]"
          # **科学栈版本取自 packaging/runtime-lock.json**，不用 `pip install matplotlib`。
          # 视觉基线是像素级的：matplotlib 换个小版本就可能改掉抗锯齿或字体度量，
          # 让整片 corpus 在一次与产品无关的依赖升级里同时变红。用锁文件还有第二个
          # 好处——CI 的渲染环境与桌面版用户拿到的内置 runtime 逐字一致，
          # 基线因此真正代表「用户会看到的那张图」。
          # shellcheck disable=SC2046
          "$VENV/bin/pip" install -q $(python3 scripts/ci/runtime_pins.py)
          echo "python=$VENV/bin/python" >> "$GITHUB_OUTPUT"

      - name: slow / 集成用例
        run: |
          set -euo pipefail
          N=$(${{ steps.venv.outputs.python }} -m pytest -m slow --collect-only -q 2>/dev/null | grep -c "::" || true)
          if [ "$N" -eq 0 ]; then
            echo "::error::-m slow 一条都没选中；标记被删或 pytest.ini 变了"
            exit 1
          fi
          ${{ steps.venv.outputs.python }} -m pytest -q
          ${{ steps.venv.outputs.python }} -m pytest -m slow -q

      - name: 升级验收 N-1 → 候选
        run: |
          set -euo pipefail
          # 用 glob 而不是 ls|grep：文件名里出现空格或非 ASCII 时 ls 的输出
          # 没法安全地按行切。dist/ 里有且只有一个 wheel（lab_acceptance.py
          # 会在上一步就为「多于一个」失败），所以这里直接展开。
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::dist/ 里应有且仅有一个 wheel，实际 ${#WHEELS[@]} 个"
            exit 1
          fi
          ${{ steps.venv.outputs.python }} scripts/ci/upgrade_acceptance.py \
            --candidate "${WHEELS[0]}"

      - name: Golden 视觉回归
        run: |
          ${{ steps.venv.outputs.python }} scripts/ci/visual_regression.py \
            --python ${{ steps.venv.outputs.python }} --out "$RUNNER_TEMP/visual"

      - name: 发行档 soak 与泄漏检测
        run: |
          ${{ steps.venv.outputs.python }} scripts/ci/soak.py \
            --python ${{ steps.venv.outputs.python }} \
            --iterations 800 --json "$RUNNER_TEMP/soak-metrics.json"

      - name: 性能回归（候选版**不写基线**）
        run: |
          ${{ steps.venv.outputs.python }} scripts/ci/benchmark.py \
            --python ${{ steps.venv.outputs.python }} --mode release --no-update

      - name: 汇总
        if: always()
        run: ${{ steps.venv.outputs.python }} scripts/ci/summarize.py --mode release

      - name: 失败诊断包
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-release-gate-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/*.json
            ${{ runner.temp }}/visual/**
            ${{ runner.temp }}/soak-metrics.json
          retention-days: 14
          if-no-files-found: warn

      - name: 回收一次性环境
        if: always()
        run: rm -rf "$TAVOTTO_CI_STATE_ROOT/tmp/venv-rel-${GITHUB_RUN_ID}"

  github_release:
    # lab gate 不过就不建 Release。**刻意不给 fallback**：
    # 「runner 离线 → 跳过 gate → 照发」等于这条门禁在最需要它的时候自动消失。
    # runner 不可用时这个 job 会排队或失败，那正是期望行为。
    needs: [build, trust, lab_release_gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 供应链证明（审计 P1-04）：为 wheel/sdist 签发 build provenance
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }
      # 插件清单那步要跑 Python（这个 job 原本只用 bash，没装过）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }

      # 供应链证明与 SBOM（审计 P1-04 / Gate B）：
      # - provenance：把「这份 wheel 出自本仓库这个 workflow 的这次运行」签成
      #   可验证的 attestation（用户 `gh attestation verify dist/*.whl -R Tavotto/Tavotto`）
      # - SBOM：wheel 的依赖清单（SPDX），随 Release 附上
      # - SHA-256：发布页正文之外再给一份校验文件
      - name: 构建产物 provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: 生成 SBOM（SPDX）
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/*.whl
          format: spdx-json
          output-file: out/tavotto-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SHA-256 校验清单
        run: |
          set -euo pipefail
          mkdir -p out
          (cd dist && shasum -a 256 -- *) > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: 找手写的 release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          set -euo pipefail
          # 自动生成的 notes 只是一串提交标题，用户看不出该不该升级。
          # docs/release-notes/<tag>.md 存在就用它，缺失则退回自动生成。
          F="docs/release-notes/${TAG}.md"
          if [ -f "$F" ]; then
            # SignPath Foundation 的条件要求「Code signing policy」这个词组同时
            # 出现在项目主页**与下载/发布页**上。README 那半已经有了，这里补发布页。
            # 措辞按 SIGNPATH_ENABLED 分岔：没开时如实说这一版没签名——把未签名的
            # 包描述成已签名，正是 policy 里明令禁止的那件事。
            B="$RUNNER_TEMP/release-body.md"
            cp "$F" "$B"
            {
              printf '\n\n---\n\n### Code signing policy\n\n'
              if [ "$SIGNPATH_ENABLED" = "true" ]; then
                printf 'The Windows installer in this release is code signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).\n\n'
              else
                printf '**The Windows installer in this release is not code signed**, so Windows will show a SmartScreen warning on first run. Verify it against this workflow run if you want to check what you downloaded.\n\n'
              fi
              printf 'See the full [code signing policy](https://github.com/%s/blob/%s/docs/code-signing-policy.md) and [privacy policy](https://github.com/%s/blob/%s/docs/privacy.md).\n' \
                     "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_REPOSITORY" "$TAG"
            } >> "$B"
            echo "path=$B" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没有 $F，本次用自动生成的 notes（一串提交标题）"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # Codex 插件的更新通道：装了插件的用户下次调用时就是靠这份清单看到新版本。
      # **刻意放在这里而不是 desktop-tauri.yml 的 updater-manifest**——那个 job
      # 依赖桌面构建产物与 minisign 私钥，没配私钥时整个跳过；挂在那儿等于
      # 「哪天没配签名密钥，插件的更新通道就悄悄停了」，而且全绿。
      - name: 生成 Codex 插件清单与安装包
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/make_plugin_manifest.py --tag "$TAG" \
            --out out/codex-plugin.json \
            --zip "out/codex-plugin-${TAG#v}.zip" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat out/codex-plugin.json

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          # codex-plugin.json 的**文件名不能改**：插件拉的是
          # releases/latest/download/codex-plugin.json（见 update_check.DEFAULT_URL）
          files: |
            dist/*.whl
            dist/*.tar.gz
            out/SHA256SUMS.txt
            out/tavotto-sbom.spdx.json
            out/codex-plugin.json
            out/codex-plugin-*.zip

  pypi:
    # 同上：lab gate 不过就不发 PyPI。PyPI 上的同名文件永远不能重传，
    # 所以这里比 Release 更没有「先发了再说」的余地。
    needs: [build, lab_release_gate]
    # PyPI 侧的 trusted publisher 配好之前，自动发布只会红一次给人添堵——
    # 用仓库变量 PYPI_PUBLISH_ENABLED=true 开闸（Settings → Variables）。
    # 手动 dispatch 时按 inputs.pypi 走，none 则整个跳过。
    if: >-
      (github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.pypi != 'none')
    runs-on: ubuntu-latest
    # PyPI 上的项目名一旦被占用就再也拿不回来，同名文件也永远不能重传。
    # environment 让正式发布可以卡一道人工确认（给它加 required reviewers 即可）。
    environment:
      name: ${{ inputs.pypi == 'testpypi' && 'testpypi' || 'pypi' }}
      url: ${{ inputs.pypi == 'testpypi' && 'https://test.pypi.org/p/tavotto' || 'https://pypi.org/p/tavotto' }}
    permissions:
      id-token: write     # OIDC 签发，Trusted Publishing 的必需权限
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }

      - name: 发布到 TestPyPI
        if: inputs.pypi == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true      # 演练可以重跑，同名文件跳过而不是整个失败

      - name: 发布到 PyPI
        if: inputs.pypi != 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true
