name: Release

# **这是发布的唯一编排入口，也是发布链的第一段。** 桌面构建经 `workflow_call`
# 在这里被调用，不再由 tag 自己触发、也不再轮询等 Release 出现（那段 190 分钟的
# `seq 1 380 … sleep 30` 已经删掉）。
#
# 2026-09-16 起（F 组，docs/implementation/ci-foundation/ADMIN_HANDOFF_RUNNER_POOL.md
# F.2）实验室 runner 注册在私有仓库 `Tavotto/ci-infra` 上，公开仓库不能等私有仓库
# （lab 的排队时间没有上界，本仓库禁止轮询），所以发布链**在 lab 门禁处切成两段**：
#
#   release.yml（本文件，第一段）           ci-infra lab-qualification.yml       release-publish.yml（第二段，只 workflow_dispatch）
#   trust（ancestry + tag + blocker 签字）    trust-check（同一段 ancestry 判断）   trust2（同一段 ancestry + tag 判断
#     → build / desktop（产物 upload）─派发▶ qualify（reusable，按 run-id 取 dist）      + 再核一次 open blocker 与传回的 ack
#     → dispatch_lab（gh workflow run …）     report（status lab/release）─派发▶      + 读一次 lab/release status）
#                                                                               → validate_artifacts（按 source_run_id 取本 run 的产物）
#                                                                               → github_release / n1_update_windows / pypi / plugin_stable
#
# **本文件到 `dispatch_lab` 就结束，不等结果。** 产物在本 run 的 artifact 里；lab 的
# 结论以 commit status `lab/release` 落在 SHA 上；第二段由 ci-infra 在 lab 绿后派发，
# 它会**重验**这里的每一条判断（SHA / tag / blocker / publish），不信任载荷。lab 红 →
# `lab/release` = failure、第二段从未开始——所以本 run 的 success 只表示「产物造出来了、
# lab 派出去了」，发布有没有发生要看那条 status 与 release-publish.yml 有没有该 SHA 的 run。
#
# **publish=false 是默认。** 一次 workflow_dispatch 演练会在指定的精确 SHA 上
# 走完两段链——wheel/sdist、Windows 与 macOS 最终产物（含签名公证）、
# 发行资格验证、SBOM、checksum、provenance、updater 清单、产物清单校验
# ——**唯独不建 Release、不发 PyPI、不打 tag**。
#
# 为什么非要有这一档：v0.9.0 与 v0.9.1 两个正式 tag 都是在发布链上第一次
# 被执行时炸掉的，而 tag ruleset 是 immutable——它们至今改不动也删不掉，
# 仓库里躺着两个没有 Release 的 tag。**正式 tag 不该承担「第一次测试这条链」
# 的职责。** 推荐流程：
#
#   main 上定好版本
#     → workflow_dispatch(ref=<精确 SHA>, publish=false)   ← 完整演练（两段都跑）
#     → 演练全绿之后，在**同一个 SHA** 上打正式 tag
#     → tag 触发同一套编排并 publish
#
# 打 tag 即发布：v0.1.0 → 构建一次 → lab 绿 → 建 GitHub Release → 发 PyPI。
#
# 三个 job 共用 build 产出的**同一份**产物：GitHub Release 上的 wheel 与 PyPI 上的
# 必须字节一致，否则「检查更新」装到的和 pip 装到的会是两个东西。
#
# 为什么 PyPI 发布在 release-publish.yml 里而不是单独一个工作流：Release 是那个
# workflow 用 GITHUB_TOKEN 建的，而 GitHub 明确规定 GITHUB_TOKEN 触发的事件不会再
# 触发新的工作流运行（防递归）——`on: release: published` 那条链根本不会响。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "在哪个 commit 上跑（精确 SHA，或一个 tag / 分支名）"
        required: true
        default: main
      publish:
        description: >-
          建 Release / 发 PyPI。**默认关**——不打勾就是一次完整演练：
          该造的产物一个不少、该跑的门禁一条不落，就是什么都不发布。
        required: false
        default: false
        type: boolean
      # 切两段（F.2）之后这个输入**没有消费者**：第二段 publish=true 只可能来自 tag，
      # PyPI 按仓库变量 PYPI_PUBLISH_ENABLED 开闸（tag 那条路本来就只看它）；TestPyPI
      # 通道在两段链里不存在。留着它是为了不改 on: 的形状；要恢复得把它加进两跳载荷。
      pypi:
        description: "publish 打勾时发到哪里"
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]
      ack_open_blockers:
        description: >-
          对 open 的 release:blocker issue 的显式签字（逗号分隔编号，如
          "35,83"）。必须与当前 open 清单逐条对得上；留空 = 声明当前没有
          open blocker。有 blocker 而不签字，发布链在 trust 就停下。
        required: false
        default: ""

# 默认只读。真正要写的两个 job（github_release 建 Release、pypi 走 OIDC）
# 已各自在 job 级声明了自己那份权限——build 只是造产物，不该继承仓库默认的
# contents: write。
permissions:
  contents: read

# CI 里跑起来的每一个 Tavotto 进程都**硬关**匿名用量统计。
# 单靠「配置目录是新的、同意态是 unset」不够：那是默认值，而默认值会变、
# 会被某个用例改掉、会被缓存的用户目录带进来。CI 绝不能产生真实的产品事件——
# 一台每天跑几十次的机器足以让「有多少人在用」这个数字彻底失真。
# 与 TAVOTTO_NO_UPDATE_CHECK 是两个独立开关，别指望其中一个代管另一个。
env:
  TAVOTTO_NO_TELEMETRY: "1"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 信任链第一环（GitHub 托管机）：把 tag 解析成精确 SHA，并验证它
  # **可达于受保护的 origin/main**。tag 是可移动的引用，而本工作流后面
  # 站着 PyPI OIDC 与 Release 写权限——一个指向未经评审 commit 的 tag
  # 绝不能进入任何 secret-bearing 路径（1.0 审计 P1-04）。
  # 其余所有 job 只认这里输出的 SHA，不再各自 checkout tag 名。
  # ────────────────────────────────────────────────────────────────
  trust:
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    # 顶层是 contents: read；这里加 issues: read 是给 release-blocker 门禁
    # 查 label 用的。job 级 permissions 会整个替换默认，contents 要重申。
    permissions:
      contents: read
      issues: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ── Release-blocker 门禁：未执行的 release-blocker 验证不许无声跨版本 ──
      # issue #35 把「真实 N-1 更新」列为退出条件后，带着这个已知未验证的洞
      # 又发了多个 0.x 版本——没有任何机制在发版时把它摆到眼前。这与 #78
      # （「声明了却从未执行的 job」）同族，只是洞活在 issue 里不在 YAML 里。
      # 规则与判定全在 scripts/ci/release_blockers.py（可单测、可反证）：
      # 有 open 的 release:blocker 就必须在 dispatch 输入里**逐条**签字，
      # 不是禁止发（0.x 需要灵活），是把「明知有洞还发」变成显式决定。
      # 演练（publish=false）也过这道门：演练的意义就是提前撞上发布日会撞的墙。
      - name: Release-blocker 门禁（明知有洞不许无声发布）
        env:
          GH_TOKEN: ${{ github.token }}
          ACK: ${{ inputs.ack_open_blockers }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues?labels=release:blocker&state=open&per_page=100" \
            > "$RUNNER_TEMP/open-blockers.json"
          python3 scripts/ci/release_blockers.py \
            --issues-json "$RUNNER_TEMP/open-blockers.json" \
            --ack "${ACK:-}" --event "$EVENT"

      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REF_IN: ${{ inputs.ref }}
          PUBLISH_IN: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            # tag 触发：tag → 精确 SHA。**永远 publish**。
            if ! SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null)"; then
              echo "::error::$TAG 不是本仓库里的一个 tag——拒绝进入发布链"
              exit 1
            fi
            REL_TAG="$TAG"
            PUBLISH=true
          else
            # 手动触发：可以是精确 SHA、tag 名或分支名。
            if ! SHA="$(git rev-parse --verify "${REF_IN}^{commit}" 2>/dev/null)"; then
              echo "::error::解析不了 ref=$REF_IN"
              exit 1
            fi
            REL_TAG=""
            PUBLISH="${PUBLISH_IN:-false}"
          fi

          # **可达性对两条路都要验。** 这条门禁站在 PyPI OIDC 与 Release 写
          # 权限前面：一个指向未经评审 commit 的 ref 绝不能进入任何
          # secret-bearing 路径（审计 P1-04）。演练也不放行——演练用的 runner、
          # secret 与正式发布是同一批。
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA 不可达于 origin/main——发布链只接受已经合并进受保护 main 的提交"
            exit 1
          fi

          # **版本号从源码读，不从 tag 名推。** tag 名是人手打的，
          # 源码里那个才是 wheel 真正会带的版本；两者不一致必须当场发现，
          # 而不是等 PyPI 拒收（PyPI 上同名文件永远不能重传）。
          VER="$(git show "$SHA:src/tavotto/__init__.py" \
                 | sed -n 's/^__version__ = "\(.*\)"$/\1/p')"
          if [ -z "$VER" ]; then
            echo "::error::读不出 $SHA 上的 __version__"
            exit 1
          fi
          if [ -n "$REL_TAG" ] && [ "$REL_TAG" != "v$VER" ]; then
            echo "::error::tag $REL_TAG 与源码版本 $VER 对不上"
            exit 1
          fi
          [ -n "$REL_TAG" ] || REL_TAG="v$VER"

          # **tag 已经存在时，它必须指向同一个 commit。**
          # `action-gh-release` 的 `target_commitish` 只在 tag **不存在**时
          # 起作用；tag 已存在的话它直接复用现有那个，而现有 tag 完全可能
          # 指向别处 —— 那时 Release 挂的 tag 与产物来自两个 commit，
          # 而没有任何一步会报错。
          #
          # 这不是假想：仓库里此刻就躺着 v0.9.0 与 v0.9.1 两个指向旧 commit、
          # 且因为 immutable ruleset 改不动也删不掉的 tag。一次
          # 「补发 v0.9.1」的手工 dispatch 正好会踩中。
          # （Codex 在第二轮上指出。）
          if EXISTING="$(git rev-parse --verify "refs/tags/${REL_TAG}^{commit}" 2>/dev/null)"; then
            if [ "$EXISTING" != "$SHA" ]; then
              echo "::error::tag $REL_TAG 已经存在，且指向 $EXISTING —— 而本次要发布的是 $SHA。"
              echo "::error::tag ruleset 是 immutable，它移不动。要发这个 SHA 请换一个版本号。"
              exit 1
            fi
            echo "· tag $REL_TAG 已存在且指向同一个 commit，复用它"
          fi

          {
            echo "sha=$SHA"
            echo "version=$VER"
            echo "tag=$REL_TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "✅ $SHA（可达 origin/main）· 版本 $VER · tag $REL_TAG · publish=$PUBLISH"
          {
            echo "### 发布编排"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发 | \`$EVENT\` |"
            echo "| SHA | \`$SHA\` |"
            echo "| 版本 | \`$VER\` |"
            echo "| tag | \`$REL_TAG\` |"
            echo "| **publish** | **$PUBLISH** |"
            if [ "$PUBLISH" != "true" ]; then
              echo ""
              echo "> **演练（publish=false）**：产物照造、门禁照跑，"
              echo "> 但**不建 Release、不发 PyPI**。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: trust
    timeout-minutes: 60  # 上限是防挂死、不是性能预算：把损失从「无限」变成「有界」
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trust.outputs.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端进包
        run: python scripts/build_frontend.py

      - name: 打 wheel 与 sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: 核对包版本与 trust 解析出的一致
        env:
          VER: ${{ needs.trust.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/tavotto-${VER}-py3-none-any.whl" || {
            echo "::error::造出来的 wheel 不是版本 $VER；dist/ 实际内容："
            ls dist/
            exit 1
          }

      - name: 元数据与 README 渲染自检
        # PyPI 项目页会渲染 README，渲染失败整段会变成纯文本；上传不可撤销，
        # 必须在传之前就发现。
        run: python -m twine check --strict dist/*

      - name: 装进干净环境冒烟
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "
          from pathlib import Path
          import tavotto
          assert (Path(tavotto.__file__).parent / 'web' / 'index.html').is_file()
          print('ok', tavotto.__version__)
          "

      # ── 完整 Codex 插件（ADR 0043）───────────────────────────────────────
      # **在这里造，只造这一次。** 这个 job 有 Node、有刚 checkout 的固定发行 SHA、
      # 有刚装了 wheel 的干净环境：画布从本次源码真构建，插件按 git 清单 + 显式构建物
      # 组装，随包清单记下 source_sha / 构建输入指纹 / 内容摘要，然后**用发出去的
      # 那份 wheel 里的引擎**真起 server 读一遍画布资源。下游（validate / Release /
      # 发行分支）只消费 dist/ 里这一份 zip，谁都不再从源码目录打包——从前
      # validate_artifacts 在一台没有 Node 的机器上直接 zip 源码目录，画布是不是
      # 本次源码构建的、在不在，那一步都答不了。
      - name: 构建 MCP 画布 + 组装并验证完整插件
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
          TAG: ${{ needs.trust.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/plugin/stage"
          python3 scripts/build_mcp_widget.py --out "$RUNNER_TEMP/plugin/canvas.html" --json
          python3 scripts/plugin_stage.py stage --widget "$RUNNER_TEMP/plugin/canvas.html" \
            --out "$STAGE" --source-sha "$SOURCE_SHA" \
            --audit "workflow=release" --audit "run_id=$RUN_ID" --audit "tag=$TAG"
          python3 scripts/plugin_stage.py verify "$STAGE" \
            --source-sha "$SOURCE_SHA" --version "$VER" --serve /tmp/smoke/bin/python
          # 清单 + 确定性 zip 都从这份 staging 出；zip 再解包验一次（dotfiles / 模式 / 摘要）
          python3 scripts/make_plugin_manifest.py --tag "$TAG" \
            --out dist/codex-plugin.json --zip "dist/codex-plugin-${VER}.zip" \
            --plugin-dir "$STAGE" --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/plugin_stage.py verify "dist/codex-plugin-${VER}.zip" \
            --source-sha "$SOURCE_SHA" --version "$VER" \
            --content-digest "$(python3 scripts/plugin_stage.py digest "$STAGE")" --json
          cp "$STAGE/plugin-build.json" dist/codex-plugin-build.json
          cat dist/codex-plugin.json

      - name: 这条腿的产物清单
        # **下游唯一的文件名出处。** 从前 SBOM、SHA256SUMS、provenance、
        # Release 附件、PyPI 校验、exact artifact 冒烟七处各自猜一次
        # ——#63 就是其中一处猜错了（把 `dist/*.whl` 喂给只认单个路径的 syft，
        # 而那句 glob 被原样当成文件名）。
        env:
          VER: ${{ needs.trust.outputs.version }}
          SOURCE_SHA: ${{ needs.trust.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/artifact_manifest.py build \
            --version "$VER" --source-sha "$SOURCE_SHA" \
            --out dist/artifact-manifest-python.json \
            --add "wheel:dist/tavotto-${VER}-py3-none-any.whl:python" \
            --add "sdist:dist/tavotto-${VER}.tar.gz:python" \
            --add "codex-plugin:dist/codex-plugin-${VER}.zip:any" \
            --add "codex-plugin-manifest:dist/codex-plugin.json:any" \
            --add "codex-plugin-build:dist/codex-plugin-build.json:any"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-manifest-python
          path: dist/artifact-manifest-python.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # 桌面产物（Windows + macOS）。**由这里调用，不再由 tag 自己触发。**
  #
  # 从前它是一条独立 workflow，由同一个 tag 并行启动，构建完轮询
  # `gh release view` 等 Release 出现（最长 190 分钟）。那个拓扑的毛病不是
  # 「等太久」：
  #   · 等待没有上界——lab gate 的**排队**时间本身没有上界；
  #   · 两条腿各自 checkout tag，而 tag 是可移动的引用，
  #     **「同一个 tag」证明不了「同一个 commit」**。
  # 现在它拿的是 trust 已经验过、已经解析好的精确 SHA，产物清单里
  # 带着同一个 source_sha，validate_artifacts 会逐条核对。
  # ────────────────────────────────────────────────────────────────
  desktop:
    needs: trust
    uses: ./.github/workflows/desktop-tauri.yml
    with:
      sha: ${{ needs.trust.outputs.sha }}
      version: ${{ needs.trust.outputs.version }}
      # **恒为 true，不跟着 publish 走。**
      # 从前这里传的是 `publish`，于是 `publish=false` 的演练把桌面侧的
      # 签名凭据门禁、provenance 与整个 `updater-manifest` job 一起关掉了
      # ——演练于是验不到发布链上**最容易悄悄坏掉的那两段**：签名/公证，
      # 和 latest.json（少了它，桌面用户永远查不到新版本，而且全绿）。
      #
      # 「是不是发行构建」与「挂不挂 Release」是两件事。本工作流根本不挂
      # Release（那归下面的 github_release job），所以它不需要知道 publish。
      # 演练的定义是**产物一个不少、门禁一条不落，只是不发布**。
      release_build: true
    secrets: inherit
    permissions:
      contents: read
      actions: read
      id-token: write        # 桌面产物 provenance
      attestations: write

  # ────────────────────────────────────────────────────────────────
  # 发行资格验证：**派发**到私有仓库 ci-infra（托管机），不等结果。
  #
  # 从前这里是 `lab_release_gate`——同步 `uses` reusable，`validate_artifacts`
  # 与发布 job 都排在它后面。实验室 runner 迁到 `Tavotto/ci-infra` 之后
  # （F 组），公开仓库里的 `uses` 只会永远排队，而公开仓库又不能等私有仓库
  # （本仓库禁止轮询：lab 的排队时间没有上界）。所以发布链在这里切成两段：
  # 本 job 把 trust 验过的 SHA、本 run 的 id、trust 算出的 publish 与原样的
  # blocker 签字交给 ci-infra 的 `lab-qualification.yml`（mode=release，
  # use_prebuilt_dist=true：验的仍是 build 产出的**那一份** wheel，不是「同一个
  # commit 重新造一个差不多的东西」）；lab 绿了由 ci-infra 的 `report` 派发
  # `release-publish.yml`，那边**重验**全部判断再发布。
  #
  # 步骤定义仍只有 `_lab-qualification.yml` 一份（ci-infra 那边 `uses` 它）。
  #
  # 这条门禁刻意**没有 fallback**：secret 为空 → 红；`gh workflow run` 失败 → 红。
  # 「runner 离线 → 跳过 gate → 照发」等于它在最需要的时候自动消失；现在更进一步，
  # 发布 job 根本不在本 workflow 里——lab 没绿，第二段就从未开始。
  #
  # 安全：这个 job 不需要写权限。顶层已是 contents: read；派发用的是公开仓库
  # secret `TAVOTTO_CI_INFRA_TOKEN`（fine-grained PAT，只对 ci-infra 的
  # `actions: write`），不是 GITHUB_TOKEN。长期 runner 仍拿不到 id-token /
  # contents: write，也就拿不到 PyPI 与 Release 的任何签发能力。
  # ────────────────────────────────────────────────────────────────
  dispatch_lab:
    # desktop 也要先完成：第二段的 validate_artifacts 按本 run 的 id 取**全部**产物，
    # lab 绿了才派发它——产物没齐就派 lab，第二段可能在产物还没上传时被派发。
    needs: [build, desktop, trust]
    timeout-minutes: 10  # 一次 API 调用加一次列表查询；到 10 分钟只可能是 gh 挂了
    runs-on: ubuntu-latest
    env:
      # fine-grained PAT，只对 Tavotto/ci-infra 有 `actions: write`。不是 GITHUB_TOKEN：
      # 本 workflow 的 GITHUB_TOKEN 只有 contents: read，也不该拿到跨仓库的派发权。
      GH_TOKEN: ${{ secrets.TAVOTTO_CI_INFRA_TOKEN }}
      # SHA 与 publish 全部来自 trust 的输出——派发方的信任判断在派发方自己手里
      # （tests/test_release_workflow_contract.py::test_every_caller_gates_the_sha_through_a_trust_job）。
      LAB_SHA: ${{ needs.trust.outputs.sha }}
      LAB_PUBLISH: ${{ needs.trust.outputs.publish }}
      # blocker 签字**原样**转发：第二段 trust2 拿它对着当时 open 的清单再核一次。
      # tag 触发时 inputs 上下文为空，这里就是空串——与 trust 消费到的一致。
      LAB_ACK: ${{ inputs.ack_open_blockers }}
    steps:
      - name: 派发 lab-qualification（mode=release）到 Tavotto/ci-infra
        run: |
          set -euo pipefail
          # **secret 为空必须红。** 仓库里没配这个 secret 时表达式求值成空串，
          # gh 会退回匿名请求然后报一个与「没配 secret」毫不相干的 401/404；
          # 在这里把成因说清楚。
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secret TAVOTTO_CI_INFRA_TOKEN 为空——lab 没人跑，发布链在这里停下。"
            echo "::error::派发到 Tavotto/ci-infra 需要一枚对该仓库 actions: write 的 fine-grained PAT；"
            echo "::error::见 docs/ci/self-hosted-runner.md §1「更安全的备用形态」。本 job 不许静默跳过。"
            exit 1
          fi
          [ -n "$LAB_SHA" ] || { echo "::error::trust 没有给出 SHA"; exit 1; }
          case "$LAB_PUBLISH" in true|false) ;; *) echo "::error::trust 给出的 publish 不是 true/false：$LAB_PUBLISH"; exit 1 ;; esac
          gh workflow run lab-qualification.yml -R Tavotto/ci-infra -r main \
            -f mode=release \
            -f sha="$LAB_SHA" \
            -f baseline_tag="" \
            -f use_prebuilt_dist=true \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f publish="$LAB_PUBLISH" \
            -f ack_open_blockers="$LAB_ACK"
          echo "已派发：mode=release sha=$LAB_SHA source_run_id=$GITHUB_RUN_ID publish=$LAB_PUBLISH ack=${LAB_ACK:-<空>}"

      - name: 第一段结束：结论去哪看
        # 只是给读 summary 的人一个入口，**不是判据**：`gh workflow run` 不返回
        # run id，这里取的是 ci-infra 该 workflow **最新的一条**——多半就是刚派发的
        # 那个，但并发派发时可能是别人的；结论以 commit status `lab/release` 为准。
        # 这一步查不到也不红：派发成功与否已由上一步的退出码判过。
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LATEST="$(gh run list -R Tavotto/ci-infra --workflow lab-qualification.yml \
                      --limit 1 --json url,databaseId \
                      --jq '.[0] // empty | "\(.url)（run \(.databaseId)）"' || true)"
          {
            echo "## 第一段结束"
            echo ""
            echo "产物在本 run 的 artifact 里（\`dist\` / \`desktop-tauri-*\` / \`artifact-manifest-*\` / \`updater-manifest\`）；"
            echo "lab 结论见 commit \`$LAB_SHA\` 的 status \`lab/release\`；"
            echo "第二段（\`release-publish.yml\`：重验 + validate_artifacts + 发布）由 ci-infra 在 lab 绿后派发。"
            echo "**lab 红 → \`lab/release\` = failure，第二段不会出现**——本 run 的 success 只表示产物造出来了、lab 派出去了。"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| Commit | \`$LAB_SHA\` |"
            echo "| publish（随载荷传给第二段，那边按同一规则重算） | \`$LAB_PUBLISH\` |"
            echo "| ack_open_blockers（原样转发） | \`${LAB_ACK:-（空）}\` |"
            echo "| 本 run（第二段按这个 id 取产物） | $RUN_URL |"
            if [ -n "$LATEST" ]; then
              echo "| ci-infra 最新 run（近似：刚派发的那个还没排进列表时会是上一条） | $LATEST |"
            else
              echo "| ci-infra 最新 run | 还没排进列表——到 ci-infra 的 Actions 页按 SHA 找 |"
            fi
            echo "| 结论去哪看 | 本 SHA 的 commit status \`lab/release\`，以及 release-publish.yml 有没有本 SHA 的 run |"
          } >> "$GITHUB_STEP_SUMMARY"
