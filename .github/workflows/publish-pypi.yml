name: Publish to PyPI

# Trusted Publishing（OIDC）：不存任何 API token，由 PyPI 校验这个仓库 +
# 这个工作流文件名 + 这个 environment 签发的短时凭据。改名字要同步改 PyPI 上的
# publisher 配置，否则鉴权直接失败。首次使用前的一次性设置见 docs/RELEASING.md。
#
# 发布的是 **GitHub Release 上已有的那份产物**，不重新构建——PyPI 与 Release
# 上的 wheel 必须字节一致，否则「检查更新」装到的和 pip 装到的会是两个东西。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布哪个 Release（如 v0.1.0）"
        required: true
      target:
        description: "发到哪里"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI 上的项目名一旦被占用就再也拿不回来，同名文件也永远不能重传。
    # environment 让首次发布可以卡一道人工确认（在仓库 Settings → Environments
    # 给 pypi 加 required reviewers 即可）。
    environment:
      name: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
      url: ${{ (github.event_name == 'release' || inputs.target == 'pypi') && 'https://pypi.org/p/magplot' || 'https://test.pypi.org/p/magplot' }}
    permissions:
      id-token: write     # OIDC 签发，Trusted Publishing 的必需权限
      contents: read      # 下载 Release 资产

    steps:
      - name: 取回 Release 上的产物
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist
          ls -l dist

      - name: 核对产物版本与 tag 一致
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          test -f "dist/magplot-${VER}-py3-none-any.whl" \
            || { echo "::error::dist 里没有 magplot-${VER} 的 wheel"; ls dist; exit 1; }
          test -f "dist/magplot-${VER}.tar.gz" \
            || { echo "::error::dist 里没有 magplot-${VER} 的 sdist"; ls dist; exit 1; }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: 元数据与 README 渲染自检
        # PyPI 的项目页会渲染 README，渲染失败会整段变成纯文本。twine check
        # 在上传前就能发现，比传上去再看强——PyPI 上传是不可撤销的。
        run: |
          python -m pip install --upgrade twine
          twine check --strict dist/*

      - name: 发布到 TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true      # 演练可以重跑，同名文件跳过而不是整个失败

      - name: 发布到 PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
