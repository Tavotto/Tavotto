name: Core v0.2 packaged ggplot2 qualification

on:
  push:
    branches: [codex/tavotto-core-v02-intel-ci]
    paths:
      - .github/workflows/core-v02-packaged-ggplot2-qualification.yml
      - .github/scripts/native_ggplot2_packaged_probe.py

permissions:
  contents: read

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_NO_UPDATE_CHECK: "1"
  TAVOTTO_REQUIRE_RUNTIME: "1"
  TAVOTTO_REQUIRE_PRIVATE_PYTHON: "1"
  PYTHONUTF8: "1"

jobs:
  packaged-r:
    name: Packaged R capture on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: qualification
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/native_ggplot2_packaged_probe.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 5bf3f71f7e8672fcbecf5279ef899bea89507197
          path: product
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
          architecture: x64
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.27.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          architecture: x64
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true
      - name: Supply the system libraries used by CRAN R Cairo
        if: runner.os == 'macOS'
        run: brew list --cask xquartz >/dev/null 2>&1 || brew install --cask xquartz
      - name: Prepare the independent R runtime
        shell: Rscript {0}
        run: |
          install.packages(c("ggplot2", "svglite", "jsonlite"))
          print(sessionInfo())
          probe <- tempfile(fileext = ".pdf")
          last <- grDevices::dev.cur()
          grDevices::cairo_pdf(probe, width = 6, height = 4)
          stopifnot(grDevices::dev.cur() != last)
          graphics::plot.new()
          grDevices::dev.off()
          stopifnot(file.exists(probe), file.size(probe) > 0)
          unlink(probe)
      - name: Install the product build environment
        working-directory: product
        run: |
          git log -1 --format="%H %s"
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
      - name: Build the Windows desktop sidecar
        if: runner.os == 'Windows'
        working-directory: product
        run: python scripts/build_desktop.py --skip-tauri
      - name: Build the Intel macOS application
        if: runner.os == 'macOS'
        working-directory: product
        run: python scripts/build_desktop.py --bundles app
      - name: Qualify the Windows sidecar from a Unicode path
        if: runner.os == 'Windows'
        working-directory: product
        run: |
          python -c "import os, pathlib, shutil, subprocess, sys; target=pathlib.Path(os.environ['RUNNER_TEMP'])/'图表 应用'/'Tavotto'; shutil.copytree('dist/Tavotto', target); runtime=shutil.which('Rscript'); assert runtime; subprocess.run([sys.executable, '../qualification/.github/scripts/native_ggplot2_packaged_probe.py', str(target/'Tavotto.exe'), runtime], check=True)"
      - name: Qualify the Intel app from a Unicode path
        if: runner.os == 'macOS'
        working-directory: product
        run: |
          set -eu
          app="$RUNNER_TEMP/图表 应用/Tavotto.app"
          mkdir -p "$(dirname "$app")"
          ditto src-tauri/target/release/bundle/macos/Tavotto.app "$app"
          python scripts/codesign_macos.py verify --app "$app" --expect-arch x86_64
          python ../qualification/.github/scripts/native_ggplot2_packaged_probe.py "$app/Contents/Resources/sidecar/Tavotto/Tavotto" "$(command -v Rscript)"
