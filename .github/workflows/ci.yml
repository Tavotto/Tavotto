name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # 跨平台是产品承诺，就得跨平台跑。Linux 上多铺几个 Python 版本盯住
    # requires-python 的下界，mac / Windows 各跑一档确认平台相关代码
    # （数据目录、worker 解释器探测、路径分隔符）没写死成 POSIX。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # matplotlib 单独装：pyproject 的主依赖刻意不含科学栈（Flask 父进程的
      # 依赖边界），CI 里装上让 worker round-trip 用例真正执行而非跳过
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install matplotlib
      - name: pytest
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  package:
    # 装出来的 wheel 必须自带界面并且能真的起起来——这条流水线专门盯
    # 「本地能跑但打包后 404」这类只在发布时才暴露的问题。
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 构建前端进包
        run: python scripts/build_frontend.py
      - name: 打 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: 装进干净环境并冒烟
        shell: bash
        run: |
          python -m venv /tmp/smoke
          BIN=/tmp/smoke/bin; [ -d "$BIN" ] || BIN=/tmp/smoke/Scripts
          "$BIN/python" -m pip install --quiet dist/*.whl
          "$BIN/python" -c "import magplot; print('version', magplot.__version__)"
          "$BIN/python" -c "
          from pathlib import Path
          import magplot
          web = Path(magplot.__file__).parent / 'web' / 'index.html'
          assert web.is_file(), 'wheel 里没有前端构建产物'
          print('frontend ok')
          "
          "$BIN/python" -c "
          from magplot.engine import pool
          assert pool.WORKER_PY.is_file(), 'wheel 里没有 worker.py'
          print('worker ok')
          "
      - name: 起服务并请求首页
        shell: bash
        env:
          MAGPLOT_DATA_DIR: ${{ runner.temp }}/magplot-data
          MAGPLOT_CONFIG_DIR: ${{ runner.temp }}/magplot-config
        run: |
          BIN=/tmp/smoke/bin; [ -d "$BIN" ] || BIN=/tmp/smoke/Scripts
          "$BIN/python" -m magplot --port 5199 --no-browser &
          sleep 8
          curl -sf http://127.0.0.1:5199/ -o /dev/null
          curl -sf http://127.0.0.1:5199/api/version
          echo
