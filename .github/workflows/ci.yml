name: CI

# ═══════════════════════════════════════════════════════════════════════════
# 验证按**发生时机**分工（2026-08-25，Merge Queue 定版）。
# **覆盖面一条没减，改的是每类验证在哪个提交上执行**：
#
#   PR（含草稿）    快速反馈：python-lint（Ruff）/ invariants /
#                   backend-fast（Linux 3.10+3.13）/ frontend / workerd /
#                   compat-smoke / CodeQL。
#                   重型资格**不在 PR 上跑**——CI integration gate 显式回
#                   deferred（summary 与 JSON 都写明），PR 靠三个 Gate 进队列。
#   full-ci PR      打上 `full-ci` 标签 = 在 PR 自己的 SHA 上提前跑全套重型
#                   资格（backend-platforms / package ×3 / 两个真产物冒烟），
#                   此时 integration gate 真实聚合、不许 deferred。
#   merge_group     完整合并资格的**唯一常规执行点**。Merge Queue 为
#                   「最新 main + 队列前序 PR + 当前 PR」造出组合提交，
#                   全部快线 + 全部重型资格在它上面真实跑一遍，
#                   三个 Gate 全绿才允许合入 main。
#   push main       轻量落地审计（main-landing-audit）：结构契约 + 受管生成物
#                   一致性 + 落地信息。**不重复打包、不重复真产物冒烟**——
#                   合进来的树就是 merge_group 上刚验过的那棵（squash 由队列
#                   执行，无 bypass actor，没有第二条进 main 的路）。
#   nightly / lab   深度持续验证（nightly.yml + lab-ci.yml）：全量 CompatBench
#                   × 多运行时、视觉回归、真实安装链路、soak 与 mutation。
#   release         发布产物资格（release.yml），一条没动。
#
# ruleset 的 required contexts = 三个稳定 Gate（CI fast gate / CI integration
# gate / codeql.yml 的 CodeQL gate），判定逻辑只在 scripts/ci/aggregate_gate.py。
# 迁移顺序与前置条件见 docs/ci/merge-queue-rollout.md——本文件的重型 job 收敛
# 到 merge_group / full-ci，**只有在 ruleset 已经 switch-to-gates 之后才成立**。
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` 不是默认事件类型（默认只有 opened/synchronize/reopened）。
    # 下面那几档重活按「草稿与否」分层，少了这条，作者点「Ready for review」时
    # 不会有新的 workflow run，重活永远不跑——一个分层方案最容易踩空的地方。
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Merge Queue 的资格验证事件。payload 里**没有** pull_request.draft / labels
  # 这些字段——下面任何引用 `github.event.pull_request.*` 的表达式都必须先按
  # `github.event_name` 分支（tests/test_merge_queue_workflows.py 看护）。
  merge_group:
    types: [checks_requested]

# 同一个 PR 上新 push 之后，旧 SHA 的 run 立刻取消：它就算全绿也已经没有 merge
# value，占着的却是所有人共用的运行器额度。
#
# **cancel-in-progress 只对 PR 开**：push 到 main 的每一次 run 都是那个 commit
# 的唯一验证记录，连着合两个 PR 时把前一个取消掉，main 上就留了一段没验过的
# 历史；merge_group run 是队列候选的资格验证，被取消 = 候选白等 90 分钟超时。
# tag / release 工作流不在这个文件里，天然不受影响。
#
# group 里带 `github.workflow`（codeql.yml 各有各的槽）+ `github.event_name`
# （PR / merge_group / push 三种 run 绝不同组，谁也取消不了谁）。merge_group
# 的临时分支 SHA 与 PR head SHA 不同，绝不能把二者视作同一个执行。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 这个工作流从头到尾只读代码、跑测试、造临时产物，一个字节都不往仓库写。
# 不显式收紧的话 GITHUB_TOKEN 会拿到仓库默认的那套权限（含 contents: write），
# 于是任何一个被拉进来的 action 或被改坏的测试脚本都能推 commit、改 Release。
# 顶层一句管住全部 job；将来真需要写权限的 job 自己在 job 级声明，加得显眼。
permissions:
  contents: read

# CI 里跑起来的每一个 Tavotto 进程都**硬关**匿名用量统计。
# 单靠「配置目录是新的、同意态是 unset」不够：那是默认值，而默认值会变、
# 会被某个用例改掉、会被缓存的用户目录带进来。CI 绝不能产生真实的产品事件——
# 一台每天跑几十次的机器足以让「有多少人在用」这个数字彻底失真。
# 与 TAVOTTO_NO_UPDATE_CHECK 是两个独立开关，别指望其中一个代管另一个。
env:
  TAVOTTO_NO_TELEMETRY: "1"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 快线里最便宜的一格：Ruff。**十几秒回来**，只装一个 wheel，不碰科学栈、
  # 不建前端、不编 Rust。
  #
  # 它挡的是「一个拼错的名字 / 一个删了引用却忘了删的 import，让人等十分钟的
  # 矩阵跑完才知道」那类循环——F821、F401、F841 这些在编辑器里一秒可判的东西，
  # 不该消耗一整轮 CI。放在快线最前面，红了立刻能看见。
  #
  # **它不是别的门禁的替代品**：不变式、等价性矩阵、CompatBench 问的都是
  # 语义问题，Ruff 一条都答不了。这一格只回答「这份 Python 在语法与名字层面
  # 立得住吗」。
  #
  # 不做 paths 过滤，理由与 invariants / workerd 那两格相同：判断「哪些文件
  # 会影响 Python 静态检查」本身就是会漏配的判断，而这一格便宜到不值得为它
  # 冒「静默不跑」的风险。
  # ────────────────────────────────────────────────────────────────
  python-lint:
    # job id 保持 `python-lint` 不变——Gate 的 needs / --required 闭集认的是它，
    # 改 id 等于同时动三处。显示名跟着职责走：这一格现在同时管 lint 与格式。
    name: Python quality (Ruff)
    # 与其它快线一致：PR 与 merge_group 都跑（PR 先绿才能进队列，队列的组合
    # 提交还要再验一遍——组合出来的树没有任何单个 PR 检查过）。push main 不跑，
    # 那棵树就是 merge_group 上刚验过的。
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 版本**从 pyproject 的 dev extra 里读**，不在这里抄一份字面量。
      # 本地与 CI 跑的 ruff 版本一旦漂开，「本地绿、CI 红」就会变成常态，
      # 而那是让人不再信任 lint 门禁最快的方式。恰好一条约束，多了少了都当场抛
      # ——安静地取到 None 再 `pip install ` 会装上最新版，正好是要防的事。
      #
      # 刻意**不装本项目**（`pip install -e .` 会拖进 flask + pymupdf）：
      # ruff 是纯静态分析，一个 import 都不需要执行。
      - name: 安装 Ruff（版本取自 pyproject 的 dev extra，单一出处）
        run: |
          set -euo pipefail
          SPEC=$(python -c "
          import pathlib, tomllib
          d = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          got = [s for s in d['project']['optional-dependencies']['dev']
                 if s.replace('_', '-').lower().startswith('ruff')]
          if len(got) != 1:
              raise SystemExit(f'dev extra 里应当恰好有一条 ruff 约束，实际：{got}')
          print(got[0])
          ")
          echo "ruff spec（来自 pyproject）：$SPEC"
          python -m pip install "$SPEC"
          ruff --version
      # `--output-format github` 让每条诊断变成 PR「Files changed」里那一行上的
      # 行内批注——从红灯到定位是一次点击，而不是翻日志找行号。
      # 规则集与豁免全在 pyproject 的 [tool.ruff]，这里**不加任何 --select /
      # --ignore**：命令行上再写一份，本地跑的就不是 CI 跑的那一套了。
      - name: Ruff check
        run: ruff check --output-format github .
      # **同一个 job、同一份 ruff、同一次 runner setup**——不新开 GitHub job，
      # 也就不会多出第四个 required context，Gate 结构一个字不动。
      #
      # 分成两步而不是 `ruff check . && ruff format --check .`：合成一条时先失败
      # 的那个会掩盖后一个，开发者修完格式重新 push 才发现还有 lint 错，一次
      # CI 往返只换回一半信息。`if: always()` 让两条都出结论。
      #
      # **只 --check，不写回**：门禁替你把红的改绿了，就不再是门禁。
      - name: Ruff format --check
        if: always()
        run: ruff format --check .

      # `.git-blame-ignore-revs` 里写错的 SHA **不会喊疼**：git 对一个不存在的
      # 全长 SHA 静默放过（exit 0，什么都不跳过）。pytest 里那条存在性判据在 CI
      # 的浅克隆上只能 skip——`actions/checkout` 默认 `fetch-depth: 1`，历史对象
      # 根本没下载——也就是说**它在 CI 里从没执行过**，一个不存在的 40 位 SHA
      # 能通过全部门禁，正是它声称要防的那种静默失效。（Codex 在 #176 上指出的
      # 就是这个洞：判据把自己的盲点写在了明处，但写在明处不等于补上了。）
      #
      # 这一步用**定向 fetch** 补上，不必把整个 checkout 换成 fetch-depth: 0：
      # GitHub 允许按 SHA fetch，实测存在返回 0、不存在返回 128。代价约一秒。
      - name: 校验 .git-blame-ignore-revs 里的每个 SHA 真的存在
        if: always()
        run: |
          set -euo pipefail
          n=0
          while read -r sha; do
            n=$((n + 1))
            git fetch --quiet --depth=1 origin "$sha" || {
              echo "::error::.git-blame-ignore-revs 里的 $sha 在本仓库不存在（合并队列强制 SQUASH，多半是忘了换成 squash 之后的 SHA）"
              exit 1
            }
            git cat-file -e "${sha}^{commit}" || {
              echo "::error::$sha 存在但不是一个 commit"
              exit 1
            }
            echo "  ok $sha"
          done < <(grep -vE '^[[:space:]]*(#|$)' .git-blame-ignore-revs)
          # 一条都没解析出来时必须红：否则文件被清空 / 格式变了，这一步会变成
          # 一个永远绿的空循环——正是本仓库反复吃过亏的那种空门禁。
          if [ "$n" -eq 0 ]; then
            echo "::error::.git-blame-ignore-revs 里一条 SHA 都没解析出来——文件空了还是格式变了？"
            exit 1
          fi
          echo "校验通过：$n 条"

  # ────────────────────────────────────────────────────────────────
  # CLA 资格：这个 PR 里出现的每一个人，是不是都已经签过、或被显式豁免。
  # 判定逻辑在 scripts/ci/cla_gate.py，政策与豁免在 .github/cla-policy.json。
  #
  # **签署事实的唯一权威是签名服务商（provider），仓库不保存 signer 名单。**
  # 早期版本曾带一份手工维护的 docs/legal/cla-signatures.json，那会和服务商的
  # 数据库变成两个法律权威，分叉之后没有机制说得清哪份算数，已经删掉。
  # provider 尚未配置时，判定器对任何非豁免的人类贡献者一律阻断并给出指引
  # ——**绝不因为「服务还没接上」就把外部贡献者当成签过**。
  #
  # 三条形状上的要求，坏掉都不会有别的测试红，所以
  # tests/test_legal_contribution_policy.py 逐条钉住：
  #
  # 1. **merge_group 上必须跑并且成功，不能 skipped。** fast gate
  #    （aggregate_gate.py --mode fast）把 skipped 一律当失败，这一格在队列
  #    候选上被跳过 = 整个 `CI fast gate` 永远红，谁也合不进去。脚本在
  #    merge_group 上判 not_applicable 并退出 0——资格在 PR 阶段已经验过。
  # 2. **不 checkout PR 的代码，一行都不执行。** 这个 job 读的是权利判定的
  #    输入，被 PR 改写的树不能参与判定自己。判定器、政策、签署记录、协议正文
  #    **全部取自默认分支**（与两个 Gate 取 aggregate_gate.py 同一条纪律），
  #    PR 侧只经 GitHub API 读元数据。因此这里**没有 actions/checkout**。
  # 3. **权限最小。** contents: read 读默认分支的文件，pull-requests: read 读
  #    PR 的 commit 列表。不写 comment、不写 status——签署 UX 归签名服务商，
  #    这一格只负责判定。没有任何 secret。启用 provider 时才需要再加
  #    `checks: read`（读它那条 check 的结论），届时同步改 tests 里的权限断言。
  #
  # 用 pull_request 而**不是** pull_request_target：后者会让这个 job 拿到写
  # 权限与 secret，然后所有防护都变成「别执行 PR 的代码」这一条人为纪律。
  # 这里根本不需要那些权限，于是也就没有那类风险面。
  #
  # ⚠ **判定器的接口变更必须先落 main，才能在这里使用。**
  # workflow 取自本次 revision（新），判定器取自默认分支（旧）——这是上面
  # 第 2 条那个安全性质的必然代价：PR 不能改写审判自己的尺子，也就意味着
  # PR 里的判定器改动在 CI 里**不参与执行**。给判定器加新参数、改参数名、
  # 或依赖它的新行为，都会在同一个 PR 里失败（`unrecognized arguments`）。
  # workflow 与判定器**不能在同一个 PR 里同步演进**。
  #
  # 2026-08-28 这条约束现形了三次：判据与政策必须先在 main（拆成两个 PR
  # 才解开）、这一格的红一直持续到内容层落地、以及给判定器加
  # `--expected-commits` 时。所以能在 workflow 里做的断言就别推给判定器
  # ——上面那段提交数核对正是因此写在 bash 里。
  # ────────────────────────────────────────────────────────────────
  cla-check:
    name: Contributor licence (CLA)
    # 与其它快线一致；**merge_group 必须在内**（见上面第 1 条）。
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # 判定的全部输入取自默认分支——**不 checkout 本次 revision**。
      # 与两个 Gate 取判定器同一个理由：被审的树不能参与判定自己。
      - name: 取默认分支上的可信判定输入
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted-cla"
          mkdir -p "$TRUSTED/scripts/ci" "$TRUSTED/.github" "$TRUSTED/docs/legal"
          fetch() {   # $1 = 仓库内路径
            gh api "repos/$REPO/contents/$1?ref=$REF" --jq .content \
              | base64 -d > "$TRUSTED/$1"
            [ -s "$TRUSTED/$1" ] || { echo "::error::默认分支上取不到 $1"; exit 1; }
          }
          fetch scripts/ci/cla_gate.py
          fetch .github/cla-policy.json
          fetch docs/legal/CLA_INDIVIDUAL.md
          fetch docs/legal/CLA_CORPORATE.md
          echo "TRUSTED=$TRUSTED" >> "$GITHUB_ENV"

      # PR 侧只读元数据：作者 + 每个 commit 的 author + Co-authored-by。
      # 只看 PR 发起人是不够的——commit 作者和 co-author 同样在投稿。
      # `--paginate` 的**输出形状随 gh 版本而变**：gh 2.97 对 REST 数组端点会把
      # 各页合并成一个数组，而 `gh api --help` 写的是「Each page is a separate
      # JSON array or object」。判定器三种形状都吃（见 load_commits），所以这里
      # 不去赌 runner 装的是哪个版本。
      #
      # **`--slurp` 是错的解法**：它把每页包成一层，产出数组的数组——判定器
      # 反而要额外兼容。这里刻意不用。
      #
      # 真正要防的不是形状，是**只拿到第一页却当成全部**：一个 41 提交的 PR
      # 会只判前 30 个贡献者，**报绿而实际漏判**。`test -s` 拦不住（文件非空）。
      # 所以把 PR 自己声明的提交数一并传下去，由判定器核对——少一条就红。
      - name: 收集这个 PR 的贡献者（只读元数据）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            > "$RUNNER_TEMP/pr-commits.json"
          test -s "$RUNNER_TEMP/pr-commits.json"

          # **核数量，不信分页。** `test -s` 只证明文件非空，挡不住「只拿到
          # 第一页」——那会让判定器按不完整的贡献者名单判绿。
          #
          # 计数用 `--jq` **流式**输出：它按页应用过滤器、每条一行，因此与
          # 「gh 有没有把各页合并成一个数组」无关（实测 per_page=5/10/100，
          # 也就是 9/5/1 页，都数出 41）。对照组取 PR 自己的 `commits` 字段。
          #
          # **不要用 `--slurp`**：它把每页包成一层，`length` 数出来的是**页数**
          # 而不是提交数（实测 5 页 → 5）。
          want=$(gh api "repos/$REPO/pulls/$PR" --jq '.commits')
          got=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[].sha' | wc -l | tr -d ' ')
          if [ "$got" != "$want" ]; then
            echo "::error::取到 $got 个提交，但这个 PR 声明有 $want 个——分页没取全。"\
                 "绝不按不完整的贡献者名单判定：漏掉的人不会被检查，而门禁会报绿。"
            exit 1
          fi
          echo "提交数核对通过：$got / $want"

      # -I（隔离模式）：不把脚本目录挂进 sys.path、无视 PYTHONPATH——
      # 与两个 Gate 同一双保险。
      - name: 判定
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # provider.configured=true 之后这里还要多传 --provider-checks-json，
          # 并给 job 加 `checks: read`——步骤见 docs/legal/CLA_AUTOMATION_SETUP.md。
          ARGS=(--event "${{ github.event_name }}"
                --policy "$TRUSTED/.github/cla-policy.json"
                --repo-root "$TRUSTED")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS+=(--pr-author "$PR_AUTHOR"
                   --commits-json "$RUNNER_TEMP/pr-commits.json")
          fi
          python3 -I "$TRUSTED/scripts/ci/cla_gate.py" "${ARGS[@]}"

  # ────────────────────────────────────────────────────────────────
  # 第 1 层最靠前的一格：引擎的**结构性不变式**（tests/test_invariants_engine.py
  # + 与它同一族的 artist family / patchspec / preflight 契约）。
  #
  # 它跑的是 backend 的**子集**，所以不是新增门禁，是把最会红的那几条提前
  # 到两三分钟内回来——等 backend 矩阵跑完再发现「撤销回不到原样」太晚了。
  # 真正的 pass/fail 仍由 backend-fast / backend-platforms 负责，这一格红了
  # 它们必然也红。它经 `CI fast gate` 参与合并资格（ruleset 只认三个 Gate；
  # 改名或从 Gate 的 needs 里摘掉之前，先看 aggregate_gate 的闭集规则）。
  #
  # 不做 paths 过滤：不变式验的是引擎语义与它的对外契约，而「哪些文件会影响
  # 引擎语义」本身就是一个会漏配的判断——漏一条换来的是「改了契约却没人跑
  # 不变式」，静默不跑的门禁与空转的门禁一样坏。
  # ────────────────────────────────────────────────────────────────
  invariants:
    # 快线只在 PR 与 merge_group 上跑：push main 的树就是 merge_group 上
    # 刚验过的那棵，main 侧只留 main-landing-audit（见文件抬头的分工表）。
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 科学栈按锁文件钉版本：不变式里有几条是**按实测写死的例外**
      # （`honours_stroke_style` 的网格表），版本一换实测结论可能就变了，
      # 而那正是我们想被告知的事——用的必须是用户拿到的那一套。
      - name: 安装依赖（科学栈按锁文件钉版本）
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev,ci]"
          # shellcheck disable=SC2046
          pip install $(python scripts/ci/runtime_pins.py)
          python -c "import matplotlib;print('matplotlib', matplotlib.__version__)"
      - name: 结构性不变式
        run: |
          python -m pytest -q \
            tests/test_invariants_engine.py \
            tests/test_artist_families.py \
            tests/test_artist_census_tool.py \
            tests/test_patchspec.py \
            tests/test_preflight.py
      # 探针自己也要能单独跑起来——它是排兼容缺口时第一个被拿起来的东西
      - name: 不变式探针（人看的那份）
        if: always()
        run: python tests/support/engine_invariant_probe.py --pretty

  # 跨平台是产品承诺，就得跨平台跑——但**在哪个提交上跑**分了工：
  # backend-fast 守 Python 下界与主开发版本，每个 PR push 都回来；
  # backend-platforms 守 mac / Windows 的平台相关代码（数据目录、worker
  # 解释器探测、路径分隔符），在 merge_group 的最终组合提交（或 full-ci PR）
  # 上跑。两个 job 合起来与从前的四腿矩阵**逐档相同**：
  # Linux 3.10 / Linux 3.13 / macOS 3.13 / Windows 3.13，一档没少
  # （tests/test_merge_queue_workflows.py 对拍这四档）。
  backend-fast:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.13" }
    # 同 backend-platforms：实测 20–25 分钟，40 给余量。没有上限的 job
    # 在 merge_group 上会把队列堵死，而队列堵死时**所有** PR 都落不了地。
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # matplotlib 单独装：pyproject 的主依赖刻意不含科学栈（Flask 父进程的
      # 依赖边界），CI 里装上让 worker round-trip 用例真正执行而非跳过
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install matplotlib
      - name: pytest
        run: python -m pytest

  # backend 的最终平台线：macOS / Windows 各一档 3.13。只在 merge_group 的
  # 组合提交（或带 full-ci 标签的 PR）上跑——普通 PR 不再等两台最慢的
  # runner，而最终进 main 的每一棵树仍然四档全跑过。
  backend-platforms:
    if: >-
      github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    # 上一轮实测 27:57（Windows，2994 条）。45 分钟给足余量，但**必须有**：
    # 这个 job 没有上限时，一条挂死的用例会把整个**合并队列**堵住——
    # 2026-08-28 就发生过一次，8 小时 20 分，其间没有任何 PR 能落地。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install matplotlib
      - name: pytest
        run: python -m pytest

  # ────────────────────────────────────────────────────────────────
  # Matplotlib 兼容性冒烟（CompatBench 的 PR 档）
  #
  # 它与 backend 的 pytest 问的不是同一件事：pytest 验的是「我们写过的行为
  # 还对不对」，这里验的是「外部 matplotlib 世界的常见写法我们还接不接得住」
  # ——`plt.show()` 无 savefig、相对路径读盘、顶层直写、中文路径、pandas
  # 出图这些，没有一条是我们自己的代码，却全是用户真会写的。
  #
  # PR 上**只跑 smoke 子集、不跑保真度**：目标 2~4 分钟。全量 150 case ×
  # 多运行时是 nightly 的活（lab-ci.yml），塞进每个 PR 只会让人开始跳过它。
  # 单跑一台 Linux：兼容性是引擎语义，没有平台分支；跨平台由 backend 矩阵盖。
  # ────────────────────────────────────────────────────────────────
  compat-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    timeout-minutes: 20  # 实测 2.4 分钟；没有上限的 job 会堵死合并队列
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 科学栈版本取自 packaging/runtime-lock.json，不用 `pip install matplotlib`：
      # 零 patch 保真度与 manifest 结构都对 matplotlib 版本敏感，用锁文件才能
      # 保证「CI 上验的」与「用户拿到的内置 runtime」是同一套。
      - name: 安装依赖（科学栈按锁文件钉版本）
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev,ci]"
          # shellcheck disable=SC2046
          pip install $(python scripts/ci/runtime_pins.py --include-corpus)
          python -c "import matplotlib;print('matplotlib', matplotlib.__version__)"
      - name: CompatBench smoke
        run: |
          python scripts/ci/compat_matrix.py --smoke --no-fidelity \
            --gate pr --out "$RUNNER_TEMP/compat"
      - name: 失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/compat/**
          retention-days: 7
          if-no-files-found: warn

  frontend:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    timeout-minutes: 20  # 实测 2.2 分钟；没有上限的 job 会堵死合并队列
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # 翻译检查（key 对齐 / 空翻译 / 插值与复数形态 / 硬编码文案 / 生成的类型
      # 是否过期）。缺翻译在这里必须**失败**，不是打条 warning 就放行——
      # 界面上一串 `project.actions.create` 是发出去才被用户发现的那类问题。
      - run: pnpm i18n:check
      - run: pnpm test
      # 真类型检查在 `pnpm build` 的 `tsc -b` 里。这里曾经是 `pnpm tsc --noEmit`：
      # 根 tsconfig 是 `files: []` + references 的方案文件，--noEmit 不走项目引用、
      # 什么都不编，恒绿——一个报平安的空门禁比没有门禁更坏。
      - run: pnpm build
      # Codex 内嵌画布是 web/src 打出来的单文件产物，随插件一起提交进仓库。
      # 改了前端却没重跑它，用户在 Codex 里装到的画布就是上一版——功能全在、
      # 只是旧，零报错。指纹算法纯 Python，这一步不需要 Node。
      - name: MCP 画布产物与前端源码同步
        working-directory: .
        run: python3 scripts/build_mcp_widget.py --check
      # 浏览器 playground（网站 /try，ADR 0007）：产物由本仓库构建、由网站仓库
      # 提交。这里真跑一遍构建（vite + engine.zip + 指纹 manifest），保证构建
      # 脚本随前端一起是活的；「网站上那份是不是过期」的门禁在网站仓库——
      # `pnpm check-playground` 调本仓库的 --fingerprint 重算比对。
      - name: 浏览器 playground 构建
        working-directory: .
        run: python3 scripts/build_browser_playground.py

  # Rust supervisor 的静态门禁。desktop-tauri.yml 里也有一份，但那个工作流只在
  # 打 tag / workflow_dispatch 时跑——改了 workerd 的 PR 因此一路全绿，要等到
  # 发版那天才知道 clippy 挑了刺或 golden vectors 对不上。而
  # workerd/src/patchspec.rs 必须**逐字节**复现 engine/patchspec.py，硬验收
  # （tests/golden/patch_vectors.json）正是跑在 cargo test 里的：跨侧漂移是这个
  # 仓库最贵的一类缺陷，它的门禁不能只挂在发行链上。
  #
  # **刻意不做 paths 过滤**。它与 backend / *-smoke 那几档并行，本机整套
  # fmt+clippy+test 12 秒，CI 上加缓存命中的编译也远不到 PR 的瓶颈；而漏配一条
  # 路径（忘了 patchspec.py、忘了 golden vectors）换来的是「改了跨侧契约却没人
  # 跑 Rust」——静默不跑的门禁与空转的门禁一样坏，省这一两分钟不值。
  #
  # 只在 Linux 上跑一份：纯标准库 + serde 的 stdio 进程，没有平台分支。
  workerd:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    timeout-minutes: 15  # 实测 0.3 分钟；没有上限的 job 会堵死合并队列
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workerd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workerd
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # supervisor_behaviour.rs 起的是真二进制 + tests/fake_worker.py，
      # 靠 runner 自带的 python3（`PYTHON` 可覆盖）
      - run: cargo test

  package:
    # 装出来的 wheel 必须自带界面并且能真的起起来——这条流水线专门盯
    # 「本地能跑但打包后 404」这类只在发布时才暴露的问题。
    # 合并资格档：只在 merge_group 的组合提交（或带 `full-ci` 标签的 PR）上
    # 跑——这一档是这套 CI 里最贵的部分，而它真正要回答的问题是「这个最终
    # 组合能不能进 main」，那个问题只在 merge_group 上问得准确。
    # 显式按事件分支，不写 `!= 'pull_request'` 这种过宽条件：那种否定式会把
    # push / schedule / 未来新增的任何事件全兜进重型路径，而 PR 字段只在
    # pull_request 事件里存在——merge_group payload 里没有 draft / labels。
    if: >-
      github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    needs: [backend-fast, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 60  # 与 windows-exe-smoke / macos-app-smoke 同档；没有上限的 job 会堵死合并队列
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 构建前端进包
        run: python scripts/build_frontend.py
      - name: 打 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: 装进干净环境并冒烟
        shell: bash
        run: |
          python -m venv /tmp/smoke
          BIN=/tmp/smoke/bin; [ -d "$BIN" ] || BIN=/tmp/smoke/Scripts
          "$BIN/python" -m pip install --quiet dist/*.whl
          "$BIN/python" -c "import tavotto; print('version', tavotto.__version__)"
          "$BIN/python" -c "
          from pathlib import Path
          import tavotto
          web = Path(tavotto.__file__).parent / 'web' / 'index.html'
          assert web.is_file(), 'wheel 里没有前端构建产物'
          print('frontend ok')
          "
          "$BIN/python" -c "
          from tavotto.engine import pool
          assert pool.WORKER_PY.is_file(), 'wheel 里没有 worker.py'
          print('worker ok')
          "
      - name: 起服务并请求首页
        shell: bash
        env:
          TAVOTTO_DATA_DIR: ${{ runner.temp }}/tavotto-data
          TAVOTTO_CONFIG_DIR: ${{ runner.temp }}/tavotto-config
        run: |
          BIN=/tmp/smoke/bin; [ -d "$BIN" ] || BIN=/tmp/smoke/Scripts
          "$BIN/python" -m tavotto --port 5199 --no-browser &
          sleep 8
          curl -sf http://127.0.0.1:5199/ -o /dev/null
          curl -sf http://127.0.0.1:5199/api/version
          echo

  windows-exe-smoke:
    # 「只在别人电脑上发生」的问题基本都在这一段：打包后的 .exe、隔离的
    # 用户目录、真实的渲染与导出。GitHub 提供 windows-latest 托管运行器，
    # 所以日常拦截不需要自己常备一台 Windows。
    #
    # **本作业是内置渲染 runtime 的唯一真验证点**：Windows 桌面版承诺
    # 「没装过 Python 的电脑装完就能渲染、首次不联网」，而这条承诺只有把
    # runtime 真构建出来、真打进 .exe、再在**不给 TAVOTTO_WORKER_PYTHON** 的
    # 情况下真跑一次渲染与导出，才算验过。所以它进 PR/main 门禁，
    # 不是只挂在手动的 Release 工作流上。
    #
    # 走的是 scripts/smoke_app.py（与 nightly 共用同一条路径），失败时把
    # app.log / worker.log / runtime 清单一起传上来。
    # 合并资格档：只在 merge_group 的组合提交（或带 `full-ci` 标签的 PR）上
    # 跑——这一档是这套 CI 里最贵的部分，而它真正要回答的问题是「这个最终
    # 组合能不能进 main」，那个问题只在 merge_group 上问得准确。
    # 显式按事件分支，不写 `!= 'pull_request'` 这种过宽条件：那种否定式会把
    # push / schedule / 未来新增的任何事件全兜进重型路径，而 PR 字段只在
    # pull_request 事件里存在——merge_group payload 里没有 draft / labels。
    if: >-
      github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    needs: [backend-fast, frontend]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端进包
        run: python scripts/build_frontend.py

      # Rust supervisor：tavotto.spec 从 workerd/target/release/ 取，取不到直接
      # 失败。**不设 TAVOTTO_WORKERD**——下面的冒烟要验的正是「产物自带的那份
      # 被自动找到并真的用上了」。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workerd
      - name: 构建 Rust supervisor（tavotto-workerd）
        run: cargo build --release --manifest-path workerd/Cargo.toml

      - name: 缓存 CPython 归档下载
        # 只缓存那个官方 zip（按锁文件内容做 key）。wheel 不缓存：
        # 每次真从 PyPI 装一遍，才能发现「锁文件里的版本被 yank 了」这类问题。
        # key 带上 runner 的平台/架构：不同目标下的是不同的归档，共用一个 key
        # 会让 macOS 那条腿命中 Windows 的缓存（然后 sha256 对不上、白下一次）。
        uses: actions/cache@v4
        with:
          path: build/runtime-cache
          key: cpython-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/runtime-lock.json') }}

      - name: 构建内置渲染 runtime
        # 脚本自己会做 SHA-256 校验、版本核对，并**逐个 import + 画一张真图**；
        # 任何一步不过就直接失败在这里，而不是留到用户机器上。
        run: python scripts/build_worker_runtime.py --clean

      - name: 装打包依赖
        # 主进程**不装科学栈**，免得 PyInstaller 顺手打进去——科学栈只存在于
        # 内置 runtime 里，这条边界一破，包大小和依赖关系立刻失控。
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install "flask>=3.1,<4" "pymupdf>=1.24,<2"

      - name: PyInstaller（内置 runtime 必须进包）
        env:
          TAVOTTO_REQUIRE_RUNTIME: "1"
        run: pyinstaller packaging/tavotto.spec --noconfirm

      - name: 断言产物里真有 workerd
        run: |
          $bin = "dist\Tavotto\_internal\tavotto-workerd.exe"
          if (-not (Test-Path $bin)) {
            throw "产物里没有 $bin——渲染会静默回退到 Python 池（功能全在、只是慢）"
          }
          "{0:N0} KiB" -f ((Get-Item $bin).Length / 1KB)

      # 只装桌面版的用户全靠这一个可执行文件被外部程序（Codex 插件）发现。
      # **在真 Windows 产物上验**：GUI 与 console 是两个子系统，源码级测试
      # 只能证明 spec 里写了，证明不了打出来的东西真能当命令行用。
      - name: 断言产物里有 console 版 CLI，并且它真能当命令行用
        run: |
          $cli = "dist\Tavotto\tavotto-cli.exe"
          if (-not (Test-Path $cli)) {
            throw "产物里没有 $cli——只装桌面版的用户那里 Codex 插件会报「没找到 Tavotto」"
          }
          # GUI 版 Tavotto.exe 拿不到 stdout（输出会被改道进 app.log），
          # console 版必须**真的**把那行 JSON 交到管道里来。
          $env:TAVOTTO_CONFIG_DIR = "$env:RUNNER_TEMP\cli-cfg"
          $env:TAVOTTO_DATA_DIR   = "$env:RUNNER_TEMP\cli-data"
          $out = & $cli doctor --json
          if ($LASTEXITCODE -ne 0) { throw "tavotto-cli doctor 失败（$LASTEXITCODE）: $out" }
          $j = $out | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $j.ok) { throw "doctor 报了问题: $out" }
          if (-not $j.frozen) { throw "doctor 没认出自己是冻结产物: $out" }
          if (-not $j.cli) { throw "doctor 定位不到自己的 CLI: $out" }
          Write-Host "tavotto-cli: $($j.cli)（协议 v$($j.protocol)）"

          # 交接协议在真产物上跑一遍：登记 + 不唤起界面，路径带中文和空格
          $proj = "$env:RUNNER_TEMP\我的 图库"
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Copy-Item examples\runtime_check\*.py $proj -Force
          $script = @(Get-ChildItem $proj -Filter *.py)[0].FullName
          $out = & $cli open "$script" --json --no-launch
          if ($LASTEXITCODE -ne 0) { throw "tavotto-cli open 失败（$LASTEXITCODE）: $out" }
          $j = $out | Select-Object -Last 1 | ConvertFrom-Json
          if (-not $j.ok) { throw "open 回了 ok=false: $out" }
          if ($j.launch) { throw "--no-launch 却起了界面: $out" }
          if (-not (Test-Path "$proj\tavotto_registry.json")) { throw "没生成 tavotto_registry.json" }
          # `tavotto run` 的打包闭包复核（ADR 0021）。runcli / runspec /
          # runcodes 靠 PyInstaller 的字节码分析被收进去，spec 里没有它们的
          # 名字——漏收的表现不是构建失败，是用户机器上的 ModuleNotFoundError。
          # 两条都**不起任何子进程**：--help 退 0；故意的用法错误退 2，后者
          # 顺带证明 runcodes 的退出码闭集也真的进了包（--help 碰不到它）。
          & $cli run --help > $null
          if ($LASTEXITCODE -ne 0) { throw "tavotto-cli run --help 失败（$LASTEXITCODE）——runcli 多半没进包" }
          & $cli run python x.py 2>&1 > $null
          if ($LASTEXITCODE -ne 2) { throw "tavotto-cli run 的用法错误退出码是 $LASTEXITCODE，应为 2" }
          Write-Host "✓ 真产物上的 doctor / open --json --no-launch / run 闭包都通了"

      - name: 断言产物里真有内置 runtime
        run: |
          $rt = "dist\Tavotto\_internal\runtime"
          if (-not (Test-Path "$rt\python.exe")) { throw "产物里没有 $rt\python.exe" }
          if (-not (Test-Path "$rt\runtime-manifest.json")) { throw "产物里没有 runtime 清单" }
          $m = Get-Content "$rt\runtime-manifest.json" -Raw | ConvertFrom-Json
          if ($m.build.smoke -ne "passed") { throw "runtime 未通过 import 冒烟: $($m.build.smoke)" }
          Write-Host "内置 runtime: Python $($m.python.version)，$($m.packages.PSObject.Properties.Count) 个锁定包"
          "{0:N0} MiB" -f ((Get-ChildItem $rt -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: 冒烟①：干净 Windows（无 Python / 无 TAVOTTO_WORKER_PYTHON）
        # **本次改动的核心验收**。--expect-source bundled 断言渲染真的走了内置
        # runtime：少了它，一台碰巧装着 matplotlib 的 CI 机器会让「runtime 根本
        # 没打进去」全程绿灯。smoke_app.py 还会主动把 TAVOTTO_WORKER_PYTHON 摘掉。
        # 此刻运行器上**尚未** pip install matplotlib（在下一步才装），
        # 所以这一步同时也证明了「机器上没有科学栈也能渲染」。
        # --expect-control-plane workerd 是同一条思路的另一面：产物自带的
        # Rust supervisor 被自动找到、并且这次渲染真的跑在它上面
        # （回退到 Python 池是静默降级，不断言就永远发现不了）。
        run: |
          $env:TAVOTTO_WORKER_PYTHON = $null
          python scripts/smoke_app.py --exe dist/Tavotto/Tavotto.exe `
            --figures examples/runtime_check `
            --expect-source bundled --expect-runtime `
            --expect-control-plane workerd `
            --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib

      - name: 冒烟②：中文 + 空格路径下仍走内置 runtime
        # 用户名带中文、项目路径带空格是国内最常见的组合，也是历来最容易
        # 出问题的一档（编码、引号、路径分隔符）
        run: |
          $env:TAVOTTO_WORKER_PYTHON = $null
          $dst = "$env:RUNNER_TEMP\我的 论文 图\figures"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item examples\runtime_check\* $dst -Recurse -Force
          python scripts/smoke_app.py --exe dist/Tavotto/Tavotto.exe `
            --figures "$dst" --expect-source bundled

      - name: 准备渲染环境（模拟用户自己的 Python）
        run: python -m pip install matplotlib

      - name: 冒烟③：用户指定的解释器仍然优先于内置
        # 高级用户的出口不能被内置 runtime 挤掉——脚本要 rdkit / 自家实验室的库时
        # 只有他自己那套环境才行。expect-source=env_override 就是这条的看护。
        run: |
          $env:TAVOTTO_WORKER_PYTHON = (Get-Command python).Source
          python scripts/smoke_app.py --exe dist/Tavotto/Tavotto.exe `
            --expect-source env_override

      - name: Playwright 黄金路径（真实界面 + 打包产物 + 内置 runtime）
        working-directory: web
        run: |
          $env:TAVOTTO_WORKER_PYTHON = $null
          $env:TAVOTTO_EXE = "$env:GITHUB_WORKSPACE\dist\Tavotto\Tavotto.exe"
          pnpm install --frozen-lockfile
          # webkit = macOS 桌面壳（WKWebView）与 Safari 的引擎（审计 P1-03）：
          # 黄金路径与可访问性在它上面各跑一遍
          pnpm exec playwright install --with-deps chromium webkit
          pnpm e2e

      - name: 失败时收集日志与操作轨迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: |
            ${{ runner.temp }}/**/app.log
            ${{ runner.temp }}/**/worker.log
            dist/Tavotto/_internal/runtime/runtime-manifest.json
            build/**/warn-*.txt
            web/playwright-report/**
            web/test-results/**
          if-no-files-found: warn
          retention-days: 7

  macos-app-smoke:
    # windows-exe-smoke 的 macOS 对应物（2026-08-18 起）。
    #
    # macOS 桌面版从这一版开始也自带内置渲染 runtime，于是同一条承诺
    # 「没装过 Python / Homebrew / Conda 的 Mac 装完就能渲染、首次不联网」
    # 也需要一个真验证点。**它必须真构建 runtime、真打进产物、再在不给
    # TAVOTTO_WORKER_PYTHON 的情况下真跑一次渲染与导出**——否则一台碰巧装着
    # matplotlib 的运行器会让「runtime 根本没打进去」全程绿灯，而那正是
    # 用户装完打不开图的原因。
    #
    # 这一档在托管运行器上要跑十来分钟（下 25 MiB CPython + 装 300 MiB 科学栈
    # + PyInstaller）。值得：在这之前 macOS 这条腿的渲染是靠 CI 现建的
    # worker-env 撑着的，等于什么都没验。
    #
    # e2e 不在这里跑（Windows 那条已经覆盖真实界面），避免把 PR 门禁再拉长一倍。
    # 合并资格档：只在 merge_group 的组合提交（或带 `full-ci` 标签的 PR）上
    # 跑——这一档是这套 CI 里最贵的部分，而它真正要回答的问题是「这个最终
    # 组合能不能进 main」，那个问题只在 merge_group 上问得准确。
    # 显式按事件分支，不写 `!= 'pull_request'` 这种过宽条件：那种否定式会把
    # push / schedule / 未来新增的任何事件全兜进重型路径，而 PR 字段只在
    # pull_request 事件里存在——merge_group payload 里没有 draft / labels。
    if: >-
      github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    needs: [backend-fast, frontend]
    runs-on: macos-latest        # 目前只有 Apple Silicon 一档；Intel 未构建未验证
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端进包
        run: python scripts/build_frontend.py

      # **不设 TAVOTTO_WORKERD**——冒烟要验的正是「产物自带的那份被自动找到」
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workerd
      - name: 构建 Rust supervisor（tavotto-workerd）
        run: cargo build --release --manifest-path workerd/Cargo.toml

      - name: 缓存 CPython 归档下载
        uses: actions/cache@v4
        with:
          path: build/runtime-cache
          key: cpython-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/runtime-lock.json') }}

      - name: 构建内置渲染 runtime（python-build-standalone）
        # 目标按本机平台/架构自动挑。脚本自己做 SHA-256 校验（期望值取自 pbs
        # 上游发布的 SHA256SUMS）、按 .dist-info 核对版本，并用刚装好的解释器
        # **逐个 import + 画一张真图**；任何一步不过就直接失败在这里。
        run: python scripts/build_worker_runtime.py --clean

      - name: 装打包依赖
        # 主进程**不装科学栈**，免得 PyInstaller 顺手打进去
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install "flask>=3.1,<4" "pymupdf>=1.24,<2"

      - name: PyInstaller（内置 runtime 必须进包）
        env:
          TAVOTTO_REQUIRE_RUNTIME: "1"
        run: pyinstaller packaging/tavotto.spec --noconfirm

      - name: 断言产物里真有 workerd 与内置 runtime
        run: |
          set -euo pipefail
          BIN=dist/Tavotto/_internal/tavotto-workerd
          test -x "$BIN" || { echo "::error::产物里没有 $BIN——渲染会静默回退到 Python 池"; exit 1; }

          RT=dist/Tavotto/_internal/runtime
          test -f "$RT/runtime-manifest.json" || { echo "::error::产物里没有 runtime 清单"; exit 1; }
          # 解释器的落点**从清单里读**，不写死 bin/python3——构建时会把
          # python / python3 两个别名剪掉（Tauri 拍平符号链接 = 白搭 34 MiB），
          # 实体是版本化的 bin/python3.13，而那个名字会随 CPython 升版而变。
          python - "$RT" <<'PY'
          import json, os, sys
          rt = sys.argv[1]
          m = json.load(open(os.path.join(rt, "runtime-manifest.json"), encoding="utf-8"))
          if m["build"]["smoke"] != "passed":
              raise SystemExit(f"::error::runtime 未通过 import 冒烟: {m['build']['smoke']}")
          py = os.path.join(rt, m["build"]["interpreter"])
          if not os.access(py, os.X_OK):
              raise SystemExit(f"::error::产物里没有可执行的解释器: {py}")
          print(f"内置 runtime: {m['platform']['os']}/{m['platform']['arch']} "
                f"Python {m['python']['version']}，{len(m['packages'])} 个锁定包，"
                f"解释器 {m['build']['interpreter']}")
          PY
          du -sh "$RT"

      - name: 架构核对（产物里不许混进另一个架构的 Mach-O）
        # 一个 x86_64 的 .so 混进 arm64 的包里，签名/公证都可能过，
        # 症状要等到用户 import 那个包时才出现
        run: |
          python scripts/codesign_macos.py scan --app dist/Tavotto --quiet \
            --expect-arch "$(python -c 'import platform;print(platform.machine())')"

      - name: 冒烟①：干净 Mac（无 Homebrew/Conda 干扰、无 TAVOTTO_WORKER_PYTHON）
        # **本次改动的核心验收**。--expect-source bundled 断言渲染真的走了内置
        # runtime；--expect-runtime 再断言「本该带 runtime 且带的这份完整」。
        # 此刻运行器上**尚未** pip install matplotlib（在下一步才装），
        # 所以这一步同时证明了「机器上没有科学栈也能渲染」。
        # smoke_app.py 会主动把 TAVOTTO_WORKER_PYTHON / Conda / PYTHONHOME 摘掉。
        run: |
          python scripts/smoke_app.py --exe dist/Tavotto/Tavotto \
            --figures examples/runtime_check \
            --expect-source bundled --expect-runtime \
            --expect-control-plane workerd \
            --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib

      - name: 冒烟②：中文 + 空格路径下仍走内置 runtime
        # 项目路径与**用户数据目录**都放到中文+空格路径下——两者的失败方式不同
        run: |
          set -euo pipefail
          DST="$RUNNER_TEMP/我的 论文 图/figures"
          mkdir -p "$DST"
          cp -R examples/runtime_check/. "$DST/"
          python scripts/smoke_app.py --exe dist/Tavotto/Tavotto \
            --figures "$DST" --workdir "$RUNNER_TEMP/我的 数据 目录" \
            --expect-source bundled --expect-runtime

      - name: 准备渲染环境（模拟用户自己的 Python）
        run: python -m pip install matplotlib

      - name: 冒烟③：用户指定的解释器仍然优先于内置
        # 高级用户的出口不能被内置 runtime 挤掉——脚本要 rdkit / 自家实验室的库时
        # 只有他自己那套环境才行
        run: |
          TAVOTTO_WORKER_PYTHON="$(command -v python)" \
            python scripts/smoke_app.py --exe dist/Tavotto/Tavotto \
              --expect-source env_override

      - name: 失败时收集日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-logs
          path: |
            ${{ runner.temp }}/**/app.log
            ${{ runner.temp }}/**/worker.log
            dist/Tavotto/_internal/runtime/runtime-manifest.json
            build/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # 稳定 Gate（Merge Queue 迁移的落点，判定逻辑在 scripts/ci/aggregate_gate.py）
  #
  # ruleset 最终只依赖这两个名字 + codeql.yml 的「CodeQL gate」。要点：
  #   * `name:` 显式固定——check run 的名字就是 required context，改名 =
  #     把仓库锁死在一个永远不会出现的 context 上；
  #   * `if: always()`——上游失败时 Gate 必须**跑起来并且红**，绝不靠
  #     「上游 skipped 所以 required check 碰巧没结论」这种随 GitHub 行为
  #     变化的缝隙；
  #   * `needs` 与 `--required` 是同一个闭集，两处必须同步改（脚本对缺失 /
  #     多余的 job 都判失败，tests/test_merge_queue_workflows.py 再对拍一道）。
  # ────────────────────────────────────────────────────────────────
  ci-fast-gate:
    name: CI fast gate
    # always() 让它在上游失败后照跑并且红；事件条件与快线一致——push main
    # 上快线不跑，Gate 也不跑（required contexts 只在 PR / merge_group 上有意义）。
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs: [python-lint, cla-check, invariants, backend-fast, frontend, workerd, compat-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # **判定器必须来自默认分支，不是本次 checkout**（#119 评审 P1）：
      # switch-to-gates 之后 Gate 是唯一的 required check，而 checkout 的是
      # PR / 队列候选的 revision——从它执行判定逻辑，恶意改动（比如塞一个
      # scripts/ci/json.py 让 `import json` 时 SystemExit(0)）能把全红的
      # needs 判成绿。默认分支上还没有这份脚本时（bootstrap 空窗，只存在于
      # 引入它的 PR 合并之前）退回本地副本并 notice。边界如实写明：needs
      # 的**输入**仍由本 revision 的 job 产出，工作流文件本身也可被 PR 改写
      # ——那一层靠人审 + thread resolution 挡，与旧 required contexts 相同；
      # 这里关掉的是「不碰 workflow、只藏一个影子模块」的静默向量。
      - name: 取默认分支上的可信判定器
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted-gate"
          DEST="$RUNNER_TEMP/trusted-gate/aggregate_gate.py"
          if gh api "repos/${{ github.repository }}/contents/scripts/ci/aggregate_gate.py?ref=${{ github.event.repository.default_branch }}" \
               --jq .content 2>/dev/null | base64 -d > "$DEST" && [ -s "$DEST" ]; then
            echo "判定器取自默认分支"
          else
            echo "::notice::默认分支上还没有 aggregate_gate.py（bootstrap 空窗）——退回本仓库副本"
            cp scripts/ci/aggregate_gate.py "$DEST"
          fi
      - name: 聚合判定
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # -I（隔离模式）：不把脚本目录挂进 sys.path、无视 PYTHONPATH——
        # 双保险挡住 stdlib 遮蔽注入
        run: |
          python3 -I "$RUNNER_TEMP/trusted-gate/aggregate_gate.py" \
            --mode fast \
            --event "${{ github.event_name }}" \
            --required python-lint,cla-check,invariants,backend-fast,frontend,workerd,compat-smoke \
            --needs-json "$NEEDS_JSON"

  ci-integration-gate:
    name: CI integration gate
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs: [backend-platforms, package, windows-exe-smoke, macos-app-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 与 fast gate 同一条纪律：判定器取默认分支（理由见上面那段注释）
      - name: 取默认分支上的可信判定器
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted-gate"
          DEST="$RUNNER_TEMP/trusted-gate/aggregate_gate.py"
          if gh api "repos/${{ github.repository }}/contents/scripts/ci/aggregate_gate.py?ref=${{ github.event.repository.default_branch }}" \
               --jq .content 2>/dev/null | base64 -d > "$DEST" && [ -s "$DEST" ]; then
            echo "判定器取自默认分支"
          else
            echo "::notice::默认分支上还没有 aggregate_gate.py（bootstrap 空窗）——退回本仓库副本"
            cp scripts/ci/aggregate_gate.py "$DEST"
          fi
      - name: 聚合判定
        # 普通 PR 允许 deferred（重型 job 整体 skipped → Gate 绿，但 summary
        # 与 JSON 明确写出「完整资格推迟到 merge_group」）；merge_group /
        # push / full-ci PR 一律 --require-heavy，skipped 就是失败。
        # full-ci 标签只在 pull_request 事件里存在，表达式先按事件分支。
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_FULL_CI: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          FLAGS="--allow-deferred"
          if [ "$GATE_EVENT" != "pull_request" ]; then
            FLAGS="--require-heavy"
          elif [ "$GATE_FULL_CI" = "true" ]; then
            FLAGS="--require-heavy --full-ci"
          fi
          # shellcheck disable=SC2086
          python3 -I "$RUNNER_TEMP/trusted-gate/aggregate_gate.py" \
            --mode integration \
            --event "$GATE_EVENT" \
            $FLAGS \
            --required backend-platforms,package,windows-exe-smoke,macos-app-smoke \
            --needs-json "$NEEDS_JSON"

  # ────────────────────────────────────────────────────────────────
  # main 落地审计——push main 上跑的唯一一个 job。
  #
  # 它**不是**合并资格的复跑：合进来的树就是 merge_group 上刚验过的那棵
  # （Merge Queue 强制、无 bypass actor，没有第二条进 main 的路），在 main 上
  # 重造三个 wheel、重打两个桌面产物只是把同一批产物再造一遍。这里只审
  # 「落地这件事本身」：落了哪个 SHA / 哪棵树、结构契约还成立、受管生成物
  # 没有漂——几分钟内回来。深度验证归 nightly / lab（当晚就会跑到这个 SHA）。
  # ────────────────────────────────────────────────────────────────
  main-landing-audit:
    name: main landing audit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 落地信息（写进 summary，作为这个 commit 的审计记录）
        run: |
          set -euo pipefail
          {
            echo "## main landing audit"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit | \`$(git rev-parse HEAD)\` |"
            echo "| tree | \`$(git rev-parse 'HEAD^{tree}')\` |"
            echo "| parents | \`$(git rev-list --parents -n 1 HEAD | cut -d' ' -f2-)\` |"
            echo "| subject | $(git log -1 --pretty=%s | head -c 200) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: workflow YAML 可解析
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  bad.append(f"{p.name}: {exc}")
          if bad:
              sys.exit("\n".join(bad))
          print("workflow YAML 全部可解析")
          PY
      - name: 受管生成物一致性（MCP 画布指纹，纯 Python，不需要 Node）
        run: python3 scripts/build_mcp_widget.py --check
      - name: CI 结构契约（不依赖科学栈的那部分）
        # 这些测试只读文件与脚本、纯标准库：Gate 闭集、merge_group 触发、
        # 并发不取消队列、发布编排契约、Ruleset 迁移工具、冲突域检查。
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q \
            tests/test_merge_queue_workflows.py \
            tests/test_aggregate_gate.py \
            tests/test_merge_queue_ruleset.py \
            tests/test_pr_conflict_domains.py \
            tests/test_release_workflow_contract.py
