name: CodeQL

# 从 GitHub 的 default setup 迁过来的（2026-08-19）。迁移的唯一动机是
# **default setup 关不掉单条规则**：它只让你选语言和 query suite，而 py/stack-trace-exposure
# 在 app.py 上一次报 27 条、条条都是刻意为之的设计（理由写在 codeql-config.yml 里）。
# 规则裁剪要落进版本控制、能在 PR 里被评审，而不是散在网页设置和一堆 dismiss 记录里。
#
# 语言与 category 与原 default setup 逐字对齐（actions / javascript-typescript /
# python / rust，category 仍是 `/language:<lang>`），既有 alert 才认得出是同一份分析、
# 不会整批作废重来。threat model 保持默认的 remote，也与原配置一致。
on:
  push:
    branches: [main]
  pull_request:
  # Merge Queue 的资格验证事件（见 docs/ci/merge-queue-rollout.md）：
  # 「CodeQL gate」是 ruleset 收敛后的三个 required contexts 之一，
  # 队列候选的组合提交上它也必须产出结论。
  merge_group:
    types: [checks_requested]
  schedule:
    # 与原 default setup 的 weekly 对齐。定时跑不是摆设：query 包本身在更新，
    # 一行没改的代码明天可能就有新结论。
    - cron: "23 4 * * 1"

# 与 ci.yml 同一条纪律：同一个 PR 上新 push 之后取消旧 SHA 的扫描。
# group 里带 `github.workflow`（与 CI 各占各的槽）+ `github.event_name`
# （PR / merge_group / push / schedule 绝不同组，谁也取消不了谁）；
# cancel-in-progress 只对 pull_request 开——merge_group run 被取消 = 队列
# 候选白等超时，main / schedule 的 run 是唯一扫描记录。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # 上传 SARIF，这个工作流存在的意义
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 四种语言全部走 build-mode: none —— 后端是 Python、前端是 TS、workerd 与
        # 桌面壳的 Rust 都由 CodeQL 直接解析源码。**刻意不 autobuild**：编译 Tauri
        # 那棵依赖树要好几分钟，而它买不到任何额外结论。
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # 稳定 Gate：矩阵四条语言收敛成一个固定名字的结论（判定逻辑与 ci.yml 的
  # 两个 Gate 同一份脚本）。矩阵任一语言 failure / cancelled，`needs.analyze`
  # 的整体结论就不是 success，Gate 红；语言从矩阵里被删掉的那一维由
  # tests/test_merge_queue_workflows.py 静态钉住（needs 在运行时看不见
  # 「本该有第五种语言」）。`if: always()`：上游失败时 Gate 必须跑起来并且红。
  codeql-gate:
    name: CodeQL gate
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 判定器取默认分支 + python -I：与 ci.yml 两个 Gate 同一条纪律
      # （switch-to-gates 之后 Gate 是唯一 required check，判定逻辑不能来自
      # 被判定的那个 revision；-I 挡 stdlib 遮蔽与 PYTHONPATH 注入）
      - name: 取默认分支上的可信判定器
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted-gate"
          DEST="$RUNNER_TEMP/trusted-gate/aggregate_gate.py"
          if gh api "repos/${{ github.repository }}/contents/scripts/ci/aggregate_gate.py?ref=${{ github.event.repository.default_branch }}" \
               --jq .content 2>/dev/null | base64 -d > "$DEST" && [ -s "$DEST" ]; then
            echo "判定器取自默认分支"
          else
            echo "::notice::默认分支上还没有 aggregate_gate.py（bootstrap 空窗）——退回本仓库副本"
            cp scripts/ci/aggregate_gate.py "$DEST"
          fi
      - name: 聚合判定
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I "$RUNNER_TEMP/trusted-gate/aggregate_gate.py" \
            --mode codeql \
            --event "${{ github.event_name }}" \
            --required analyze \
            --needs-json "$NEEDS_JSON"
