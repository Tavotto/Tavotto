name: Lab Qualification

# 实验室 Linux runner 上的**发行资格验证**。它不是「把 PR 的测试再跑一遍」——
# ci.yml 已经把跨平台正确性看住了。这里做的是临时 runner 很难可靠完成的那些：
# 长时 soak、N-1 → N 真升级、golden 视觉回归、固定机器上的性能回归、
# 泄漏检测、以及候选包的 exact-artifact 验收。
#
# ────────────────────────────── 安全模型 ──────────────────────────────
# Tavotto 是**公开仓库**，而 self-hosted runner 是一台长期存在、能读写自己
# 磁盘的真机。所以这里有一条不可协商的边界：
#
#     **绝不接受 pull_request 触发。**
#
# 公开 PR 里的代码是不可信输入；让它在长期 runner 上执行，等于把这台机器
# 交给任何一个能开 PR 的人。「fork 默认拿不到 secrets」不构成安全依据——
# 攻击者要的是这台机器本身，不是仓库的 secret。
#
# 可信来源只有三种，全部只有维护者能触发：
#     push 到 main   —— 代码已经过 review 并合入
#     schedule       —— 跑的是 main 的当前状态
#     workflow_dispatch —— 见下面的 trust-check：任意 ref **必须**先在
#                          GitHub 托管机上验明正身并解析成精确 SHA
#
# release.yml 的 lab_release_gate 复用同一套 job（见该文件），发行链因此
# 不需要在这里重复一遍。
#
# ─────────────────────────── runner 标签与分组 ───────────────────────────
# 当前用标签定向（`tavotto-lab`）。仓库级 runner 没有 runner group 概念，
# 组织若升级到支持 runner group，**强烈建议**改成：
#     runs-on:
#       group: tavotto-trusted
#       labels: [tavotto-lab]
# 并把该 group 限制到 Tavotto/Tavotto 与明确的 trusted workflow。
# 若连这一步都无法可靠限制，备用方案见 docs/ci/self-hosted-runner.md
# 的「更安全的备用形态」一节（private ci-infra 仓库持有 runner）。

on:
  push:
    branches: [main]
  schedule:
    # UTC 19:00 = 北京时间次日 03:00。刻意错开 nightly.yml 的 18:00，
    # 两条链路都会拉满机器，撞一起只会让两边的数字都不可信。
    - cron: "0 19 * * *"
    # 周日 UTC 20:00：weekly deep（mutation 等重活）
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "深度档位"
        required: true
        default: nightly
        type: choice
        options: [main, nightly, release, weekly]
      ref:
        description: "要验的 ref（默认 main）。必须是 main 的祖先或已有 tag"
        required: false
        default: ""
      baseline_tag:
        description: "升级测试的 N-1 tag（留空自动选最近的正式 release）"
        required: false
        default: ""

# 只读。这套 job 只是测试——它不建 Release、不发 PyPI、不推代码。
# 长期 runner 拿到写权限，就等于把仓库写权限也放到了那台机器上。
permissions:
  contents: read

concurrency:
  # 全仓库共用一个槽。benchmark 要稳定、soak 不该与 mutation 抢 CPU、
  # 持久化状态不该并发写、golden baseline 不该被两个 job 同时读写。
  # runner 端另有 flock 作为第二道保险（见 scripts/ci/bootstrap_lab_runner.sh）。
  group: lab-qualification
  cancel-in-progress: false

env:
  # 顶层统一确定性环境。刻意**不**在这里固定中文 locale——
  # 中文相关的覆盖由 corpus 里的 c03_cjk 与升级测试的中文路径承担，
  # 把全局 locale 设成 zh 反而会让别的 case 的输出漂移。
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 信任校验：跑在 **GitHub 托管机** 上，绝不在 self-hosted 上做。
  # 它的产出是一个**精确 SHA**，后面的 job 只认这个 SHA。
  # 为什么不能把 branch name 一路传下去：分支在校验之后仍可能移动，
  # self-hosted 那边再解析一次，拿到的可能已经是另一个 commit 了。
  # ────────────────────────────────────────────────────────────────
  trust-check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      baseline_tag: ${{ steps.resolve.outputs.baseline_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能判断 ancestor 关系

      - name: 解析并校验目标 commit
        id: resolve
        env:
          IN_REF: ${{ inputs.ref }}
          IN_MODE: ${{ inputs.mode }}
          IN_BASELINE: ${{ inputs.baseline_tag }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # 1) 档位：push→main，两条 cron 分别对应 nightly / weekly
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$IN_MODE"
          elif [ "$EVENT" = "push" ]; then
            MODE="main"
          elif [ "$CRON" = "0 20 * * 0" ]; then
            MODE="weekly"
          else
            MODE="nightly"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "baseline_tag=$IN_BASELINE" >> "$GITHUB_OUTPUT"

          # 2) 目标 ref → 精确 SHA
          REF="${IN_REF:-}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_SHA}"
          fi
          if ! SHA="$(git rev-parse --verify "${REF}^{commit}" 2>/dev/null)"; then
            echo "::error::解析不出 commit：$REF"; exit 1
          fi
          echo "目标 ref: $REF → $SHA"

          # 3) 可信判定。两条各自充分：
          #    a. 是 origin/main 的祖先 —— 已经过 review 合入
          #    b. 是某个已有 tag 指向的 commit —— 已发行代码
          git fetch --quiet origin main
          TRUSTED=no
          if git merge-base --is-ancestor "$SHA" origin/main; then
            TRUSTED=yes; WHY="是 origin/main 的祖先"
          else
            for T in $(git tag --points-at "$SHA"); do
              TRUSTED=yes; WHY="由 tag $T 指向"; break
            done
          fi
          if [ "$TRUSTED" != "yes" ]; then
            echo "::error::拒绝在 self-hosted runner 上执行 $SHA："
            echo "::error::它既不是 origin/main 的祖先，也没有任何 tag 指向它。"
            echo "::error::长期 runner 只执行已经过 review 或已发行的代码。"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ 可信：$WHY"
          {
            echo "## Lab Qualification"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 档位 | \`$MODE\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| 信任依据 | $WHY |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────
  # 实验室验证本体
  # ────────────────────────────────────────────────────────────────
  qualify:
    needs: trust-check
    runs-on: [self-hosted, linux, x64, tavotto-lab]
    timeout-minutes: 180
    env:
      LAB_MODE: ${{ needs.trust-check.outputs.mode }}
      TAVOTTO_CI_STATE_ROOT: ${{ vars.LAB_CI_STATE_ROOT || '/srv/tavotto-ci' }}
      LAB_PERF_GATE: ${{ vars.LAB_PERF_GATE || 'false' }}
      LAB_VISUAL_GATE: ${{ vars.LAB_VISUAL_GATE || 'true' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 只认 trust-check 验过的那个 SHA。**不要**改回分支名。
          ref: ${{ needs.trust-check.outputs.sha }}
          clean: true

      - name: 开跑前体检
        run: python3 scripts/ci/lab_preflight.py --mode "$LAB_MODE"

      - name: 清理上一轮残留
        run: python3 scripts/ci/cleanup.py

      - name: 建一次性验证环境
        id: venv
        run: |
          set -euo pipefail
          # 这个 venv 是本次 run 专用的，跑完即弃；它落在持久化根的 tmp/ 下，
          # 由 cleanup.py 按保留期回收。
          VENV="$TAVOTTO_CI_STATE_ROOT/tmp/venv-run-${GITHUB_RUN_ID}"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --disable-pip-version-check --upgrade pip
          "$VENV/bin/pip" install -q -e ".[dev,ci]"
          # **科学栈版本取自 packaging/runtime-lock.json**，不用 `pip install matplotlib`。
          # 视觉基线是像素级的：matplotlib 换个小版本就可能改掉抗锯齿或字体度量，
          # 让整片 corpus 在一次与产品无关的依赖升级里同时变红。用锁文件还有第二个
          # 好处——CI 的渲染环境与桌面版用户拿到的内置 runtime 逐字一致，
          # 基线因此真正代表「用户会看到的那张图」。
          # shellcheck disable=SC2046
          "$VENV/bin/pip" install -q $(python3 scripts/ci/runtime_pins.py --include-corpus)
          echo "python=$VENV/bin/python" >> "$GITHUB_OUTPUT"
          "$VENV/bin/python" -c "import tavotto,matplotlib,numpy,PIL;print('环境就绪', tavotto.__version__)"

      # ── 正确性 ────────────────────────────────────────────────
      - name: 常规测试套件
        run: ${{ steps.venv.outputs.python }} -m pytest -q

      - name: slow / 集成用例
        # pytest.ini 的 addopts 是 `-m "not slow"`，所以必须显式反选。
        # **不接受「一个都没选中」**：那说明标记被误删或改名，而门禁会
        # 安静地报绿——正是这套 CI 要消灭的那种失效。
        run: |
          set -euo pipefail
          # 判据是 pytest 的**退出码**，不是它打给人看的那段文字。
          # 原来数的是 `--collect-only -q` 里有几行含 "::"，而 pytest 9 把这段
          # 输出改成了按文件汇总（`tests/test_bootstrap.py: 1`，一个 "::" 都
          # 没有）——于是 dependabot 那次 8.4.2 → 9.0.3 的升级**静默打断了这道
          # 门禁**，症状还与真实原因毫不相干（报「标记被删」，而标记好好的）。
          # 5 = EXIT_NOTESTSCOLLECTED，4 = 收集出错，都是 pytest 的稳定常量。
          # 注意：文案里绝不能用反引号包 -m slow —— shell 会把它当命令替换执行。
          set +e
          ${{ steps.venv.outputs.python }} -m pytest -m slow --collect-only -q \
              > slow-collect.log 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) echo "'-m slow' 选中了用例" ;;
            5) echo "::error::'-m slow' 一条都没选中。要么标记被删/改名，要么 pytest.ini 的 markers 变了。"
               echo "::error::空转的门禁比没有门禁更坏——它还在报平安。"
               tail -20 slow-collect.log
               exit 1 ;;
            *) echo "::error::收集 '-m slow' 时出错（exit $rc）——原来这里 2>/dev/null 把它整个吞掉了"
               tail -40 slow-collect.log
               exit 1 ;;
          esac
          ${{ steps.venv.outputs.python }} -m pytest -m slow -q

      - name: 前端与 Rust（仅 nightly 及以上）
        if: env.LAB_MODE != 'main'
        run: |
          set -euo pipefail
          cd web && pnpm install --frozen-lockfile && pnpm lint && pnpm i18n:check && pnpm test && pnpm build
          cd ..
          cargo fmt --check --manifest-path workerd/Cargo.toml
          cargo clippy --all-targets --manifest-path workerd/Cargo.toml -- -D warnings
          cargo test --manifest-path workerd/Cargo.toml

      # ── 包验收 ────────────────────────────────────────────────
      # 发行链上验的是 build job 的 **exact artifact**（见 release.yml）。
      # 这里没有那样一份候选包，所以自己造一个——验的是「main 的当前状态
      # 造得出一个装得上、跑得起来的包」。两者问的问题不同，都要有。
      - name: 造一个包用于验收
        id: pkg
        run: |
          set -euo pipefail
          rm -rf dist
          "${{ steps.venv.outputs.python }}" scripts/build_frontend.py
          "${{ steps.venv.outputs.python }}" -m pip install -q build
          "${{ steps.venv.outputs.python }}" -m build --wheel
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          [ "${#WHEELS[@]}" -eq 1 ] || { echo "::error::dist/ 里应有且仅有一个 wheel"; exit 1; }
          echo "wheel=${WHEELS[0]}" >> "$GITHUB_OUTPUT"

      - name: 包验收
        run: "${{ steps.venv.outputs.python }} scripts/ci/lab_acceptance.py --dist dist"

      # ── 升级 ─────────────────────────────────────────────────
      # main 档跳过：它每次 push 都跑，而升级验收要装两个 venv 并完整跑两遍
      # 应用，放进 main 会把「≤ 15~20 分钟」的目标直接冲垮。
      - name: 升级验收 N-1 → 当前
        if: env.LAB_MODE != 'main'
        run: |
          "${{ steps.venv.outputs.python }}" scripts/ci/upgrade_acceptance.py \
            --candidate "${{ steps.pkg.outputs.wheel }}" \
            ${{ inputs.baseline_tag && format('--baseline-tag {0}', inputs.baseline_tag) || '' }}

      # ── golden / 视觉 ─────────────────────────────────────────
      - name: Golden 视觉回归
        id: visual
        continue-on-error: ${{ vars.LAB_VISUAL_GATE == 'false' }}
        run: |
          ${{ steps.venv.outputs.python }} scripts/ci/visual_regression.py \
            --python ${{ steps.venv.outputs.python }} \
            --out "$RUNNER_TEMP/visual"

      # ── 兼容性资格（CompatBench）────────────────────────────────
      # 与 golden 视觉回归**问的不是同一个问题**：那边比「Tavotto 今天 vs
      # 昨天」，这边比「原生 matplotlib vs Tavotto 零 override」，并沿九级
      # 漏斗回答「外部 matplotlib 世界我们兼容多少」。完整说明见
      # docs/ci/matplotlib-compatibility.md。
      #
      # main 档只跑 must+expected 且不跑保真度（保真度要为每个脚本多起一个
      # 进程再渲一遍图，会把「≤ 15~20 分钟」直接冲垮）；nightly 及以上跑全量
      # + 保真度 + 桌面/浏览器语义对拍。门禁档位与运行档位同名。
      - name: Matplotlib 兼容性资格
        id: compat
        run: |
          set -euo pipefail
          case "$LAB_MODE" in
            main)
              ARGS="--tier must,expected --no-fidelity --gate main" ;;
            release)
              ARGS="--all --fidelity --browser --gate release" ;;
            *)
              ARGS="--all --fidelity --browser --gate nightly" ;;
          esac
          # shellcheck disable=SC2086
          ${{ steps.venv.outputs.python }} scripts/ci/compat_matrix.py $ARGS \
            --out "$RUNNER_TEMP/compat" \
            --json "$TAVOTTO_CI_STATE_ROOT/reports/compat.json"

      # 只对**失败 case** 上传重文件（control/tavotto/diff 三张 PNG）。
      # 成功的 100+ case 全量上传会让 artifact 直接撑爆，而它们对排查毫无帮助。
      - name: 兼容性失败诊断
        if: failure() && steps.compat.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compat-diagnostics-${{ needs.trust-check.outputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compat/**
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/compat.json
          retention-days: 14
          if-no-files-found: warn

      # ── soak / 泄漏 ───────────────────────────────────────────
      - name: Soak 与泄漏检测
        run: |
          set -euo pipefail
          case "$LAB_MODE" in
            main)    N=100 ;;
            nightly) N=500 ;;
            release) N=800 ;;
            weekly)  N=800 ;;
          esac
          ${{ steps.venv.outputs.python }} scripts/ci/soak.py \
            --python ${{ steps.venv.outputs.python }} \
            --iterations "$N" --json "$RUNNER_TEMP/soak-metrics.json"

      # ── 性能 ─────────────────────────────────────────────────
      - name: 性能回归
        if: env.LAB_MODE != 'main' || github.event_name == 'push'
        run: |
          ${{ steps.venv.outputs.python }} scripts/ci/benchmark.py \
            --python ${{ steps.venv.outputs.python }} \
            --mode "$LAB_MODE"

      # ── mutation（只在 weekly）──────────────────────────────────
      - name: Mutation testing
        if: env.LAB_MODE == 'weekly'
        continue-on-error: ${{ vars.LAB_MUTATION_GATE != 'true' }}
        run: |
          ${{ steps.venv.outputs.python }} -m pip install -q "mutmut==3.3.1"
          ${{ steps.venv.outputs.python }} scripts/ci/mutation.py \
            --python ${{ steps.venv.outputs.python }}

      # ── 收尾 ─────────────────────────────────────────────────
      - name: 汇总
        if: always()
        run: ${{ steps.venv.outputs.python }} scripts/ci/summarize.py --mode "$LAB_MODE"

      - name: 失败诊断包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-diagnostics-${{ needs.trust-check.outputs.mode }}-${{ github.run_id }}
          # 只收报告与 diff，**不收** venv / node_modules / 整个 checkout：
          # 那些东西几百 MB 起步，而且对排查毫无帮助。
          path: |
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/*.json
            ${{ runner.temp }}/visual/**
            ${{ runner.temp }}/compat/**
            ${{ runner.temp }}/soak-metrics.json
          retention-days: 14
          if-no-files-found: warn

      - name: 长期留存的指标
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-metrics-${{ needs.trust-check.outputs.mode }}-${{ github.run_id }}
          path: |
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/benchmark.json
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/soak.json
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/compat.json
          retention-days: 30
          if-no-files-found: ignore

      - name: 回收一次性环境
        if: always()
        run: rm -rf "$TAVOTTO_CI_STATE_ROOT/tmp/venv-run-${GITHUB_RUN_ID}"
