name: Lab Qualification

# 实验室 Linux runner 上的**发行资格验证**。它不是「把 PR 的测试再跑一遍」——
# ci.yml 已经把跨平台正确性看住了。这里做的是临时 runner 很难可靠完成的那些：
# 长时 soak、N-1 → N 真升级、golden 视觉回归、固定机器上的性能回归、
# 泄漏检测、以及候选包的 exact-artifact 验收。
#
# ────────────────────────────── 安全模型 ──────────────────────────────
# Tavotto 是**公开仓库**，而 self-hosted runner 是一台长期存在、能读写自己
# 磁盘的真机。所以这里有一条不可协商的边界：
#
#     **绝不接受 pull_request 触发。**
#
# 公开 PR 里的代码是不可信输入；让它在长期 runner 上执行，等于把这台机器
# 交给任何一个能开 PR 的人。「fork 默认拿不到 secrets」不构成安全依据——
# 攻击者要的是这台机器本身，不是仓库的 secret。
#
# 可信来源只有三种，全部只有维护者能触发：
#     push 到 main   —— 代码已经过 review 并合入
#     schedule       —— 跑的是 main 的当前状态
#     workflow_dispatch —— 见下面的 trust-check：任意 ref **必须**先在
#                          GitHub 托管机上验明正身并解析成精确 SHA
#
# release.yml 的 lab_release_gate 复用同一套 job（见该文件），发行链因此
# 不需要在这里重复一遍。
#
# ─────────────────────────── runner 标签与分组 ───────────────────────────
# 当前用标签定向（`tavotto-lab`）。仓库级 runner 没有 runner group 概念，
# 组织若升级到支持 runner group，**强烈建议**改成：
#     runs-on:
#       group: tavotto-trusted
#       labels: [tavotto-lab]
# 并把该 group 限制到 Tavotto/Tavotto 与明确的 trusted workflow。
# 若连这一步都无法可靠限制，备用方案见 docs/ci/self-hosted-runner.md
# 的「更安全的备用形态」一节（private ci-infra 仓库持有 runner）。

on:
  push:
    branches: [main]
  schedule:
    # UTC 19:00 = 北京时间次日 03:00。刻意错开 nightly.yml 的 18:00，
    # 两条链路都会拉满机器，撞一起只会让两边的数字都不可信。
    - cron: "0 19 * * *"
    # 周日 UTC 20:00：weekly deep（mutation 等重活）
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "深度档位"
        required: true
        default: nightly
        type: choice
        options: [main, nightly, release, weekly]
      ref:
        description: "要验的 ref（默认 main）。必须是 main 的祖先或已有 tag"
        required: false
        default: ""
      baseline_tag:
        description: "升级测试的 N-1 tag（留空自动选最近的正式 release）"
        required: false
        default: ""

# 只读。这套 job 只是测试——它不建 Release、不发 PyPI、不推代码。
# 长期 runner 拿到写权限，就等于把仓库写权限也放到了那台机器上。
permissions:
  contents: read

concurrency:
  # 全仓库共用一个槽。benchmark 要稳定、soak 不该与 mutation 抢 CPU、
  # 持久化状态不该并发写、golden baseline 不该被两个 job 同时读写。
  # runner 端另有 flock 作为第二道保险（见 scripts/ci/bootstrap_lab_runner.sh）。
  group: lab-qualification
  cancel-in-progress: false

env:
  # 顶层统一确定性环境。刻意**不**在这里固定中文 locale——
  # 中文相关的覆盖由 corpus 里的 c03_cjk 与升级测试的中文路径承担，
  # 把全局 locale 设成 zh 反而会让别的 case 的输出漂移。
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  # ────────────────────────────────────────────────────────────────
  # 信任校验：跑在 **GitHub 托管机** 上，绝不在 self-hosted 上做。
  # 它的产出是一个**精确 SHA**，后面的 job 只认这个 SHA。
  # 为什么不能把 branch name 一路传下去：分支在校验之后仍可能移动，
  # self-hosted 那边再解析一次，拿到的可能已经是另一个 commit 了。
  # ────────────────────────────────────────────────────────────────
  trust-check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      baseline_tag: ${{ steps.resolve.outputs.baseline_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能判断 ancestor 关系

      - name: 解析并校验目标 commit
        id: resolve
        env:
          IN_REF: ${{ inputs.ref }}
          IN_MODE: ${{ inputs.mode }}
          IN_BASELINE: ${{ inputs.baseline_tag }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # 1) 档位：push→main，两条 cron 分别对应 nightly / weekly
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$IN_MODE"
          elif [ "$EVENT" = "push" ]; then
            MODE="main"
          elif [ "$CRON" = "0 20 * * 0" ]; then
            MODE="weekly"
          else
            MODE="nightly"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "baseline_tag=$IN_BASELINE" >> "$GITHUB_OUTPUT"

          # 2) 目标 ref → 精确 SHA
          REF="${IN_REF:-}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_SHA}"
          fi
          if ! SHA="$(git rev-parse --verify "${REF}^{commit}" 2>/dev/null)"; then
            echo "::error::解析不出 commit：$REF"; exit 1
          fi
          echo "目标 ref: $REF → $SHA"

          # 3) 可信判定。两条各自充分：
          #    a. 是 origin/main 的祖先 —— 已经过 review 合入
          #    b. 是某个已有 tag 指向的 commit —— 已发行代码
          git fetch --quiet origin main
          TRUSTED=no
          if git merge-base --is-ancestor "$SHA" origin/main; then
            TRUSTED=yes; WHY="是 origin/main 的祖先"
          else
            for T in $(git tag --points-at "$SHA"); do
              TRUSTED=yes; WHY="由 tag $T 指向"; break
            done
          fi
          if [ "$TRUSTED" != "yes" ]; then
            echo "::error::拒绝在 self-hosted runner 上执行 $SHA："
            echo "::error::它既不是 origin/main 的祖先，也没有任何 tag 指向它。"
            echo "::error::长期 runner 只执行已经过 review 或已发行的代码。"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ 可信：$WHY"
          {
            echo "## Lab Qualification"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 档位 | \`$MODE\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| 信任依据 | $WHY |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────
  # 实验室验证本体
  # ────────────────────────────────────────────────────────────────
  # **步骤定义在 `_lab-qualification.yml`——唯一一份。**
  # 从前这里与 release.yml 的 `lab_release_gate` 是两份手抄的 shell，
  # 逐条重复。#61 修一个 bug 必须同时改两处，而两处的差别实测只有
  # 「`$LAB_MODE` vs 字面量 release」和一处换行：它们本来就是同一段逻辑。
  # 抄两遍的代价不是多打字，是**总有一天只改了一处**。
  qualify:
    needs: trust-check
    uses: ./.github/workflows/_lab-qualification.yml
    with:
      mode: ${{ needs.trust-check.outputs.mode }}
      sha: ${{ needs.trust-check.outputs.sha }}
      baseline_tag: ${{ inputs.baseline_tag || '' }}
      use_prebuilt_dist: false
    secrets: inherit
