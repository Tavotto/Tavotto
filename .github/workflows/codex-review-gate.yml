name: Codex Review Gate

# 这道门禁**不评审代码**，它只看 Codex 已经留下的 review thread 有没有被处置。
#
# 判据全文 docs/engineering/codex-review-policy.md §2，一句话版本：
#   unresolved P0/P1 → 红；unresolved P2 → 黄；轮次 > 2 → 黄；
#   Codex 没跑（usage limit / App 掉线 / 纯文档 PR）→ **不红**。
#
# 最后一条是设计的核心：一道会因为外部服务不在线而永久卡住 PR 的门禁，
# 第一次卡住就会被人摘掉，摘掉之后就再也没人跑了。
#
# **它不会自动请求 review**，也不 resolve 任何 thread——那两件事都会重新
# 造出它要消灭的循环（每 push 一次触发一轮，188 条发现里 80% 是 P2）。

on:
  # **最要紧的一个触发时刻：有人（包括 Codex）提交了 review 之后。**
  # 少了它这道门禁就是空转：点 Ready 会同时启动本工作流与 Codex 的第一轮，
  # 而本工作流只查一次 API、几秒就跑完 —— 那时 Codex 还没提交任何东西，
  # `codex_ran` 是 false，门禁按设计回 neutral 并退出 0。
  # 于是它**永远不会真正检查任何一条发现**，而且全绿。
  # （Codex 在 #64 的第一轮上指出了这一点 —— 一道检查 review 的门禁，
  #   自己栽在「跑得比被检查的东西还早」上。）
  pull_request_review:
    types: [submitted, dismissed]
  # **回复一条 thread 也要重跑**：写 disposition 是收敛动作，
  # 而收敛之后正是最需要重新判一次的时刻。
  pull_request_review_comment:
    types: [created, edited]
  pull_request:
    # 开、转 Ready、改标题/正文（可能补了 disposition）、重开、push。
    #
    # **`synchronize` 从「刻意排除」改成必须有**（Codex 在 #64 第 5 轮
    # 指出来的，是对的）：修一条阻断发现的正常流程是「push 修复 → 回复
    # thread → resolve」，而这三件事从前一件都不触发本工作流——
    # `synchronize` 被排除、回复发的是 `pull_request_review_comment`、
    # **resolve 一条 thread GitHub 根本不发任何事件**。于是 Codex 提交
    # review 那一刻产生的那次失败会**永远挂在 PR 上**，哪怕每条 P0/P1
    # 都已经处置完毕。一旦把 `gate` 登记成必需检查，那就是死锁。
    #
    # 排除它原本是为了少刷几条「轮次超了」的告警——那是**告警不是失败**，
    # 拿一道永远绿不了的门禁去换它，这笔账反过来了。
    types: [opened, ready_for_review, edited, reopened, synchronize]
  # **残留限制，如实记在这里**：GitHub 不为「resolve 一条 thread」发送
  # 任何事件。所以「最后一步只 resolve、既不 push 也不回复」时，这道门禁
  # 的结论会停在上一次。补救有两条，都不需要改配置：
  #   ① Checks 页点 Re-run —— 门禁按**运行时**现查 API，不读事件载荷，
  #      所以重跑一次拿到的就是最新状态；
  #   ② 把 resolve 放在最后一次 push / 回复**之前**。
  # 收敛完想再确认一次：在 PR 页面手动跑，或者本地
  # `python3 scripts/ci/codex_review_gate.py --pr <n>`。
  workflow_dispatch:
    inputs:
      pr:
        description: "PR 号"
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 1 }

      - name: 检查 review thread 的处置情况
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        # **用 runner 自带的 python3，不建 venv。** 这个脚本是纯标准库的，
        # 而一道诊断门禁最不该做的事就是把自己的成败押在一次 pip install 上
        # （#61 的教训：汇总步骤恰恰在有失败要汇总时自己挂掉）。
        run: python3 scripts/ci/codex_review_gate.py --pr "$PR"
