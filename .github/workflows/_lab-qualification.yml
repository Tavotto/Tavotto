name: Lab Qualification (reusable)

# **发行资格验证的唯一定义。** `lab-ci.yml`（push/schedule）与 `release.yml`
# （发布链）都调这一个文件，`mode` 只决定阈值、基线和跑哪几档，**不复制步骤**。
#
# 为什么非收敛不可：从前这套步骤在两个文件里各有一份手抄。#61 修一个 bug
# （汇总步骤在有失败要汇总时自己挂掉）必须**同时改两处**，而那两处的差别
# 实测只有「`$LAB_MODE` vs 字面量 release」和一处换行——也就是说，它们本来
# 就是同一段逻辑，只是被抄了两遍。抄两遍的代价不是多打字，是**总有一天
# 只改了一处**，而两条链会因此给出不同的结论。
#
# mode 的四档：
#   main     push 到 main 后的基本资格（不跑 mutation / 前端 / Rust）
#   nightly  加前端与 Rust、mutation testing
#   weekly   nightly 的超集（更长的 soak）
#   release  发行档：**验的是调用方传进来的那一份产物**，不自己造包；
#            CompatBench 走 `--gate release`（连基线里已知的 product_bug
#            都不放过）；性能回归**不写基线**（候选版不该改基线）
#
# 这个 workflow 跑在 self-hosted 的实验室 runner 上，且**不需要任何写权限**：
# 长期 runner 拿不到 id-token / contents:write，也就拿不到 PyPI 与 Release
# 的任何签发能力。

on:
  workflow_call:
    inputs:
      mode:
        description: "main | nightly | weekly | release"
        required: true
        type: string
      sha:
        description: "已经由调用方验过可达 main 的精确 commit SHA"
        required: true
        type: string
      baseline_tag:
        description: "升级验收的 N-1 tag（留空自动选最近的正式 release）"
        required: false
        default: ""
        type: string
      use_prebuilt_dist:
        description: >-
          true 时不自己造包，改用调用方上传的 `dist` artifact——
          发行档验的必须是**将要发出去的那一份 wheel**，
          不是「同一个 commit 重新造一个差不多的东西」。
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TAVOTTO_NO_TELEMETRY: "1"

jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, tavotto-lab]
    timeout-minutes: 180
    concurrency:
      # **每条调用链一个槽，两条链绝不共用。**
      # `github.workflow` 在可复用 workflow 里取的是**调用方**的名字，
      # 所以 release.yml 与 lab-ci.yml 各排各的队。
      #
      # 为什么不能共用一个槽：GitHub 每组只保留**一个运行中 + 一个待定**，
      # 第三个排进来会**取代那个待定的**——`cancel-in-progress: false`
      # 只保护正在跑的，保护不了在排队的。共用一个槽时，发布门禁正等在
      # 一次长 lab run 后面，这时一次 push to main 或定时任务进来，
      # **日常 run 会把待定的发布门禁挤掉，发版当场中止**。
      #
      # 机器独占不靠这个槽：带 `tavotto-lab` 标签的 runner 只有一台，
      # 两条链天然排队；runner 端另有 flock 作第二道保险
      # （见 scripts/ci/bootstrap_lab_runner.sh）。槽在这里只负责
      # **同一条链内部去重**——同一条链上新的一次本来就该取代旧的待定。
      group: lab-qualification-${{ github.workflow }}
      cancel-in-progress: false
    env:
      LAB_MODE: ${{ inputs.mode }}
      TAVOTTO_CI_STATE_ROOT: ${{ vars.LAB_CI_STATE_ROOT || '/srv/tavotto-ci' }}
      LAB_PERF_GATE: ${{ vars.LAB_PERF_GATE || 'false' }}
      LAB_VISUAL_GATE: ${{ vars.LAB_VISUAL_GATE || 'true' }}
      GITHUB_TOKEN: ${{ github.token }}
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 只认 trust-check 验过的那个 SHA。**不要**改回分支名。
          ref: ${{ inputs.sha }}
          clean: true

      - name: 开跑前体检
        # `--reap-stale`：发现归属本 CI 的遗留 Tavotto 进程就自己清掉，
        # **并复检确认真的清干净了**（清不掉照旧阻断）。
        # 从前没有这一档，于是 2026-08-22 05:55 起**每一次** lab run 都被同一个
        # 手工探测留下的进程挡在门外——而唯一的解法是有人 SSH 上去手动清。
        # `cleanup.py`（会 kill）排在体检**之后**，体检失败它就永远轮不到：
        # **自愈动作排在检测它的那道门之后，等于没有自愈。**
        run: python3 scripts/ci/lab_preflight.py --mode "$LAB_MODE" --reap-stale

      - name: 清理上一轮残留
        run: python3 scripts/ci/cleanup.py

      - name: 建一次性验证环境
        id: venv
        run: |
          set -euo pipefail
          # 这个 venv 是本次 run 专用的，跑完即弃；它落在持久化根的 tmp/ 下，
          # 由 cleanup.py 按保留期回收。
          VENV="$TAVOTTO_CI_STATE_ROOT/tmp/venv-run-${GITHUB_RUN_ID}"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --disable-pip-version-check --upgrade pip
          "$VENV/bin/pip" install -q -e ".[dev,ci]"
          # **科学栈版本取自 packaging/runtime-lock.json**，不用 `pip install matplotlib`。
          # 视觉基线是像素级的：matplotlib 换个小版本就可能改掉抗锯齿或字体度量，
          # 让整片 corpus 在一次与产品无关的依赖升级里同时变红。用锁文件还有第二个
          # 好处——CI 的渲染环境与桌面版用户拿到的内置 runtime 逐字一致，
          # 基线因此真正代表「用户会看到的那张图」。
          # shellcheck disable=SC2046
          "$VENV/bin/pip" install -q $(python3 scripts/ci/runtime_pins.py --include-corpus)
          echo "python=$VENV/bin/python" >> "$GITHUB_OUTPUT"
          "$VENV/bin/python" -c "import tavotto,matplotlib,numpy,PIL;print('环境就绪', tavotto.__version__)"

      # ── 正确性 ────────────────────────────────────────────────
      - name: 常规测试套件
        run: ${{ steps.venv.outputs.python }} -m pytest -q

      - name: slow / 集成用例
        # pytest.ini 的 addopts 是 `-m "not slow"`，所以必须显式反选。
        # **不接受「一个都没选中」**：那说明标记被误删或改名，而门禁会
        # 安静地报绿——正是这套 CI 要消灭的那种失效。
        run: |
          set -euo pipefail
          # 判据是 pytest 的**退出码**，不是它打给人看的那段文字。
          # 原来数的是 `--collect-only -q` 里有几行含 "::"，而 pytest 9 把这段
          # 输出改成了按文件汇总（`tests/test_bootstrap.py: 1`，一个 "::" 都
          # 没有）——于是 dependabot 那次 8.4.2 → 9.0.3 的升级**静默打断了这道
          # 门禁**，症状还与真实原因毫不相干（报「标记被删」，而标记好好的）。
          # 5 = EXIT_NOTESTSCOLLECTED，4 = 收集出错，都是 pytest 的稳定常量。
          # 注意：文案里绝不能用反引号包 -m slow —— shell 会把它当命令替换执行。
          set +e
          ${{ steps.venv.outputs.python }} -m pytest -m slow --collect-only -q \
              > slow-collect.log 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) echo "'-m slow' 选中了用例" ;;
            5) echo "::error::'-m slow' 一条都没选中。要么标记被删/改名，要么 pytest.ini 的 markers 变了。"
               echo "::error::空转的门禁比没有门禁更坏——它还在报平安。"
               tail -20 slow-collect.log
               exit 1 ;;
            *) echo "::error::收集 '-m slow' 时出错（exit $rc）——原来这里 2>/dev/null 把它整个吞掉了"
               tail -40 slow-collect.log
               exit 1 ;;
          esac
          # `pytest.ini` 开着 `faulthandler_exit_on_timeout`（用例卡满 300 秒就
          # dump 完退出，别挂满 job 上限）。**这一档必须关掉**：这些用例真建 venv、
          # 真联网装 matplotlib，单条超过 300 秒完全正常，不关就是一次慢的
          # pip install 把整个资格跑硬杀成假红。这是那条开关唯一的例外。
          ${{ steps.venv.outputs.python }} -m pytest -m slow -q \
              -o faulthandler_exit_on_timeout=false

      - name: 前端与 Rust（仅 nightly 及以上）
        if: env.LAB_MODE != 'main'
        run: |
          set -euo pipefail
          cd web && pnpm install --frozen-lockfile && pnpm lint && pnpm i18n:check && pnpm test && pnpm build
          cd ..
          cargo fmt --check --manifest-path workerd/Cargo.toml
          cargo clippy --all-targets --manifest-path workerd/Cargo.toml -- -D warnings
          cargo test --manifest-path workerd/Cargo.toml

      # ── 包验收 ────────────────────────────────────────────────
      # **发行档验的是调用方传进来的那一份 exact artifact**，不自己造包：
      # 「同一个 commit 重新造一个差不多的东西」证明不了将要发出去的那份能用。
      # 其余档位没有候选包，所以自己造一个——验的是「main 的当前状态造得出
      # 一个装得上、跑得起来的包」。两者问的问题不同，都要有。
      - name: 取回候选产物（发行档）
        if: inputs.use_prebuilt_dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist }

      - name: 认领候选 wheel（发行档）
        if: inputs.use_prebuilt_dist
        id: candidate
        run: |
          set -euo pipefail
          # 用 glob 而不是 ls|grep：文件名里出现空格或非 ASCII 时 ls 的输出
          # 没法安全地按行切。
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          [ "${#WHEELS[@]}" -eq 1 ] || {
            echo "::error::dist/ 里应有且仅有一个 wheel，实际 ${#WHEELS[@]} 个"; exit 1; }
          echo "wheel=${WHEELS[0]}" >> "$GITHUB_OUTPUT"

      - name: 造一个包用于验收（非发行档）
        if: ${{ !inputs.use_prebuilt_dist }}
        id: pkg
        run: |
          set -euo pipefail
          rm -rf dist
          "${{ steps.venv.outputs.python }}" scripts/build_frontend.py
          "${{ steps.venv.outputs.python }}" -m pip install -q build
          "${{ steps.venv.outputs.python }}" -m build --wheel
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          [ "${#WHEELS[@]}" -eq 1 ] || { echo "::error::dist/ 里应有且仅有一个 wheel"; exit 1; }
          echo "wheel=${WHEELS[0]}" >> "$GITHUB_OUTPUT"

      - name: 包验收
        run: "${{ steps.venv.outputs.python }} scripts/ci/lab_acceptance.py --dist dist"

      # ── 升级 ─────────────────────────────────────────────────
      # main 档跳过：它每次 push 都跑，而升级验收要装两个 venv 并完整跑两遍
      # 应用，放进 main 会把「≤ 15~20 分钟」的目标直接冲垮。
      - name: 升级验收 N-1 → 当前
        if: env.LAB_MODE != 'main'
        env:
          # 候选 wheel 的来源只有两条，取决于上面走了哪一支。**不许在这里
          # 再 glob 一次 dist/**：那会变成第三个「自己猜文件名」的地方。
          CANDIDATE: ${{ inputs.use_prebuilt_dist
                         && steps.candidate.outputs.wheel
                         || steps.pkg.outputs.wheel }}
        run: |
          set -euo pipefail
          [ -n "$CANDIDATE" ] || { echo "::error::拿不到候选 wheel 的路径"; exit 1; }
          "${{ steps.venv.outputs.python }}" scripts/ci/upgrade_acceptance.py \
            --candidate "$CANDIDATE" \
            ${{ inputs.baseline_tag && format('--baseline-tag {0}', inputs.baseline_tag) || '' }}

      # ── golden / 视觉 ─────────────────────────────────────────
      - name: Golden 视觉回归
        id: visual
        # **`LAB_VISUAL_GATE` 只对非 release 档生效。**
        # 它是仓库级变量，本意是让日常 lab run 在基线漂移期间不被视觉回归
        # 挡住。合并两份资格定义之前，release 门禁的 Golden 步骤**永远是
        # 阻断的**——合并之后这个仓库级开关就能顺手把发布门禁一起放倒，
        # 而放倒它的人多半只是想让 nightly 别再刷红。
        # 一个仓库设置不该有能力削弱发布门禁：mode == 'release' 时它无效。
        continue-on-error: ${{ inputs.mode != 'release' && vars.LAB_VISUAL_GATE == 'false' }}
        run: |
          ${{ steps.venv.outputs.python }} scripts/ci/visual_regression.py \
            --python ${{ steps.venv.outputs.python }} \
            --out "$RUNNER_TEMP/visual"

      # ── 兼容性资格（CompatBench）────────────────────────────────
      # 与 golden 视觉回归**问的不是同一个问题**：那边比「Tavotto 今天 vs
      # 昨天」，这边比「原生 matplotlib vs Tavotto 零 override」，并沿九级
      # 漏斗回答「外部 matplotlib 世界我们兼容多少」。完整说明见
      # docs/ci/matplotlib-compatibility.md。
      #
      # main 档只跑 must+expected 且不跑保真度（保真度要为每个脚本多起一个
      # 进程再渲一遍图，会把「≤ 15~20 分钟」直接冲垮）；nightly 及以上跑全量
      # + 保真度 + 桌面/浏览器语义对拍。门禁档位与运行档位同名。
      - name: Matplotlib 兼容性资格
        id: compat
        run: |
          set -euo pipefail
          case "$LAB_MODE" in
            main)
              ARGS="--tier must,expected --no-fidelity --gate main" ;;
            release)
              ARGS="--all --fidelity --browser --gate release" ;;
            *)
              ARGS="--all --fidelity --browser --gate nightly" ;;
          esac
          # **`--python` 要显式给。** 不给的话 `compat_matrix._worker_python(None)`
          # 会走 pool 的解释器优先级链——而这台 runner 是**持久**的：
          # `TAVOTTO_WORKER_PYTHON` 或用户设置里存下来的解释器一旦存在，
          # CompatBench 就会拿它去跑，而不是拿这一轮刚建好、按 runtime-lock
          # 钉过版本的那个 venv。那时像素基线比的是另一套 matplotlib，
          # 而报告不会说 —— 与「借一个解释器」把冒烟变成空转是同一个形状。
          # shellcheck disable=SC2086
          ${{ steps.venv.outputs.python }} scripts/ci/compat_matrix.py $ARGS \
            --python ${{ steps.venv.outputs.python }} \
            --out "$RUNNER_TEMP/compat" \
            --json "$TAVOTTO_CI_STATE_ROOT/reports/compat.json"

      # 只对**失败 case** 上传重文件（control/tavotto/diff 三张 PNG）。
      # 成功的 100+ case 全量上传会让 artifact 直接撑爆，而它们对排查毫无帮助。
      - name: 兼容性失败诊断
        if: failure() && steps.compat.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compat-diagnostics-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compat/**
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/compat.json
          retention-days: 14
          if-no-files-found: warn

      # ── soak / 泄漏 ───────────────────────────────────────────
      - name: Soak 与泄漏检测
        run: |
          set -euo pipefail
          case "$LAB_MODE" in
            main)    N=100 ;;
            nightly) N=500 ;;
            release) N=800 ;;
            weekly)  N=800 ;;
          esac
          ${{ steps.venv.outputs.python }} scripts/ci/soak.py \
            --python ${{ steps.venv.outputs.python }} \
            --iterations "$N" --json "$RUNNER_TEMP/soak-metrics.json"

      # ── 性能 ─────────────────────────────────────────────────
      - name: 性能回归
        if: env.LAB_MODE != 'main' || github.event_name == 'push'
        run: |
          # **发行档不写基线**：候选版把基线覆盖掉的话，「和基线比」就变成了
          # 「和自己比」，永远不会红。
          ${{ steps.venv.outputs.python }} scripts/ci/benchmark.py \
            --python ${{ steps.venv.outputs.python }} \
            --mode "$LAB_MODE" \
            ${{ inputs.mode == 'release' && '--no-update' || '' }}

      # ── mutation（只在 weekly）──────────────────────────────────
      - name: Mutation testing
        if: env.LAB_MODE == 'weekly'
        continue-on-error: ${{ vars.LAB_MUTATION_GATE != 'true' }}
        run: |
          ${{ steps.venv.outputs.python }} -m pip install -q "mutmut==3.3.1"
          ${{ steps.venv.outputs.python }} scripts/ci/mutation.py \
            --python ${{ steps.venv.outputs.python }}

      # ── 收尾 ─────────────────────────────────────────────────
      - name: 汇总
        if: always()
        # **解释器要有兜底。** 这一步是 `always()`，可它取的
        # `steps.venv.outputs.python` 来自「建验证环境」——体检先失败时那一步
        # 根本没跑，变量是空的，命令退化成直接执行脚本，而它是 100644（没有
        # 执行位）→ `Permission denied`，退出码 126。
        # 于是**这个「总是要跑」的汇总，恰恰在真的有失败要汇总时自己挂掉**
        # ——2026-08-22 v0.9.1 发版时实测：体检报出遗留进程，而汇总没能把这条
        # 结论写进 job summary，读的人只看到一个 126。
        run: ${{ steps.venv.outputs.python || 'python3' }} scripts/ci/summarize.py --mode "$LAB_MODE"

      - name: 失败诊断包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-diagnostics-${{ inputs.mode }}-${{ github.run_id }}
          # 只收报告与 diff，**不收** venv / node_modules / 整个 checkout：
          # 那些东西几百 MB 起步，而且对排查毫无帮助。
          path: |
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/*.json
            ${{ runner.temp }}/visual/**
            ${{ runner.temp }}/compat/**
            ${{ runner.temp }}/soak-metrics.json
          retention-days: 14
          if-no-files-found: warn

      - name: 长期留存的指标
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-metrics-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/benchmark.json
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/soak.json
            ${{ env.TAVOTTO_CI_STATE_ROOT }}/reports/compat.json
          retention-days: 30
          if-no-files-found: ignore

      - name: 回收一次性环境
        if: always()
        run: rm -rf "$TAVOTTO_CI_STATE_ROOT/tmp/venv-run-${GITHUB_RUN_ID}"

