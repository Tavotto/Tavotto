name: plugin-stable

# ═══════════════════════════════════════════════════════════════════════════
# 发行分支 `plugin-stable` 的**手动**执行入口（ADR 0043）：bootstrap / 幂等重试 /
# 回退，全部从 **GitHub Release 上已经发出去的插件产物**取内容——不从任何开发
# checkout 拿「看起来最新」的文件，也不在这里构建任何东西。
#
#   plan       只读：把将要做的事与远端现状打印出来，一个写请求都不发。
#   bootstrap  分支不存在时首次创建。新版 Release 用 dist/ 里那份带随包清单的 zip；
#              旧版 Release（v0.12.0 及以前，zip 里没有 plugin-build.json）走 legacy：
#              包内字节原样保留，外部校验和取 GitHub 的 asset digest，收据放在分支根。
#   promote    正常推进（release.yml 发布成功但这一步失败时的幂等重试入口）。
#   rollback   显式回退到分支上一个已验证的旧提交：要授权人、理由、期望的当前 ref。
#
# 每一步先核对 Release 资产的 sha256（SHA256SUMS.txt 或 asset digest），再解包验证，
# 最后才把 `--yes` 交给发布器。没有勾 confirm 就是演练。
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | bootstrap | promote | rollback"
        required: true
        default: plan
        type: choice
        options: [plan, bootstrap, promote, rollback]
      release_tag:
        description: "从哪个已发布的 Release 取插件（如 v0.12.0）。rollback 不用"
        required: false
        default: ""
      expected_remote_sha:
        description: "promote / rollback 必填：你此刻看到的 plugin-stable 远端 SHA"
        required: false
        default: ""
      rollback_to:
        description: "rollback：回退到分支上的哪个提交（完整 SHA）"
        required: false
        default: ""
      reason:
        description: "rollback 的理由 / 跳过引擎检查的理由（进收据）"
        required: false
        default: ""
      engine_check:
        description: "github-release,pypi（默认）或 none（必须给 reason）"
        required: false
        default: "github-release,pypi"
      confirm:
        description: "真的推送。不勾 = 演练（bootstrap / promote / rollback 都只打印计划）"
        required: false
        default: false
        type: boolean

# 只有这一个 job，只有它拿 contents: write。它不执行插件包里的任何代码。
permissions:
  contents: read

concurrency:
  group: plugin-stable-publish
  cancel-in-progress: false

env:
  TAVOTTO_NO_TELEMETRY: "1"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }

      - name: 取 Release 上的插件产物并核对外部校验和
        if: inputs.mode != 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::plan / bootstrap / promote 需要 release_tag"; exit 1; }
          VER="${TAG#v}"
          mkdir -p assets
          gh release download "$TAG" --dir assets --pattern "codex-plugin-${VER}.zip"
          gh release download "$TAG" --dir assets --pattern "SHA256SUMS.txt" || true
          gh release download "$TAG" --dir assets --pattern "codex-plugin-build.json" || true
          ZIP="assets/codex-plugin-${VER}.zip"
          GOT="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          # 外部校验和：新版在 SHA256SUMS.txt 里；旧版（zip 在 out/ 下没进 SUMS）用
          # GitHub 自己算的 asset digest。两处都没有就不接受——旧发行件必须先有外部校验和。
          WANT=""
          if [ -f assets/SHA256SUMS.txt ] && grep -q "codex-plugin-${VER}.zip" assets/SHA256SUMS.txt; then
            WANT="$(grep "codex-plugin-${VER}.zip" assets/SHA256SUMS.txt | cut -d' ' -f1)"
            echo "校验和来源：SHA256SUMS.txt"
          else
            WANT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name==\"codex-plugin-${VER}.zip\") | .digest" | sed 's/^sha256://')"
            echo "校验和来源：GitHub asset digest"
          fi
          [ -n "$WANT" ] || { echo "::error::Release $TAG 上找不到 codex-plugin-${VER}.zip 的外部校验和"; exit 1; }
          [ "$GOT" = "$WANT" ] || { echo "::error::sha256 不符：下载到 $GOT，Release 记录 $WANT"; exit 1; }
          URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name==\"codex-plugin-${VER}.zip\") | .browser_download_url")"
          {
            echo "ZIP=$ZIP"; echo "ZIP_SHA256=$GOT"; echo "ZIP_URL=$URL"; echo "VER=$VER"
            if [ -f assets/codex-plugin-build.json ]; then echo "LEGACY=0"; else echo "LEGACY=1"; fi
          } >> "$GITHUB_ENV"

      - name: 解包并验证（新版按随包清单；旧版按 legacy 规则）
        if: inputs.mode != 'rollback'
        run: |
          set -euo pipefail
          STAGE="$(python3 scripts/plugin_stage.py unpack "$ZIP" --out "$RUNNER_TEMP/stable")"
          if [ "$LEGACY" = "1" ]; then
            python3 scripts/plugin_stage.py verify "$STAGE" --legacy
          else
            SRC="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['source_sha'])" assets/codex-plugin-build.json)"
            DIGEST="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['content_digest'])" assets/codex-plugin-build.json)"
            python3 scripts/plugin_stage.py verify "$STAGE" --source-sha "$SRC" --version "$VER" --content-digest "$DIGEST"
            echo "SOURCE_SHA=$SRC" >> "$GITHUB_ENV"
          fi
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: 给发布器的 git 配本仓库的推送凭据（只在真推时）
        # 发布器在自己的临时仓库里 push，看不见 actions/checkout 写进 checkout 本地
        # config 的凭据——首次真跑（run 33979476158）就死在 `could not read Username`，
        # 读回正确报了 not_landed（退出码 4）。形态与 actions/checkout 一致：只对
        # github.com 生效的 extraheader，不进任何 URL、不进收据。演练不需要它。
        if: inputs.confirm == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $AUTH"

      - name: 发布器
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.release_tag }}
          EXPECTED: ${{ inputs.expected_remote_sha }}
          TO: ${{ inputs.rollback_to }}
          REASON: ${{ inputs.reason }}
          ENGINE_CHECK: ${{ inputs.engine_check }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          P="python3 scripts/plugin_publish.py"
          YES=""; [ "$CONFIRM" = "true" ] && YES="--yes"
          AUDIT=(--audit "workflow=plugin-stable" --audit "run_id=$RUN_ID" --audit "actor=$ACTOR")
          case "$MODE" in
            plan)
              if [ "$LEGACY" = "1" ]; then
                $P plan --legacy-zip "$ZIP" --legacy-sha256 "$ZIP_SHA256" --legacy-asset-url "$ZIP_URL" \
                  --release-tag "$TAG" --engine-check "${ENGINE_CHECK:-github-release,pypi}" \
                  ${REASON:+--reason "$REASON"} "${AUDIT[@]}" --receipt-out "$RUNNER_TEMP/receipt.json"
              else
                $P plan --staging "$STAGE" --source-sha "$SOURCE_SHA" --release-tag "$TAG" \
                  --engine-check "${ENGINE_CHECK:-github-release,pypi}" ${REASON:+--reason "$REASON"} \
                  "${AUDIT[@]}" --receipt-out "$RUNNER_TEMP/receipt.json"
              fi ;;
            bootstrap)
              if [ "$LEGACY" = "1" ]; then
                $P bootstrap --legacy-zip "$ZIP" --legacy-sha256 "$ZIP_SHA256" --legacy-asset-url "$ZIP_URL" \
                  --release-tag "$TAG" --engine-check "${ENGINE_CHECK:-github-release,pypi}" \
                  ${REASON:+--reason "$REASON"} "${AUDIT[@]}" --receipt-out "$RUNNER_TEMP/receipt.json" $YES
              else
                $P bootstrap --staging "$STAGE" --source-sha "$SOURCE_SHA" --release-tag "$TAG" \
                  --engine-check "${ENGINE_CHECK:-github-release,pypi}" ${REASON:+--reason "$REASON"} \
                  "${AUDIT[@]}" --receipt-out "$RUNNER_TEMP/receipt.json" $YES
              fi ;;
            promote)
              [ "$LEGACY" = "0" ] || { echo "::error::promote 只接受带随包清单的新版 Release；旧版只能 bootstrap"; exit 1; }
              [ -n "$EXPECTED" ] || { echo "::error::promote 需要 expected_remote_sha"; exit 1; }
              $P promote --staging "$STAGE" --source-sha "$SOURCE_SHA" --release-tag "$TAG" \
                --expected-remote-sha "$EXPECTED" --engine-check "${ENGINE_CHECK:-github-release,pypi}" \
                ${REASON:+--reason "$REASON"} "${AUDIT[@]}" --receipt-out "$RUNNER_TEMP/receipt.json" $YES ;;
            rollback)
              [ -n "$EXPECTED" ] && [ -n "$TO" ] && [ -n "$REASON" ] || \
                { echo "::error::rollback 需要 expected_remote_sha / rollback_to / reason"; exit 1; }
              $P rollback --to "$TO" --expected-remote-sha "$EXPECTED" --authorized-by "$ACTOR" \
                --reason "$REASON" "${AUDIT[@]}" --receipt-out "$RUNNER_TEMP/receipt.json" $YES ;;
          esac
          if [ -f "$RUNNER_TEMP/receipt.json" ]; then
            python3 - "$RUNNER_TEMP/receipt.json" "$MODE" "$CONFIRM" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding="utf-8"))
          suffix = "" if sys.argv[3] == "true" else "（演练）"
          print(f"### plugin-stable · {sys.argv[2]}{suffix}\n")
          for k in ("action", "reason", "remote_tip", "remote_version", "new_version", "commit", "push", "verified_remote"):
              if k in p:
                  print(f"- {k}: `{p[k]}`")
          PY
          fi

      - name: 撤掉推送凭据
        if: always()
        run: git config --global --unset-all "http.https://github.com/.extraheader" || true

      - name: 留下收据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-stable-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: ignore
