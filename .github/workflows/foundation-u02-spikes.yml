name: Foundation U02 spikes

# 统一实施包 U02 的两个技术证明（render_spike / runtime_spike）在**托管 runner 的三个平台**上
# 各跑一遍，产出 evidence 工件。它不是门禁、不进任何 Gate 的闭集、不是 required check——U02 任务书说
# 「至少一个可用真实目标」，这里给 Linux / Windows / macOS 各一份真实运行的证据（run 号记在
# `docs/implementation/tavotto-foundation/handoffs/U02_spikes.md`）。
#
# 触发：`workflow_dispatch`，以及**只在 spike 自己的文件变动时**的 `pull_request`（paths 过滤）。后者是因为
# `gh workflow run` 只认默认分支上已登记的 workflow——新 workflow 在合入 main 之前派发不了，而 U02 要在
# PR 阶段就拿到另一目标的证据。合入 main 之后 dispatch 也能用。
#
# 每条腿做的事（全部只写 runner.temp，主仓库 .venv / pyproject 一个字不碰）：
#   1. 建独立 spike venv，装 scripts/dev/u02_spikes/requirements.txt 钉死的候选包；
#   2. 按 hash 下载批准字体（dev.u02_spikes.fonts）；
#   3. render_spike：写 PDF → 三把独立读取器核对 → 与 git 里的 evidence 逐字节比（信息，不判）；
#   4. tests/test_foundation_u02_*.py 在 spike venv 里跑（真 child 用例在这里不 skip）；
#   5. freeze_spike：PyInstaller 最小候选冻结 + 冻结 exe 自起 child 真渲染；
#   6. runtime_spike：uv + pbs CPython + 离线 wheel 安装 + 坏 hash / 无网负例（Windows 腿还真跑
#      embeddable 的 `python.exe -m venv` 看它失败）。
#
# 任一步退出非零就红——红是真红，这个 workflow 没有 continue-on-error。
#
# **寿命**：这是 U02 的证据工作流，不长期存在。render 这一半（fonts / render_spike / U02 用例 / freeze）
# 在 U06 / U07 把真实用例接进 src/ + tests/ 之后由那两个阶段删除或收编；runtime 这一半（runtime_spike）
# 在 U05 把 provisioner 接进产品之后同样处理。到那时连同 scripts/dev/u02_spikes/ 与
# tests/test_source_hygiene.py 里 render_child.py 的那条例外一起清掉；evidence/u02/ 与两份 ADR 留作记录。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/foundation-u02-spikes.yml"
      - "scripts/dev/u02_spikes/**"
      - "tests/test_foundation_u02_*.py"
      - "docs/implementation/tavotto-foundation/evidence/u02/render/truth.json"

permissions:
  contents: read

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_NO_UPDATE_CHECK: "1"
  PYTHONUTF8: "1"

# 与 ci.yml 同一条纪律：cancel-in-progress 只对 PR 开（同一 PR 新 push 才取消旧 run）；
# workflow_dispatch 的 run 各自是一次证据采集，排队不取消。组名带 ref：PR 的 ref 是
# refs/pull/N/merge，与 dispatch 的分支 ref 绝不同组。
concurrency:
  group: foundation-u02-spikes-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spikes:
    name: spikes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 路径与 spike venv
        shell: bash
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, pathlib, sys
          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          venv = tmp / "spike-venv"
          py = venv / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          print("PYTHONPATH=" + os.pathsep.join([str(ws / "scripts"), str(ws / "src")]))
          print("SPIKE_VENV=" + str(venv))
          print("SPIKE_PY=" + str(py))
          print("U02_FONTS=" + str(tmp / "u02-fonts"))
          print("U02_EVIDENCE=" + str(tmp / "u02-evidence"))
          EOF
      - name: 建 spike venv 并装钉死的候选包
        shell: bash
        run: |
          python -m venv "$SPIKE_VENV"
          "$SPIKE_PY" -m pip install --upgrade pip
          "$SPIKE_PY" -m pip install -r scripts/dev/u02_spikes/requirements.txt
          "$SPIKE_PY" -m pip freeze
          "$SPIKE_PY" -c "import tavotto, dev.u02_spikes; print(tavotto.__file__)"

      - name: 批准字体（按 hash 下载）
        shell: bash
        run: |
          "$SPIKE_PY" -m dev.u02_spikes.fonts --dest "$U02_FONTS"

      - name: render_spike（写 PDF + 三把独立读取器）
        shell: bash
        run: |
          mkdir -p "$U02_EVIDENCE/render"
          cp docs/implementation/tavotto-foundation/evidence/u02/render/truth.json "$U02_EVIDENCE/render/truth.json"
          "$SPIKE_PY" -m dev.u02_spikes.render_spike --fonts "$U02_FONTS" --out "$U02_EVIDENCE/render"
      - name: render_spike 产物与 git 里的 evidence 比（信息，不判）
        shell: bash
        run: |
          "$SPIKE_PY" - <<'EOF'
          import hashlib, os, pathlib
          ev = pathlib.Path(os.environ["U02_EVIDENCE"]) / "render"
          git = pathlib.Path("docs/implementation/tavotto-foundation/evidence/u02/render")
          for name in ("spike.pdf", "spike_pdfium.png"):
              a = hashlib.sha256((ev / name).read_bytes()).hexdigest()
              b = hashlib.sha256((git / name).read_bytes()).hexdigest()
              print(f"{name}: {'IDENTICAL to git' if a == b else 'DIFFERS from git'}  ci={a[:12]} git={b[:12]}")
          EOF

      - name: U02 用例（spike venv 里跑，真 child 不 skip）
        shell: bash
        run: |
          "$SPIKE_PY" -m pytest tests/test_foundation_u02_render.py tests/test_foundation_u02_render_child.py tests/test_foundation_u02_runtime.py -p no:cacheprovider -rs -q --junitxml="$U02_EVIDENCE/pytest-u02.xml"

      - name: freeze_spike（PyInstaller 最小候选冻结 + 冻结 exe 自起 child）
        shell: bash
        run: |
          "$SPIKE_PY" -m dev.u02_spikes.freeze_spike --fonts "$U02_FONTS" --pdf docs/implementation/tavotto-foundation/evidence/u02/render/spike.pdf --out "$U02_EVIDENCE/freeze"

      - name: runtime_spike（uv + pbs CPython + 离线安装 + 负例）
        shell: bash
        run: |
          "$SPIKE_PY" -m dev.u02_spikes.runtime_spike --out "$U02_EVIDENCE/runtime"

      - name: 上传 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u02-evidence-${{ matrix.os }}
          path: ${{ env.U02_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 30
