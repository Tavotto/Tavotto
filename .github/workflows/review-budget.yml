name: Review budget (advisory)

# A lightweight observation, not a fourth required check or a Codex trigger.
# Do not add pull_request_target, merge_group or credentials with write access.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing Tavotto PR number to audit"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read

# Never cancel CI / CodeQL / merge_group: this workflow owns a separate group.
concurrency:
  group: review-budget-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAVOTTO_NO_TELEMETRY: "1"

jobs:
  review-budget:
    name: Review budget (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted executable from main, not PR head. Fork PRs have read-only access.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Observe existing review evidence without requesting any review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/review-budget.json"
          if [ ! -f scripts/ci/review_budget.py ]; then
            echo '{"schema_version":1,"status":"unknown","reason":"trusted main script not merged yet"}' > "$OUTPUT"
            echo "### Review Budget (advisory)" >> "$GITHUB_STEP_SUMMARY"
            echo "Bootstrap: default branch has no auditor yet. No review coverage inferred." >> "$GITHUB_STEP_SUMMARY"
          elif ! python3 -I scripts/ci/review_budget.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --out "$OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Review budget evidence incomplete. No approval or merge verdict inferred."
          fi
      - name: Preserve compact JSON evidence (30 days)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: review-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/review-budget.json
          retention-days: 30
          if-no-files-found: warn
