name: Research S0 baseline (hosted observation)

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Frozen development case, or all
        type: string
        default: research_astro_celerite_sho

permissions:
  contents: read

concurrency:
  group: research-s0-${{ github.ref }}
  cancel-in-progress: true

env:
  TAVOTTO_NO_TELEMETRY: '1'
  TAVOTTO_NO_DIAG_UPLOAD: '1'
  TAVOTTO_NO_UPDATE_CHECK: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cohort.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify frozen registration without downloading or running projects
        id: cohort
        env:
          CASE_ID: ${{ inputs.case_id || 'research_astro_celerite_sho' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/compat_guardian_research.py verify
          args=()
          if [[ "$CASE_ID" != 'all' ]]; then args=(--case "$CASE_ID"); fi
          matrix="$(python scripts/ci/compat_guardian_research.py matrix "${args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  baseline:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAVOTTO_RESEARCH_CACHE: ${{ github.workspace }}/../research-sources
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch upstream files at frozen commits and verify SHA-256
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: python scripts/ci/compat_guardian_research.py fetch --case "$CASE_ID"
      - name: Install fixed measurement environment
        id: core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,ci]'
          python scripts/ci/runtime_pins.py --include-corpus --format lines > "$RUNNER_TEMP/runtime-constraints.txt"
          python -m pip install -r "$RUNNER_TEMP/runtime-constraints.txt"
      - name: Approved fonts
        id: fonts
        run: |
          python scripts/fetch_fonts.py
          python scripts/fetch_fonts.py --check
      - name: Prepare original scientific prerequisites
        id: scientific
        env:
          CASE_ID: ${{ matrix.case_id }}
          SOURCE_PACKAGE: ${{ matrix.source_package }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CASE_ID" =~ ^research_[a-z0-9_]+$ ]]
          python -m pip install -c "$RUNNER_TEMP/runtime-constraints.txt" \
            -r "tests/compat/research-environments/$CASE_ID.txt"
          if [[ "$SOURCE_PACKAGE" == 'true' ]]; then
            python scripts/ci/compat_guardian_research.py stage-dependency \
              --case "$CASE_ID" --out "$RUNNER_TEMP/scientific-source"
            python -m pip install -c "$RUNNER_TEMP/runtime-constraints.txt" "$RUNNER_TEMP/scientific-source"
          fi
          python -m pip check
          python scripts/ci/compat_guardian_research.py verify-environment --case "$CASE_ID"
      - name: Prepare original TeX prerequisites
        id: tex
        if: ${{ !cancelled() && matrix.tex }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science cm-super dvipng
      - name: Observe native and Tavotto without rewriting the research script
        if: ${{ !cancelled() && steps.core.outcome == 'success' && steps.fonts.outcome == 'success' && steps.scientific.outcome == 'success' && (steps.tex.outcome == 'success' || steps.tex.outcome == 'skipped') }}
        timeout-minutes: 18
        env:
          CASE_ID: ${{ matrix.case_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CASE_ID" =~ ^research_[a-z0-9_]+$ ]]
          set +e
          python scripts/ci/compat_guardian.py run --suite compat_engine \
            --case "$CASE_ID" --expected-sha "$GITHUB_SHA" --timeout 900 \
            --out "$RUNNER_TEMP/research-s0" > "$RUNNER_TEMP/research-s0.out" 2>&1
          code=$?
          set -e
          grep -E '^[A-Za-z0-9_]+: [a-z_]+$' "$RUNNER_TEMP/research-s0.out" || true
          if [[ "$code" != 0 ]]; then
            echo "::error::S0 observation exited $code; non-passing outcomes remain visible"
            tail -n 30 "$RUNNER_TEMP/research-s0.out"
          fi
          exit "$code"
      - name: Record prerequisite outcomes even when observation could not start
        if: ${{ !cancelled() }}
        env:
          CASE_ID: ${{ matrix.case_id }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          FONTS_OUTCOME: ${{ steps.fonts.outcome }}
          SCIENTIFIC_OUTCOME: ${{ steps.scientific.outcome }}
          TEX_OUTCOME: ${{ steps.tex.outcome }}
        shell: bash
        run: |
          python -m pip freeze --all > "$RUNNER_TEMP/research-installed.txt"
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          receipt = {
              'schema': 'tavotto-research-setup/1',
              'case_id': os.environ['CASE_ID'],
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'python': platform.python_version(),
              'steps': {k: os.environ[k.upper() + '_OUTCOME'] for k in ('core', 'fonts', 'scientific', 'tex')},
              'installed_sha256': hashlib.sha256((root / 'research-installed.txt').read_bytes()).hexdigest(),
          }
          (root / 'setup-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Validate complete evidence in its producing checkout
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/research-s0/*/reports/guardian.json)
          [[ ${#reports[@]} -eq 1 ]]
          python scripts/ci/compat_guardian.py validate "${reports[0]}"
          cat "$(dirname "${reports[0]}")/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve allowlisted observation artifacts including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: research-s0-${{ matrix.case_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/setup-receipt.json
            ${{ runner.temp }}/research-installed.txt
            ${{ runner.temp }}/research-s0/*/reports/guardian.json
            ${{ runner.temp }}/research-s0/*/reports/summary.md
            ${{ runner.temp }}/research-s0/*/reports/guardian.unvalidated.json
            ${{ runner.temp }}/research-s0/*/evidence/**/*.png
            ${{ runner.temp }}/research-s0/*/evidence/**/*.pdf
          retention-days: 30
          if-no-files-found: error
