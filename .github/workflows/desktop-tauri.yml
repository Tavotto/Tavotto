name: Desktop apps (Tauri)

# 桌面发行的唯一链路：macOS .app/.dmg（签名 + 公证）与 Windows NSIS，
# 两个平台都是 Tauri 真窗口——桌面产物不再有「启动后开浏览器」的形态。
# 旧链路（desktop.yml：PyInstaller 直发 + Inno Setup + 免安装 zip）已于
# v0.3.0 退役删除，git 历史可找回。架构见 docs/adr/0002-tauri-desktop-shell.md。
#
# **两个平台的安装包都带内置渲染 runtime**（进 sidecar 的 _internal/runtime，
# 由 scripts/build_worker_runtime.py 生成、经 packaging/magplot.spec 收进）：
# 用户不用装 Python，首次渲染不联网。
#   Windows: 官方 embeddable          → runtime\python.exe
#   macOS:   python-build-standalone  → runtime/bin/python3.13（可重定位，逐个可签名；
#            python/python3 两个别名在构建时剪掉，Tauri 会把符号链接拍平成真副本）
# macOS 目前**只发 arm64**（runner 只有 Apple Silicon 一档）；Intel 的目标在
# packaging/runtime-lock.json 里标着 shipped=false，没构建过也没冒烟过。
#
# 验收原则：门禁打的是**最终用户启动的产物**——
# 1. sidecar 冒烟（scripts/smoke_desktop.py）对 PyInstaller 真二进制走完整链路：
#    动态端口 / nonce 认证 / 重放拒绝 / 打开项目 / 渲染 / 导出 / EOF 退出无孤儿；
# 2. 两个平台都跑 smoke_app.py --expect-source bundled --expect-runtime
#    （内置 runtime 真能渲染，且是「本该带、带的这份完整」）。
#    **刻意不建 worker-env、不设 MM_WORKER_PYTHON**：一条借来的解释器会让
#    「runtime 根本没打进去」全程绿灯，而那正是这条门禁唯一要挡的东西；
# 3. macOS 还要对**签完名的 .app 本体**再跑一次 smoke_app（从中文+空格路径），
#    并逐个校验 .app 里每个 Mach-O 都签到了、架构都对——签名/公证之后产物
#    还会不会跑，只有真跑一次才知道；
# 4. Windows 对 Tauri 真 .exe 做启动-探活-退出探针（壳 → sidecar → 收尾）。
on:
  # 打 tag 即自动构建并挂到 Release（与 release.yml 并行，省一半墙钟时间；
  # 「挂到 Release」步骤会先等 release.yml 把 Release 建出来）
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "基于哪个 tag 构建（如 v0.2.0）"
        required: true
      attach:
        description: "构建完挂到该 tag 的 Release 上"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  # Rust supervisor 的静态门禁。**只在 Linux 上跑一份**：它是纯标准库 + serde
  # 的 stdio 进程，没有任何平台分支，三平台各跑一遍只是把发布慢三倍。
  # 刻意不做 build 的 `needs`：clippy 挑剔一条命名不该把发行链堵死，
  # 但它必须与桌面构建同时可见（golden vectors 是 patch 身份的硬验收，
  # 那条真跑在 cargo test 里）。
  workerd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workerd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workerd
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # supervisor_behaviour.rs 起的是真二进制 + tests/fake_worker.py，
      # 靠 runner 自带的 python3（`PYTHON` 可覆盖）
      - run: cargo test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   bundles: app,  artifact: dmg }
          - { os: windows-latest, bundles: nsis, artifact: nsis }
    runs-on: ${{ matrix.os }}
    env:
      # tag 触发时 inputs 为空，一律经这个变量取目标 tag
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # 更新器包的 minisign 私钥（与 tauri.conf.json 里的 pubkey 配对）。
      # 没配 secret 时 createUpdaterArtifacts 会失败，所以构建那步按有没有
      # 密钥分岔——**发行链不能因为「暂时没配更新器」整个断掉**。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 确认该 tag 含 Tauri 配置
        shell: bash
        run: |
          test -f src-tauri/tauri.conf.json || {
            echo "::error::$RELEASE_TAG 这个 tag 里没有 src-tauri/——请选更新的 tag"
            exit 1
          }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # 两个 crate 都要缓存：src-tauri 是壳，workerd 是随 sidecar 一起发出去的
          # Rust supervisor（由 build_desktop.py 在 PyInstaller 之前 cargo build，
          # 跟随本平台的 host target，不交叉编译）
          workspaces: |
            src-tauri
            workerd

      - name: 缓存 CPython 归档下载
        uses: actions/cache@v4
        with:
          path: build/runtime-cache
          key: cpython-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/runtime-lock.json') }}

      - name: 构建内置渲染 runtime
        # 两个平台都要。脚本自己做 SHA-256 校验（macOS 那份的期望值取自
        # python-build-standalone 上游发布的 SHA256SUMS）、按 .dist-info 核对
        # 版本，并用 runtime 自己的解释器逐个 import + 画一张真图。
        # 任何一步不过就失败在这里——发出去之后再发现就晚了。
        # 目标按本机平台/架构自动挑（--target 可覆盖，交叉构建时才需要）。
        run: python scripts/build_worker_runtime.py --clean

      - name: 装打包依赖（Flask 父进程那点；科学栈刻意不装，免得进 sidecar）
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install "flask>=3.1,<4" "pymupdf>=1.24,<2"

      - name: 构建前端 + workerd + sidecar（PyInstaller onedir）
        # build_desktop.py 会先 cargo build --release 出 magplot-workerd，
        # magplot.spec 再把它收进 _internal/。cargo 缺席时脚本当场中止——
        # 静默少一个 workerd 的包在界面上完全看不出来（功能全在、只是慢）
        env:
          # **两个平台的发行包都必须自带 runtime**（落在 sidecar 的
          # _internal/runtime；NSIS 与 .app 各自经 bundle.resources 一起收走）。
          # 打开它之后 magplot.spec 会额外确认：清单 schema 对、平台/架构与本次
          # 构建一致、冒烟状态是 passed——少任何一条都当场失败，而不是安静地
          # 产出一个「装完不能渲染」的安装包。
          MAGPLOT_REQUIRE_RUNTIME: "1"
        run: python scripts/build_desktop.py --skip-tauri

      - name: 壳的单测（交接契约 --open/--stem）
        # **只在 macOS 这条腿跑一份**：解析的是纯字符串 argv，没有平台分支，
        # 两边各跑一遍只是多花一次 debug 编译。放在 sidecar 构建之后是因为
        # build.rs 要 ../dist/Magplot 这个资源存在才肯生成清单。
        # 契约的另一半在 Python 侧（tests/test_handoff.py::test_desktop_argv_contract）。
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test

      # 这里**刻意没有**「建一个 worker-env 再设 MM_WORKER_PYTHON」那一步。
      # 它曾经存在于 macOS 这条腿上，代价是整条门禁失去意义：借来的解释器让
      # 冒烟一路绿灯，而「内置 runtime 根本没打进安装包」这件事没有任何一处
      # 会发现——那正是用户装完打不开图的原因。渲染腿现在只能走内置 runtime，
      # 走不通就该红。

      - name: sidecar 冒烟（真产物：认证/项目/渲染/导出/退出）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/Magplot/Magplot.exe
          else EXE=dist/Magplot/Magplot; fi
          python scripts/smoke_desktop.py --sidecar "$EXE"

      - name: 发布前冒烟：内置 runtime 真能渲染
        # --expect-source bundled     渲染真的走了内置环境（没被别的 Python 抢先）
        # --expect-runtime            该带 runtime 的形态，且带的这份完整可用
        # --expect-packages           逐个 import 内置科学栈（文件在 ≠ 能用）
        # --expect-control-plane      这次渲染真的跑在 Rust supervisor 上
        # 少了它们，「runtime / workerd 根本没打进去」都会全程绿灯——
        # 两种缺失在界面上都毫无症状。
        # **刻意不设 MAGPLOT_WORKERD**：要验的是产物自带的那份被自动找到。
        # 脚本自己会把 MM_WORKER_PYTHON / Conda / PYTHONHOME 等一律摘干净。
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/Magplot/Magplot.exe
          else EXE=dist/Magplot/Magplot; fi
          python scripts/smoke_app.py --exe "$EXE" \
            --figures examples/runtime_check \
            --expect-source bundled --expect-runtime \
            --expect-control-plane workerd \
            --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib

      - name: Tauri build
        # CLI 版本钉死：src-tauri/windows/installer.nsi 按这个版本的上游模板
        # 打品牌补丁，模板与打包器必须同源（升级时同步 scripts/build_desktop.py）
        #
        # createUpdaterArtifacts 打开时打包器要签名，没有私钥会直接失败。
        # 没配 secret 就地关掉它并打一条 warning——安装包照发，只是这一版
        # 不进「软件内直接更新」。**不许静默**：空转的更新链比没有更坏。
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            pnpm dlx @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundles }}
          else
            echo "::warning::没有 TAURI_SIGNING_PRIVATE_KEY——本次不产出更新包，桌面版只能手动下载新版"
            pnpm dlx @tauri-apps/cli@2.11.4 build --bundles ${{ matrix.bundles }} \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # 发行链上的安装界面门禁。判的是 Tauri 把 {{...}} 展开后**真正喂给
      # makensis 的那份**中间脚本，不是仓库模板：installMode / license /
      # startMenuFolder / 语言表都是打包器那一刻才落定的。首次安装只应剩
      # 进度页与完成页；页面序列、UAC、中文路径这些要真装一遍才算数，
      # 那条链路挂在 nightly.yml 的「装一遍再冒烟」上。
      - name: 安装界面门禁（生成的中间 NSIS 脚本）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gen = @(Get-ChildItem src-tauri\target\release\nsis -Recurse `
                     -Filter installer.nsi -ErrorAction SilentlyContinue)
          if ($gen.Count -lt 1) {
            throw "找不到 tauri 渲染出来的中间脚本（打包器换了输出布局？）"
          }
          # 这一档的 venv 只装了打包用的东西，pytest 得现装
          python -m pip install --quiet --disable-pip-version-check pytest
          $env:MAGPLOT_NSIS_GENERATED = $gen[0].FullName
          python -m pytest -q tests/test_nsis_template.py
          if ($LASTEXITCODE -ne 0) { throw "安装界面门禁不过（退出码 $LASTEXITCODE）" }


      # ---------------- macOS：签名 + 公证（复用已趟通的流程，不经 Tauri 签名） ----------------
      - name: 导入签名证书
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          # 必须把钥匙串加进搜索列表（详见 desktop.yml 同名步骤的注释与教训）
          EXISTING=$(security list-keychains -d user | sed 's/^ *"//;s/"$//')
          # shellcheck disable=SC2086
          security list-keychains -d user -s /tmp/build.keychain $EXISTING
          security unlock-keychain -p ci /tmp/build.keychain
          security set-keychain-settings -lut 21600 /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci /tmp/build.keychain >/dev/null
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning /tmp/build.keychain

      - name: 架构核对（.app 里不许混进另一个架构的 Mach-O）
        # 签名**之前**先看架构：一个 x86_64 的 .so 混进 arm64 的包里，签名照样
        # 能过、公证也可能过，症状要等到用户 import 那个包时才出现
        # （"incompatible architecture"）。放在签名前是因为这一步不需要签名，
        # 而且没证书的构建（fork / 本地）也该被它挡住。
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Magplot.app
          python scripts/codesign_macos.py scan --app "$APP" --quiet \
            --expect-arch "$(python -c 'import platform;print(platform.machine())')"

      - name: 签名 .app（含嵌套 sidecar 与内置渲染 runtime）
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Magplot.app
          # 自内向外签**所有** Mach-O——漏一个公证就 Invalid，这是 0.1.3 时代
          # 用真公证换来的教训。内置 runtime 进来之后这件事从「几十个」变成
          # 「五百多个」（解释器 + numpy/scipy/pandas 的全部扩展模块），
          # 靠 `--deep` 是签不到的：它们躺在 Resources 里，不被识别为嵌套代码。
          # 脚本读魔数而不是 fork `file`，并且只给可执行文件挂 entitlements。
          python scripts/codesign_macos.py sign --app "$APP" \
            --identity "$MACOS_SIGN_IDENTITY" \
            --entitlements packaging/entitlements.plist

      - name: 签名验收（逐个 Mach-O + 架构 + 签名主体）
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Magplot.app
          ARCH=$(python -c "import platform;print(platform.machine())")
          # `--verify --deep` 验不出「Resources 里躺着一个没签名的 .so」——
          # 那种文件是被当作*资源*封进签名的，封条本身合法。所以必须逐个验。
          python scripts/codesign_macos.py verify --app "$APP" \
            --expect-arch "$ARCH" \
            --expect-identity "Authority=Developer ID Application"

      - name: 最终 .app 冒烟（签完名的产物，中文 + 空格路径）
        # **这一步才是「用户拿到的东西能不能用」**。前面那次冒烟打的是
        # dist/Magplot（PyInstaller 的裸产物），此刻这份已经被 Tauri 收进
        # .app、又被逐个重签过——hardened runtime 会不会拦下内置解释器加载
        # numpy 的 .dylib、签名有没有把某个扩展模块弄坏，只有真跑一次才知道。
        #
        # 从**中文 + 空格**的路径跑：国内用户最常见的一档，而 macOS 上
        # `.app` 被拖到「我的 文档」里是家常便饭。用 ditto 而不是 cp -R——
        # 它是 Apple 用来保留签名与扩展属性的那个工具。
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SRC=src-tauri/target/release/bundle/macos/Magplot.app
          DEST="$RUNNER_TEMP/我的 应用 目录"
          mkdir -p "$DEST"
          ditto "$SRC" "$DEST/Magplot.app"
          SIDECAR="$DEST/Magplot.app/Contents/Resources/sidecar/Magplot/Magplot"
          test -x "$SIDECAR" || { echo "::error::.app 里没有可执行的 sidecar: $SIDECAR"; exit 1; }
          # 拷完再验一次签名：ditto 保不住签名的话，用户从 dmg 拖进
          # /Applications 的那一份也一样坏
          codesign --verify --deep --strict "$DEST/Magplot.app"
          python scripts/smoke_app.py --exe "$SIDECAR" \
            --figures examples/runtime_check \
            --workdir "$RUNNER_TEMP/冒烟 数据" \
            --expect-source bundled --expect-runtime \
            --expect-control-plane workerd \
            --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib
          rm -rf "$DEST"

      - name: 打 .dmg
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p out
          VER="$RELEASE_TAG"; VER="${VER#v}"
          scripts/make_dmg.sh src-tauri/target/release/bundle/macos "out/Magplot-$VER-macOS.dmg"

      - name: 公证 .dmg
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        run: |
          set -euo pipefail
          VER="$RELEASE_TAG"; VER="${VER#v}"
          DMG="out/Magplot-$VER-macOS.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          CREDS="--apple-id $APPLE_ID --password $APPLE_APP_PASSWORD --team-id $APPLE_TEAM_ID"
          # shellcheck disable=SC2086
          ID=$(xcrun notarytool submit "$DMG" $CREDS --output-format json |
               python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "提交 ID: $ID"
          # shellcheck disable=SC2086
          xcrun notarytool wait "$ID" $CREDS || true
          # shellcheck disable=SC2086
          STATUS=$(xcrun notarytool info "$ID" $CREDS --output-format json |
                   python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "公证结果: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::公证详细日志"
            # shellcheck disable=SC2086
            xcrun notarytool log "$ID" $CREDS || true
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - name: macOS 更新包（必须在签名/公证之后重做）
        # tauri build 里顺手打的那个 tar.gz 装的是**还没签名**的 .app：更新器
        # 换上去之后 Gatekeeper 当场拦下来，用户拿到一个打不开的应用。
        # 所以那份丢掉，签完 + 钉上公证票据再重新打包、重新用 minisign 签名。
        if: runner.os == 'macOS' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Magplot.app
          test -d "$APP" || { echo "::error::找不到 $APP"; exit 1; }
          # 公证过就把票据钉进 .app：更新器换上去的那份也要能离线过 Gatekeeper。
          # 没公证（本地/无证书构建）时 stapler 会失败，那不该拦住整条链。
          xcrun stapler staple "$APP" || echo "::warning::.app 未公证，更新包不带票据"
          mkdir -p out
          tar -czf out/Magplot.app.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          pnpm dlx @tauri-apps/cli@2.11.4 signer sign out/Magplot.app.tar.gz
          test -f out/Magplot.app.tar.gz.sig || { echo "::error::签名文件没生成"; exit 1; }
          ls -l out/Magplot.app.tar.gz*

      - name: 未签名提示（缺证书时如实标注，不冒充可发行）
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY == ''
        run: echo "::warning::没有配置签名证书——本次 dmg 未签名，仅供测试，不可发行"

      # ---------------- Windows：Tauri 真 .exe 启动-探活-退出探针 ----------------
      - name: Windows 桌面壳探针（壳 → sidecar → 退出收尾）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MAGPLOT_DATA_DIR   = "$env:RUNNER_TEMP\mp-data"
          $env:MAGPLOT_CONFIG_DIR = "$env:RUNNER_TEMP\mp-config"
          $exe = "src-tauri\target\release\Magplot.exe"
          if (!(Test-Path $exe)) { throw "壳二进制缺失: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          $side = $null
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            $side = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
                    Where-Object { $_.CommandLine -match "desktop-sidecar" }
            if ($side) { break }
          }
          if (-not $side) { Stop-Process -Id $p.Id -Force; throw "壳没有拉起 sidecar" }
          Write-Host "sidecar pid: $($side.ProcessId)"
          Stop-Process -Id $p.Id -Force   # 模拟异常退出：sidecar 必须经父监视自行退出
          foreach ($i in 1..30) {
            Start-Sleep -Milliseconds 500
            if (-not (Get-Process -Id $side.ProcessId -ErrorAction SilentlyContinue)) { break }
          }
          if (Get-Process -Id $side.ProcessId -ErrorAction SilentlyContinue) {
            throw "壳被杀后 sidecar 未退出（孤儿进程）"
          }
          Write-Host "壳退出 → sidecar 跟随退出 ✔"

      - name: 收集 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # 命名与 wheel / dmg 一致（Magplot-<ver>-Windows-Setup.exe），
          # 不用 NSIS 默认的 Magplot_<ver>_x64-setup.exe——升级用户认的是老名字
          $ver = "$env:RELEASE_TAG" -replace '^v', ''
          $nsis = @(Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe)
          if ($nsis.Count -ne 1) { throw "NSIS 产物数量异常（$($nsis.Count) 个）" }
          Copy-Item $nsis[0].FullName "out\Magplot-$ver-Windows-Setup.exe"
          # 更新包不在这里收：它要装**签过名的**那个 exe，而签名要等 SignPath
          # 回来（见后面「Windows 更新包」那步）。此刻 out/ 整个目录会被当成
          # 签名请求的输入，多塞一个 zip 进去只会让 SignPath 那边对不上。
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "APP_VERSION=$ver`n")
          Get-ChildItem out | Format-Table Name, Length

      - name: 上传待签名 Windows 安装包
        if: runner.os == 'Windows'
        id: upload-unsigned-windows-artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-signing-input-${{ github.run_id }}
          path: out/*
          if-no-files-found: error

      - name: 提交 Windows 安装包到 SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        id: signpath-windows
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-out
          parameters: |
            version: "${{ env.APP_VERSION }}"

      - name: 替换为 SignPath 签名结果
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem signed-out -Recurse -File -Filter "Magplot-$env:APP_VERSION-Windows-Setup.exe")
          if ($signed.Count -ne 1) {
            throw "SignPath 返回的签名安装包数量异常（$($signed.Count) 个）"
          }
          Copy-Item $signed[0].FullName "out\Magplot-$env:APP_VERSION-Windows-Setup.exe" -Force
          $signature = Get-AuthenticodeSignature "out\Magplot-$env:APP_VERSION-Windows-Setup.exe"
          if ($signature.Status -ne 'Valid') {
            throw "SignPath 返回的安装包签名无效：$($signature.Status)"
          }
          Write-Host "SignPath 签名有效：$($signature.SignerCertificate.Subject)"

      - name: 标记未签名测试产物
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED != 'true'
        run: Write-Warning "SIGNPATH_ENABLED 未开启：Windows 安装包未签名，仅供测试分发"

      - name: Windows 更新包（必须在 SignPath 签名之后重做）
        # 与 macOS 同一条道理：打包器顺手打的那个 nsis.zip 装的是**还没签名**的
        # 安装器，自动更新推给用户的就成了一个 SmartScreen 会拦的 exe——新装的人
        # 拿到签名版、升级的人拿到未签名版，比不签更难查。所以这里用 out/ 里那份
        # 最终安装包（SignPath 换过的那个）现做一个 zip，再用 minisign 签它。
        #
        # zip 里放什么名字不影响更新器：它解开后找第一个 .exe 执行。但 **zip 自己
        # 的文件名要能被 make_updater_manifest.py 认出来**（*-setup.nsis.zip）。
        if: runner.os == 'Windows' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "out\Magplot-$env:APP_VERSION-Windows-Setup.exe"
          if (!(Test-Path $exe)) { throw "找不到最终安装包: $exe" }
          $zip = "out\Magplot_${env:APP_VERSION}_x64-setup.nsis.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force
          pnpm dlx @tauri-apps/cli@2.11.4 signer sign $zip
          if (!(Test-Path "$zip.sig")) { throw "更新包签名没生成" }
          Get-ChildItem out | Format-Table Name, Length

      # **两条腿都要传**：updater-manifest 只看 desktop-tauri-* 这些 artifact，
      # 「挂到 Release」那步喂不到它。这里曾经写着 runner.os == 'Windows'，
      # 于是 macOS 的 Magplot.app.tar.gz(.sig) 只上了 Release、从没进过清单，
      # latest.json 里一直只有 windows-x86_64——dmg 装的那批用户永远查不到
      # 新版本，而整条链全绿（v0.7.0 就是这么发出去的）。
      - name: 上传最终桌面产物（更新清单的输入）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tauri-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

      - name: 等 Release 存在（tag 触发时与 release.yml 并行，先到要等）
        # 不等就挂 = softprops 会替我们「创建」一个没有 notes 的 Release，
        # 与 release.yml 手写 notes 的那份撞车。等不到按失败处理，绝不静默。
        if: ${{ github.event_name == 'push' || inputs.attach }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            echo "· Release $RELEASE_TAG 还没建好（release.yml 可能仍在跑），20s 后重试（$i/30）"
            sleep 20
          done
          echo "::error::等了 10 分钟仍没有 $RELEASE_TAG 的 Release——检查 release.yml 是否失败"
          exit 1

      - name: 挂到 Release
        if: ${{ github.event_name == 'push' || inputs.attach }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/*

  # ---------------------------------------------------------------------------
  # 更新清单：两条腿都跑完才拼得出来（每条腿只知道自己那一半）
  # ---------------------------------------------------------------------------
  # 桌面版「软件内直接更新」的最后一环。壳按 tauri.conf.json 里的 endpoint
  # 拉 latest.json → 比版本 → 下载对应平台的包 → 用内置公钥校验签名 → 安装。
  # **没有这一份，壳永远查不到新版本**，前一版的用户就停在原地了。
  updater-manifest:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.attach }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-tauri-*

      - name: 有没有更新包（没配私钥就如实跳过，不产出半份清单）
        id: probe
        shell: bash
        run: |
          if compgen -G "artifacts/**/*.sig" > /dev/null; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::本次没有任何更新包（未配置 TAURI_SIGNING_PRIVATE_KEY）——桌面版这一版无法自动更新"
          fi

      - name: 合成 latest.json
        if: steps.probe.outputs.have == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 更新说明取 Release 正文（release.yml 手写的那份），拿不到就留空
          NOTES=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                    --json body -q .body 2>/dev/null || true)
          # 少一个平台 = 那个平台的用户永远收不到更新，而且全绿。硬要求两个都在。
          python scripts/make_updater_manifest.py \
            --artifacts artifacts --tag "$RELEASE_TAG" \
            --require darwin-aarch64,windows-x86_64 \
            --notes "$NOTES" --out out/latest.json
          cat out/latest.json

      - name: 挂到 Release
        if: steps.probe.outputs.have == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/latest.json
