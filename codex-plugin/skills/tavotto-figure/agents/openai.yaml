interface:
  display_name: "Tavotto Figure"
  short_description: "画论文级 matplotlib 图，画完直接进 Tavotto 微调"
  default_prompt: "用 $tavotto-figure 画这张图，画完交给 Tavotto 打开——图例位置、字号、线宽这些我自己在里面拖。"
# 本技能依赖本插件自带的 Tavotto MCP server：
# `value` 必须与 ../../../.mcp.json 的 server key 一致，`command` 必须与其
# `command` 一致（stdio 依赖按 command 做规范键匹配）——插件自带的那份 server
# 已满足此依赖，Codex 不会再弹安装提示。改任一侧必须同步另一侧
# （tests/test_codex_plugin.py 看护）。
dependencies:
  tools:
    - type: mcp
      value: tavotto
      transport: stdio
      command: python3
      description: "Tavotto 本地 MCP server（本插件 .mcp.json 自带；画布、预检、导出都靠它）"
policy:
  allow_implicit_invocation: true
