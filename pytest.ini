[pytest]
testpaths = tests
pythonpath = src
markers =
    slow: 真装依赖 / 有网络下载的用例（默认跳过，用 -m slow 单独跑）
addopts = -q -m "not slow" --strict-config

# `--strict-config`：pytest.ini 里出现**不认识的键**时当场 rc=4 报错，而不是
# 只发一条 warning 就当没这回事（实测：不带它 rc=0 + 1 warning，带它
# `ERROR: Unknown config option`）。写错一个名字、或者用上一个更高版本才有的
# 选项，症状都是「登记了但从没执行」——这道最便宜的检查专治那种静默为空。

# 一条用例卡住超过这个秒数就把**所有线程的栈**打出来（pytest 内置，不需要插件）。
# 它不杀用例——杀是 job 的 timeout-minutes 干的活；它解决的是另一半问题：
# **杀掉之后没人知道死在哪。** 2026-08-28 队列里那次，Windows 上 pytest 步骤
# 挂了 8 小时 20 分（同一个 job 上一轮 27:57 跑完），最后只能整个取消，
# 日志一个字都没留下——in_progress 的 job 取不到 blob。
#
# 300 秒的取法：本仓库最慢的单条用例是 native 那批真 spawn 进程的
# （`ATTACH_TIMEOUT = 300` 是它们自己的上限），所以低于 300 会在正常路径上误报。
# 实测的余量（2026-09-03、darwin、默认档 3828 条全量）：最慢的单条是 28.71s
# （`test_invariants_engine.py::test_exact_restore_is_pixel_and_manifest_identical[InvMix]`），
# 离 300 还有十倍——这个数字是下面那条开关的前提，改动前先重新量一次。
faulthandler_timeout = 300

# **刻意不开 `faulthandler_exit_on_timeout`**（issue #196 的 ② 考虑过，结论是不开）。
# 开了确实是「5 分钟带栈退出」而不是「dump 完继续挂满 job 的 45 分钟」（实测：
# 3 秒超时 + sleep(30) 的用例，false → rc=0/30.1s，true → rc=1/3.1s）。不开的理由
# 是它**关不掉的那一半**：
#
#   * 这个开关是会话级的，而两条车道只差一个 marker 表达式，pytest 没有按 marker
#     控制它的办法；
#   * `-m slow` 那一档真建 venv、真联网装 matplotlib，单条超过 300 秒完全正常，
#     硬退出会把一次慢的 pip install 变成假红；
#   * 而仓库里叫人跑 `-m slow` 的地方有九处（本文件的 markers、
#     `tests/test_bootstrap.py`、`tests/bridge/test_bridge_e2e.py`、
#     `docs/compatibility/COMPATIBILITY_BRIDGE_HANDOFF.md`、`docs/adr/0020`、
#     `docs/ci/release-qualification.md`、`_lab-qualification.yml`）。
#     一张要靠记性维护的例外清单，漏一处就是一次假红——**它失效的方向是危险的那边**。
#
# 换成「只在 CI 的快线用 `-o …=true` 打开」也不行：实测 `--strict-config` **不管**
# `-o` 上的未知键（`-o totally_made_up_key=1` 照样 rc=0），于是那条命令行一旦改名或
# 拼错就静默变成 no-op——正是上面 `--strict-config` 想消灭的那种失效。
#
# 已知的那次挂死在**解释器退出**那一刻（`tests/conftest.py` 的会话级线程门禁已经
# 盯住），用例级挂死本仓库一次都没记录过；job 的 `timeout-minutes` 仍然把损失兜成
# 有界的。要重开它，先解决上面那张九处的清单，别只改这一行。
