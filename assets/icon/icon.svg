<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-label="Magplot">
  <!-- 应用图标：一页正在排版的 Figure。沿用工作台配色（暖灰白底 / 近黑 ink /
       蓝色选择态），与 README hero 同一套视觉语言。
       元素刻意少而粗——图标要在 32px 的 Dock/任务栏里还能认出来，
       虚线、细刻度线那些在小尺寸上只会糊成一团。 -->
  <defs>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#f2f2ef"/>

    <!-- 纸张 -->
    <rect x="168" y="140" width="688" height="744" rx="14" fill="#ffffff"
          stroke="#cfcfc7" stroke-width="8"/>

    <!-- 上：折线面板 -->
    <g transform="translate(268 236)">
      <path d="M0 228 L0 0 M0 228 L300 228" fill="none" stroke="#a3a39a"
            stroke-width="16" stroke-linecap="round"/>
      <polyline points="30,196 108,120 186,148 282,26"
                fill="none" stroke="#1b1b18" stroke-width="34"
                stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 下：柱形面板，选中态 -->
    <g transform="translate(268 578)">
      <path d="M0 228 L0 0 M0 228 L300 228" fill="none" stroke="#a3a39a"
            stroke-width="16" stroke-linecap="round"/>
      <rect x="42"  y="120" width="62" height="108" fill="#1b1b18"/>
      <rect x="134" y="62"  width="62" height="166" fill="#5c5c55"/>
      <rect x="226" y="20"  width="62" height="208" fill="#4a63d8"/>

      <rect x="-44" y="-52" width="392" height="332" fill="none"
            stroke="#2f6fed" stroke-width="16"/>
      <g fill="#ffffff" stroke="#2f6fed" stroke-width="16">
        <rect x="-74" y="-82" width="60" height="60"/>
        <rect x="288" y="-82" width="60" height="60"/>
        <rect x="-74" y="250" width="60" height="60"/>
        <rect x="288" y="250" width="60" height="60"/>
      </g>
    </g>
  </g>
</svg>
