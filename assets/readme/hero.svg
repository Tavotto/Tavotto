<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Tavotto — edit the figure, keep the code</title>
  <desc id="hero-desc">Left: the Tavotto wordmark and the line “Edit the figure. Keep the code.” Right: a miniature of the editor — a matplotlib line plot whose title is selected with blue handles, a properties panel showing size 9 pt, colour and font, and a footer naming the source script fig1_kinetics.py.</desc>

  <!--
    README hero. Same visual language as workflow.svg — change the two together.
    Palette (authoritative copy lives in web/src/index.css):
      paper #f2f2ef · ink #1b1b18 · ink-2 #5c5c55 · ink-3 #6b6b64 · faint #a3a39a
      border #e3e3dd / #cfcfc7 · surface #ffffff · accent #2868b7 · selection #2f6fed
    Type: system stacks only — a README must not depend on a downloaded font.
    Editing the copy means the four <text> runs in #title-block; nothing else.
  -->
  <style>
    .ui    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .serif { font-family: "Times New Roman", Times, "Liberation Serif", serif; }
  </style>

  <rect width="1200" height="400" rx="24" fill="#f2f2ef"/>

  <!-- ───────────────────────── Wordmark and promise ───────────────────────── -->
  <g id="title-block" class="ui" transform="translate(72 0)">
    <!-- Brand mark: the <g id="brand-mark"> block is rewritten by scripts/build_brand_assets.py. -->
    <g id="brand-mark" transform="translate(0 100) scale(0.642857)" aria-hidden="true">
      <path d="M72 100.5L44.5 100.5C29.036 100.5 16.5 87.964 16.5 72.5L16.5 28.5L12.35 28.5C11.881 28.5 11.5 28.119 11.5 27.65L11.5 17.35C11.5 16.881 11.881 16.5 12.35 16.5L16.5 16.5L16.5 12.35C16.5 11.881 16.881 11.5 17.35 11.5L29.65 11.5C30.119 11.5 30.5 11.881 30.5 12.35L30.5 16.5L72.5 16.5C87.964 16.5 100.5 29.036 100.5 44.5L100.5 72L86.5 62.197L86.5 46.871C86.5 45.691 86.5 44.509 86.409 43.294C86.323 42.143 86.157 40.983 85.842 39.78C85.493 38.444 84.989 37.167 84.344 35.984C83.791 34.97 83.139 34.031 82.4 33.186C81.66 32.342 80.839 31.596 79.952 30.964C78.916 30.227 77.799 29.651 76.63 29.252C75.578 28.892 74.562 28.702 73.555 28.604C72.492 28.5 71.458 28.5 70.425 28.5L31.4 28.5C30.903 28.5 30.5 28.903 30.5 29.4L30.5 70.129C30.5 71.309 30.5 72.491 30.591 73.706C30.677 74.857 30.843 76.017 31.158 77.22C31.507 78.556 32.011 79.833 32.656 81.016C33.209 82.03 33.861 82.969 34.601 83.814C35.34 84.658 36.161 85.404 37.048 86.036C38.084 86.773 39.201 87.349 40.37 87.748C41.422 88.108 42.438 88.298 43.445 88.396C44.508 88.5 45.542 88.5 46.575 88.5L63.598 88.5L72 100.5Z" fill="#1b1b18" fill-rule="evenodd"/>
      <path d="M100.336 75.548C98.926 88.576 88.577 98.925 75.547 100.337L66.993 88.118C68.027 87.958 69.074 87.73 70.145 87.41C72.082 86.83 73.933 85.995 75.649 84.926C77.119 84.01 78.48 82.93 79.705 81.704C80.93 80.479 82.011 79.119 82.926 77.648C83.995 75.933 84.831 74.081 85.41 72.145C85.932 70.399 86.207 68.717 86.35 67.049C86.385 66.634 86.412 66.223 86.433 65.812L100.336 75.548Z" fill="#d7d7cf" fill-rule="evenodd"/>
    </g>
    <text x="104" y="168" font-size="68" font-weight="600" fill="#1b1b18">Tavotto<tspan
          font-size="23" font-weight="500" dy="-30" fill="#6b6b64">™</tspan></text>

    <text x="0" y="242" font-size="38" font-weight="600" fill="#1b1b18">Edit the figure. Keep the code.</text>
    <text x="0" y="290" font-size="26" fill="#5c5c55">A visual editor for matplotlib and</text>
    <text x="0" y="326" font-size="26" fill="#5c5c55">AI-generated scientific figures.</text>

    <g transform="translate(0 370)">
      <rect x="-1" y="-19" width="112" height="28" rx="6" fill="#e9f0f9"/>
      <text x="12" y="0" class="mono" font-size="17" fill="#2868b7">AGPL-3.0</text>
      <text x="134" y="0" class="mono" font-size="17" fill="#6b6b64">macOS · Windows · Linux</text>
    </g>
  </g>

  <!-- ─────────────── Product proof: one element, being edited ─────────────── -->
  <g id="editor" transform="translate(668 46)">
    <rect width="464" height="308" rx="14" fill="#ffffff" stroke="#e3e3dd"/>

    <path d="M0 34 H464" stroke="#e3e3dd"/>
    <g fill="#cfcfc7"><circle cx="20" cy="17" r="4"/><circle cx="36" cy="17" r="4"/><circle cx="52" cy="17" r="4"/></g>
    <text x="72" y="22" class="mono" font-size="14" fill="#a3a39a">Fig 1</text>

    <!-- the figure, with its title selected -->
    <g transform="translate(18 56)">
      <text x="146" y="20" class="serif" font-size="21" text-anchor="middle" fill="#1b1b18">Reaction kinetics</text>
      <rect x="43" y="0" width="206" height="27" fill="none" stroke="#2f6fed" stroke-width="1.5"/>
      <g fill="#ffffff" stroke="#2f6fed" stroke-width="1.5">
        <rect x="39" y="-4" width="8" height="8"/><rect x="245" y="-4" width="8" height="8"/>
        <rect x="39" y="23" width="8" height="8"/><rect x="245" y="23" width="8" height="8"/>
      </g>

      <g transform="translate(26 44)">
        <rect width="240" height="148" fill="none" stroke="#1b1b18" stroke-width="1.2"/>
        <g stroke="#1b1b18" stroke-width="1.2">
          <path d="M0 148 v5 M60 148 v5 M120 148 v5 M180 148 v5 M240 148 v5"/>
          <path d="M0 148 h-5 M0 99 h-5 M0 49 h-5 M0 0 h-5"/>
        </g>
        <path d="M2 146 C 36 110, 67 57, 119 35 S 198 16, 238 12"
              fill="none" stroke="#1b3d6f" stroke-width="2.4"/>
        <path d="M2 146 C 47 130, 87 105, 133 81 S 204 45, 238 34"
              fill="none" stroke="#c0563a" stroke-width="2.4" stroke-dasharray="8 5"/>
        <text x="120" y="180" class="serif" font-size="15" text-anchor="middle" fill="#1b1b18">Reaction time (min)</text>
        <text x="-16" y="74" class="serif" font-size="15" text-anchor="middle" fill="#1b1b18"
              transform="rotate(-90 -16 74)">Conversion</text>
      </g>
    </g>

    <!-- what that element exposes -->
    <g transform="translate(318 56)">
      <rect x="-8" y="-8" width="164" height="206" rx="8" fill="#f7f7f4" stroke="#e9e9e3"/>
      <text x="4" y="10" class="ui" font-size="14" font-weight="600" fill="#1b1b18">Title</text>

      <g class="ui" font-size="14">
        <text x="4" y="47" fill="#6b6b64">Size</text>
        <rect x="66" y="32" width="80" height="22" rx="4" fill="#ffffff" stroke="#e3e3dd"/>
        <text x="74" y="48" class="mono" font-size="13" fill="#1b1b18">9 pt</text>

        <text x="4" y="85" fill="#6b6b64">Colour</text>
        <rect x="66" y="70" width="80" height="22" rx="4" fill="#ffffff" stroke="#e3e3dd"/>
        <rect x="72" y="76" width="10" height="10" fill="#1b1b18"/>
        <text x="90" y="86" class="mono" font-size="13" fill="#1b1b18">#000</text>

        <text x="4" y="123" fill="#6b6b64">Font</text>
        <rect x="66" y="108" width="80" height="22" rx="4" fill="#ffffff" stroke="#e3e3dd"/>
        <text x="74" y="124" font-size="13" fill="#1b1b18">Serif</text>
      </g>

      <path d="M4 152 H146" stroke="#e3e3dd"/>
      <text x="4" y="174" class="ui" font-size="13" fill="#6b6b64">Source</text>
      <text x="4" y="192" class="mono" font-size="13" fill="#2868b7">fig1_kinetics.py</text>
    </g>
  </g>
</svg>
