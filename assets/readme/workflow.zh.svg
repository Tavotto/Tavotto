<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="240" viewBox="0 0 1200 240"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Tavotto 站在出图流程的哪一段</title>
  <desc id="wf-desc">从左到右四步。你、Claude 或 Codex 写的 Python 脚本跑 matplotlib，产出一份矢量 PDF；Tavotto 负责图内编辑、多面板排版与投稿前预检；结果是可直接投稿的 PDF 或 PNG。脚本全程是源头。</desc>

  <!--
    workflow.svg 的中文版：几何与配色逐字节相同，只换 <text>。
    改英文那份就要同步改这份（README.zh-CN.md 引用的是这一份）。
    paper #f2f2ef · ink #1b1b18 · ink-2 #5c5c55 · ink-3 #6b6b64 · faint #a3a39a
    border #e3e3dd · surface #ffffff · accent #2868b7 · accent tint #e9f0f9
    四个 <g class="step">，文案就是里面的 <text>。
  -->
  <style>
    .ui   { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
            "Noto Sans CJK SC", "Source Han Sans SC", "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .name { font-size: 21px; font-weight: 600; fill: #1b1b18; }
    .note { font-size: 15px; fill: #6b6b64; }
    .kick { font-size: 14px; letter-spacing: 0.6px; fill: #a3a39a; }
  </style>

  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#a3a39a"/>
    </marker>
  </defs>

  <rect width="1200" height="240" rx="20" fill="#f2f2ef"/>

  <g class="ui">
    <!-- 1 · 图从哪来 -->
    <g class="step" transform="translate(48 56)">
      <rect width="222" height="128" rx="10" fill="#ffffff" stroke="#e3e3dd"/>
      <text x="20" y="32" class="kick">你，或者一个 AI</text>
      <text x="20" y="66" class="name">Python 脚本</text>
      <text x="20" y="94" class="mono note">plot.py · Claude · Codex</text>
    </g>
    <path d="M282 120 H322" stroke="#a3a39a" stroke-width="1.6" marker-end="url(#wf-arrow)"/>

    <!-- 2 · 谁把它画出来 -->
    <g class="step" transform="translate(334 56)">
      <rect width="200" height="128" rx="10" fill="#ffffff" stroke="#e3e3dd"/>
      <text x="20" y="32" class="kick">渲染</text>
      <text x="20" y="66" class="name">matplotlib</text>
      <text x="20" y="94" class="note">产出一份矢量 PDF</text>
    </g>
    <path d="M546 120 H586" stroke="#a3a39a" stroke-width="1.6" marker-end="url(#wf-arrow)"/>

    <!-- 3 · 本仓库是这一段 -->
    <g class="step" transform="translate(598 40)">
      <rect width="286" height="160" rx="10" fill="#ffffff" stroke="#2868b7" stroke-width="1.6"/>
      <rect x="1" y="1" width="284" height="42" rx="9" fill="#e9f0f9"/>
      <path d="M1 43 H285" stroke="#2868b7" stroke-opacity="0.35"/>
      <text x="20" y="29" class="name" font-size="19" fill="#2868b7">Tavotto</text>
      <text x="20" y="76" class="note" fill="#1b1b18">在图里改</text>
      <text x="20" y="104" class="note" fill="#1b1b18">把面板排上版</text>
      <text x="20" y="132" class="note" fill="#1b1b18">投稿前检查一遍</text>
    </g>
    <path d="M896 120 H936" stroke="#a3a39a" stroke-width="1.6" marker-end="url(#wf-arrow)"/>

    <!-- 4 · 出来的是什么 -->
    <g class="step" transform="translate(948 56)">
      <rect width="204" height="128" rx="10" fill="#ffffff" stroke="#e3e3dd"/>
      <text x="20" y="32" class="kick">导出</text>
      <text x="20" y="66" class="name">Figure 1</text>
      <text x="20" y="94" class="note">PDF · PNG · 留档</text>
    </g>

    <!-- 脚本自始至终没有停止当源头 -->
    <g>
      <path d="M159 196 V216 H1050 V196" fill="none" stroke="#cfcfc7"
            stroke-width="1.4" stroke-dasharray="5 5"/>
      <rect x="470" y="202" width="260" height="28" rx="6" fill="#f2f2ef"/>
      <text x="600" y="221" class="note" text-anchor="middle" fill="#5c5c55">
        脚本始终是源头
      </text>
    </g>
  </g>
</svg>
