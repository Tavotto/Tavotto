[package]
name = "tavotto-workerd"
version = "0.18.1"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
description = "Tavotto 渲染 worker 的 supervisor：进程生命周期、队列合并、超时与取消"
publish = false

[lib]
name = "tavotto_workerd"
path = "src/lib.rs"

[[bin]]
name = "tavotto-workerd"
path = "src/main.rs"

[dependencies]
# arbitrary_precision：数字保留原始字面量。没有它，超出 u64 的整数字面量会被
# 解析成 f64，而 Python 侧 `json` 解析成 int 后按 int_out_of_range 剔除——
# 两边算出的 patch 身份会静默分叉，正是 ADR 0003 反复警告的那一类。
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
# 符号文件另存、发出去的二进制仍是剥光的（发行约定见 docs/RELEASING.md「调试符号」）：
# debug 只留行表（崩溃栈符号化够用，dSYM/PDB 比全量 DWARF 小得多）；
# split-debuginfo=packed 让 macOS 产出 .dSYM、Windows 产出 .pdb；strip=true 在 macOS 上剥掉二进制里的
# 调试段与符号表（实测体积与不开 debug 时只差 100 字节量级）。
# **Windows MSVC 上 strip 会连 PDB 一起不产出**：Windows 腿由 desktop-tauri.yml 用
# CARGO_PROFILE_RELEASE_STRIP=none 覆盖（MSVC 的 exe 本来就不内嵌调试段，只多一条 PDB 路径）。
debug = "line-tables-only"
split-debuginfo = "packed"
