# Tavotto 桌面壳（Tauri 2）：窗口 + 生命周期 + 菜单，业务全部在 Python sidecar。
# 架构与安全模型见 docs/adr/0002-tauri-desktop-shell.md。
[package]
name = "tavotto-desktop"
version = "0.18.1"
description = "Tavotto 桌面应用外壳"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 应用内更新：检查 → 下载 → 安装 → 重启（process 提供 restart）。
# 更新包的签名由 tauri.conf.json 里的 pubkey 校验，私钥只在 CI 里。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 更新来源编排（app_update.rs，ADR 0121）：下载停滞看门狗 / select；本机 IANA 时区判来源顺序；
# 发布时间按 RFC 3339 原样交给前端。三者都已在依赖树里（tauri / updater 插件 / chrono），不引入新的 crate。
tokio = { version = "1", default-features = false, features = ["time", "macros", "sync"] }
iana-time-zone = "0.1"
time = { version = "0.3", features = ["formatting"] }
# 镜像来源的重定向只许留在镜像主机（Policy::custom）；版本与 updater 插件所用的同一份
reqwest = { version = "0.13", default-features = false }
# reqwest 走 `rustls-no-provider`：必须有人先装好加密提供者，否则 Client::build 直接 panic。updater 插件只在它自己建 client 时才装，
# 所以壳最小诊断（shell_report.rs）发送前自己确保一次（ring，与 updater / tauri 所用同一份；树内已有，不引入新的 crate）
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 壳最小诊断包的摘要（shell_report.rs）；已在依赖树里（tauri / updater），不引入新的 crate
sha2 = "0.10"
rand = "0.9"
url = "2"
percent-encoding = "2"

# 主页拖放在 macOS 上旁听 WKWebView 的 performDragOperation 拿真实路径（native_drop.rs，
# ADR 0092）。版本与 wry 用的那份相同，不引入第二份 objc2。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Windows 主窗口的系统标题栏与页面顶栏同色（window_chrome.rs，DWM 的 caption / text color）。
# 版本与 tauri 用的那份相同（`WebviewWindow::hwnd()` 返回的就是它的 HWND），不引入第二份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
# app_update 的来源回退状态机用「本地假 HTTP 服务 + 测试密钥签名的假包」端到端验：
# 真 `UpdaterBuilder`（mock_app 里装插件）、真验签，只有网络是假的。
tauri = { version = "2", features = ["test"] }
minisign = "0.7"
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["time", "macros", "sync", "rt", "rt-multi-thread", "net", "io-util"] }

[profile.release]
# thin LTO + 默认 codegen-units：壳的业务全在 Python sidecar，fat LTO +
# 单 codegen unit 换不来可感知的体积/性能，却让每次发布的末端链接
# （rust-cache 帮不上的那段）多等数分钟——Windows 腿实测 6m44s 的大头。
lto = "thin"
strip = true
