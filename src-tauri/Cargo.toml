# Magplot 桌面壳（Tauri 2）：窗口 + 生命周期 + 菜单，业务全部在 Python sidecar。
# 架构与安全模型见 docs/adr/0002-tauri-desktop-shell.md。
[package]
name = "magplot-desktop"
version = "0.3.0"
description = "Magplot 桌面应用外壳"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
url = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
