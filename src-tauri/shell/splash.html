<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Magplot</title>
<style>
  /* 与 web/ 的视觉纪律同源：暖灰白底、近黑主色、层级靠留白 */
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #F2F2EF; color: #1A1A18;
    font: 13px/1.6 -apple-system, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { text-align: center; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  p  { margin: 0; font-size: 12px; color: #6E6E68; }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
         background: #8A8A83; margin: 0 2px; animation: b 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s } .dot:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: .6 } }
</style>
</head>
<body>
  <main>
    <h1>Magplot</h1>
    <p><span id="booting">正在启动渲染服务</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  </main>
  <script>
    // 这张页面在 tauri:// 源下，既没有 i18next，也读不到 sidecar 那个源的
    // localStorage——文案只能内联两份。语言由壳经 ?lang= 带过来（它记着上次
    // 的选择），拿不到再退回系统语言，最后才是中文。
    const STRINGS = {
      'zh-CN': { booting: '正在启动渲染服务' },
      'en-US': { booting: 'Starting the render service' },
    }
    // 与 web/src/i18n/locale.ts 的 normalizeLocale 同一条规则：只看主子标签
    const pick = (tag) => {
      const primary = String(tag || '').trim().toLowerCase().replace(/_/g, '-').split('-')[0]
      if (primary === 'zh') return 'zh-CN'
      if (primary === 'en') return 'en-US'
      return null
    }
    const q = new URLSearchParams(location.search)
    const locale = pick(q.get('lang')) || pick(navigator.language) || 'zh-CN'
    document.documentElement.lang = locale
    document.getElementById('booting').textContent = STRINGS[locale].booting
  </script>
</body>
</html>
